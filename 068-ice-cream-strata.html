<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Edible Outcrop</title><style>body{margin:0;background:#f0c8b4;color:#6e4843;font:16px Georgia}header,footer{padding:3vh 6vw}small,label{font:12px monospace;letter-spacing:.13em}h1{font:italic clamp(44px,8vw,110px)/1 Georgia;letter-spacing:-.065em;margin:.1em 0}canvas{display:block;width:100%;height:47vh;cursor:crosshair;background:#fff0d6;border-block:6px double #6e4843}footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1em}button{font:16px Georgia;color:inherit;background:none;border:1px solid;padding:9px 14px}</style><header><small>GELATERIA DEI SASSI · SECTION B</small><h1>The edible outcrop.</h1><i>Morello cherry / almond milk / pistachio / burnt sugar</i></header><canvas aria-label="Layered gelato ready for scooping"></canvas><footer><label id="count">SERVINGS CUT / 00</label><div><button id="serve">Take a scoop</button> <button id="fill">Refill</button></div></footer><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),holes=[];function paint(){let w=c.clientWidth,h=c.clientHeight,d=Math.min(devicePixelRatio,2);c.width=w*d;c.height=h*d;g.scale(d,d);let cols=['#b76768','#f2d1ba','#9ba777','#a87452','#e8a8a2','#e9c999'];g.fillStyle=cols[0];g.fillRect(0,0,w,h);for(let i=0;i<12;i++){g.fillStyle=cols[i%6];g.beginPath();for(let x=0;x<=w+5;x+=4){let u=x/w,y=h*(i*.09-.09+.074*Math.sin(u*8+i*.35)+.048*Math.sin(u*15-i*.45));g.lineTo(x,y)}g.lineTo(w,h);g.lineTo(0,h);g.fill()}for(let i=0;i<1200;i++){g.fillStyle=i%3?'#71493438':'#fff4d980';g.beginPath();g.ellipse((i*13.73%1)*w,(i*i*.4371%1)*h,1+i%4,.7+i%2,.5,0,7);g.fill()}for(const [x,y] of holes){let r=Math.min(w,h)*.105;g.fillStyle='#fff0d6';g.beginPath();g.arc(x*w,y*h,r,0,7);g.fill();g.strokeStyle='#af9180';g.lineWidth=2;g.stroke()}count.textContent='SERVINGS CUT / '+String(holes.length).padStart(2,'0')}function scoop(x,y){if(holes.length<100)holes.push([x,y]);paint()}c.onclick=e=>scoop(e.offsetX/c.clientWidth,e.offsetY/c.clientHeight);serve.onclick=()=>scoop(.1+(.23*holes.length)% .8,.15+(.31*holes.length)%.7);fill.onclick=()=>{holes.length=0;paint()};onresize=paint;paint()</script></html>
