<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand-Pulled, Plate Four</title><style>*{box-sizing:border-box}body{background:#f7db8c;color:#963c27;margin:4vw;font:16px Georgia}header{font:700 13px Arial;display:flex;justify-content:space-between;border-bottom:4px solid;padding-bottom:8px}h1{font:1000 clamp(44px,12vw,170px)/.9 Arial;letter-spacing:-.085em;margin:.15em 0}svg{width:100%;height:43vh;display:block;background:#f4ca72;border-block:1px solid}footer{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:16px}p{font-style:italic;color:#593925;max-width:37ch}label{font: bold 13px Arial;letter-spacing:.1em}input{accent-color:#963c27;display:block;width:min(70vw,240px);margin-top:9px}</style><header><span>WU &amp; DAUGHTERS</span><span>KITCHEN PLATE 04</span></header><h1>HAND-PULLED</h1><svg viewBox="0 0 820 340" preserveAspectRatio="none"><g id="pasta"></g><g fill="#963c27"><circle id="pegA" cy="38" r="15"/><circle id="pegB" cy="38" r="15"/></g></svg><footer><p>“When the middle nearly kisses the board, give the dough one more arm’s length.” — Auntie Wu</p><label>SEPARATE THE PEGS<input type="range" id="pull" min="0" max="100" value="44"></label></footer><script>function stretch(){let n=+pull.value,a=225-n*1.8,b=820-a,base=370-n*1.7,out='';for(let i=0;i<27;i++){let x=a+(i-13)*1.8,y=b+(i-13)*1.8,low=base-64+i*3.7;let d='M'+x+' 39 C'+(x+Math.sin(i*.25)*44)+' '+low+' '+(y-60+i*4)+' '+(low+Math.sin(i*.28)*32)+' '+y+' 39';out+='<path d="'+d+'" fill="none" stroke="#aa662e" stroke-width="5"/><path d="'+d+'" fill="none" stroke="#fff0a9" stroke-width="2.6"/>'}pasta.innerHTML=out;pegA.setAttribute('cx',a);pegB.setAttribute('cx',b)}pull.oninput=stretch;stretch()</script></html>
