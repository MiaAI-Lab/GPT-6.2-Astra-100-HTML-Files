<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Stone Alphabet</title><style>*{box-sizing:border-box}body{margin:0;background:#d7d1c7;color:#4f4947;min-height:100svh;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:5vw;gap:5vw;font-family:Georgia}svg{width:100%;max-height:73vh;filter:drop-shadow(5px 10px 0 #9e968c)}h1{font:normal clamp(41px,7vw,105px)/.89 Georgia;letter-spacing:-.07em;margin:.22em 0}small,output{font:12px monospace;letter-spacing:.15em}p{font:italic 20px/1.35 Georgia;max-width:24em}nav{display:flex;flex-wrap:wrap;gap:6px;margin:1.5em 0}button{background:#4f4947;color:#ede6da;border:0;padding:12px;font:15px Georgia}@media(max-width:660px){body{grid-template-columns:1fr;gap:2vh}svg{height:40vh}article{grid-row:1}h1 br{display:none}}</style><svg viewBox="-165 -185 330 370" aria-label="Engraved composite quarry mark"><defs><pattern id="grit" width="17" height="21" patternUnits="userSpaceOnUse"><circle cx="3" cy="7" r=".9" fill="#9d958a"/><path d="m11 13 3-1" stroke="#e4dbcf"/></pattern><g id="mark" fill="none" stroke-width="11" stroke-linecap="square" stroke-linejoin="bevel"><path id="gate" d="M-66 45V-55h88"/><path id="fork" d="M0 84V-4l46-48M0-4l-29-31"/><path id="spring" d="m-41 49 35-23 33 17 36-25"/></g></defs><path fill="#bdb5a9" d="m-132-162 236-7 35 34 3 279-26 26-245-9-19-22 3-266z"/><path fill="url(#grit)" d="m-132-162 236-7 35 34 3 279-26 26-245-9-19-22 3-266z"/><use href="#mark" stroke="#f5ebdc" transform="translate(2 4)"/><use href="#mark" stroke="#625c56"/><text x="-104" y="132" fill="#68615b" font-family="Georgia" font-size="13" letter-spacing="3">QUARRY MARK</text></svg><article><small>THE CUTTERS’ REGISTER</small><h1>Stone<br> alphabet.</h1><p>Three cuts make a name. Turn each stroke until the stone bears your mark.</p><nav><button>Gate ↻</button><button>Fork ↻</button><button>Spring ↻</button></nav><output>MARK / I · I · I</output></article><script>const states=[0,0,0],parts=[gate,fork,spring],roman=['I','II','III','IV'];document.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{states[i]=(states[i]+1)%4;parts[i].setAttribute('transform','rotate('+states[i]*90+')');document.querySelector('output').textContent='MARK / '+states.map(n=>roman[n]).join(' · ')})</script></html>
