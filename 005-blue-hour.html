<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Six Steps into Blue</title><style>*{box-sizing:border-box}body{background:repeating-linear-gradient(#182549 0 42px,#263352 43px);color:#e9ab77;margin:0;font:13px monospace}main{max-width:800px;margin:7vh auto;padding:0 7vw}h1{font:normal clamp(44px,8vw,96px)/1 Georgia;margin:.3em 0}.keys{height:47vh;display:flex;border-top:8px ridge #af835e;gap:3%;padding:0 5%;margin:5vh 0}button{cursor:pointer;border:1px solid;color:inherit;background:#182549;padding:10px;font:inherit}.keys button{flex:1;padding:2px 0 15px;align-content:end;border:0;border-radius:0 0 40% 40%;color:#30251e;background:linear-gradient(90deg,#98694b,#e9ab77 20%,#f4cf9b 45%,#b7825d 80%,#79583e);box-shadow:5px 10px 10px #101c36}.hit{animation:strike .55s cubic-bezier(.2,.8,.3,1)}@keyframes strike{20%{transform:scaleY(.94);filter:brightness(1.5)}}:focus-visible{outline:3px solid white}small{letter-spacing:.2em}@media(prefers-reduced-motion:reduce){.hit{animation:none;filter:brightness(1.4)}}</style><main><small>EVENING INSTRUMENT　 /　 OP. VI</small><h1>Six steps<br><i>into blue.</i></h1><div class="keys"></div><button id="sound">Enable sound</button> <button id="phrase">Play nocturne</button></main><script>
let ac,on=false,notes=['E','D','B','A','G','E'],hz=[659,587,494,440,392,330],keys=document.querySelector('.keys');sound.onclick=()=>{on=!on;if(on){ac??=new AudioContext();ac.resume()}sound.textContent=on?'Mute sound':'Enable sound'};function play(i){let b=keys.children[i];b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');if(on){let o=ac.createOscillator(),a=ac.createGain();o.frequency.value=hz[i];a.gain.setValueAtTime(.001,ac.currentTime);a.gain.exponentialRampToValueAtTime(.17,ac.currentTime+.015);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1);o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+1)}}notes.forEach((n,i)=>{let b=document.createElement('button');keys.append(b);b.textContent=n;b.style.height=(50+i*9)+'%';b.onclick=()=>play(i)});phrase.onclick=()=>{phrase.disabled=true;notes.forEach((_,i)=>setTimeout(()=>play(i),i*330));setTimeout(()=>phrase.disabled=false,2100)}
</script></html>
