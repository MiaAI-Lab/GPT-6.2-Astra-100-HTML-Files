<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arms of the Alphabet</title><style>*{box-sizing:border-box}body{margin:0;background:#eddfaf;color:#26383a;text-align:center;font:15px Georgia}header{margin:20px 5vw;border-block:3px double;padding:10px;letter-spacing:.24em;font:12px monospace}h1{margin:20px 0 0;font:italic clamp(35px,5vw,65px) Georgia}svg{width:min(100%,800px);height:48vh}.arm{transition:transform .6s cubic-bezier(.2,.75,.2,1);transform-origin:200px 140px}nav{max-width:730px;margin:auto;padding:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px}button{font:bold 19px Georgia;background:transparent;border:1px solid #26383a;color:inherit;width:44px;height:38px;cursor:pointer}button[aria-pressed=true]{background:#ad3137;color:#fff}@media(prefers-reduced-motion:reduce){.arm{transition:none}}</style><header>COASTAL SIGNAL SCHOOL　 /　 FIG. 31</header><h1>Arms of the alphabet</h1><svg viewBox="0 0 400 280"><defs><g id="flag"><path d="M200 138v104" stroke="#283a3b" stroke-width="4"/><path d="M200 196h42v46h-42" fill="#ad3137"/><path d="M200 196l42 46h-42" fill="#e2a925"/><path d="M200 139v47" stroke="#253738" stroke-linecap="round" stroke-width="11"/></g></defs><path d="M178 133q22-15 44 0l7 70h-13l3 55h-15l-4-52-4 52h-15l3-55h-13z" fill="#26383a"/><circle cx="200" cy="111" r="18" fill="#26383a"/><path d="M176 99h49l-6-9h-35z" fill="#ad3137"/><use href="#flag" id="leftArm" class="arm"/><use href="#flag" id="rightArm" class="arm"/><text id="letter" x="18" y="250" font-size="72" font-family="Georgia" font-style="italic" fill="#ad3137"></text></svg><nav id="keys" aria-label="Select a letter"></nav><p>Read from shore. Press a letter to raise its signal.</p><script>let pairs=['01','02','03','04','05','06','07','12','13','46','14','15','16','17','23','24','25','26','27','34','35','47','56','57','36','67'];function pick(i){let [a,b]=pairs[i];leftArm.style.transform='rotate('+a*45+'deg)';rightArm.style.transform='rotate('+b*45+'deg)';letter.textContent=String.fromCharCode(65+i);Array.from(keys.children).forEach((k,j)=>k.setAttribute('aria-pressed',i===j))}for(let i=0;i<26;i++){let b=document.createElement('button');b.textContent=String.fromCharCode(65+i);b.onclick=()=>pick(i);keys.append(b)}onkeydown=e=>{if(/^[a-z]$/i.test(e.key))pick(e.key.toUpperCase().charCodeAt(0)-65)};pick(15)</script></html>
