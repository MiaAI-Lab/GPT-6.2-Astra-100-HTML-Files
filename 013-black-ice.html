<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsidian Weather</title><style>body{margin:0;background:#202d39;color:#abcad3;font:12px monospace}canvas{width:100vw;height:100svh;display:block;position:relative;touch-action:none;cursor:crosshair}aside{position:absolute;bottom:6vh;left:5vw;pointer-events:none}h1{font:normal clamp(30px,5vw,69px) Georgia;margin:.2em 0}small{letter-spacing:.2em}.fallback{position:absolute;inset:24% 33%;background:conic-gradient(from 43deg,#354652,#b3d4dd,#314756,#66858e,#243340);clip-path:polygon(35% 0,89% 15%,100% 67%,51% 100%,5% 74%,0 31%)}canvas:focus-visible{outline:3px solid #abcad3;outline-offset:-5px}</style><div class="fallback"></div><canvas tabindex="0" aria-label="Move light over ice specimen"></canvas><aside><small>CRYOTHEQUE　 /　 XIII</small><h1>Obsidian Weather</h1>Move the inspection light　↔</aside><script>
let c=document.querySelector('canvas'),gl=c.getContext('webgl',{alpha:false}),x=.3,y=.75;if(gl){let p=gl.createProgram();function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);gl.attachShader(p,s)}shader(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}');shader(gl.FRAGMENT_SHADER,`precision mediump float;uniform vec2 size,light;void main(){vec2 q=(2.*gl_FragCoord.xy-size)/min(size.x,size.y);q.x*=1.22;q.y+=.03;float a=atan(q.y,q.x),r=length(q);float b=.61/(cos(mod(a+.3,1.0472)-.5236))*(1.+.09*sin(3.*a));vec3 col=vec3(.125,.176,.224);if(r<b){float face=floor((a+.3)/1.0472);float f=face+step(b*.69,r)*2.4;float v=.42+.34*sin(f*2.31+light.x*3.+light.y*2.)+.15*cos(r*3.+f);v+=.035*sin(q.x*186.+q.y*97.+sin(q.y*43.));col=mix(vec3(.085,.13,.18),vec3(.67,.79,.83),clamp(v,0.,1.));if(abs(r-b*.69)<.003)col+=.11;}gl_FragColor=vec4(col,1.);}`);gl.linkProgram(p);gl.useProgram(p);let buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let a=gl.getAttribLocation(p,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);function paint(){gl.uniform2f(gl.getUniformLocation(p,'size'),c.width,c.height);gl.uniform2f(gl.getUniformLocation(p,'light'),x,y);gl.drawArrays(gl.TRIANGLES,0,3)}function size(){let d=Math.min(2,devicePixelRatio);c.width=c.clientWidth*d;c.height=c.clientHeight*d;gl.viewport(0,0,c.width,c.height);paint()}onresize=size;size();c.onpointermove=c.onpointerdown=e=>{x=e.clientX/innerWidth;y=e.clientY/innerHeight;paint()};c.onkeydown=e=>{if(e.key.startsWith('Arrow')){e.preventDefault();x+=e.key==='ArrowLeft'?-.1:.1;paint()}}}else{c.onpointermove=e=>document.querySelector('.fallback').style.filter='brightness('+(e.clientX/innerWidth+.6)+')'}
</script></html>
