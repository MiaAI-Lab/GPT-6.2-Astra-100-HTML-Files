<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirror Mile</title><style>body{margin:0;background:#b5dce6;color:#4f4b61}canvas{position:fixed;inset:0;width:100%;height:100%;cursor:ew-resize;touch-action:none}header{position:absolute;top:8vh;left:6vw;pointer-events:none}h1{font:italic clamp(54px,9vw,132px)/1 Georgia;margin:.18em 0}small{font:12px monospace;letter-spacing:.16em}footer{position:absolute;bottom:6vh;right:6vw;font:italic 18px Georgia;pointer-events:none}canvas:focus-visible{outline:3px solid #51425a;outline-offset:-4px}</style><canvas tabindex="0" aria-label="Traverse salt flats using drag or arrows"></canvas><header><small>BASIN WALK　 /　 SOUTH SHORE</small><h1>Mirror Mile</h1></header><footer>Draw the distant shore sideways.</footer><script>let c=document.querySelector('canvas'),g=c.getContext('2d'),off=0,last=null;function paint(){let w=innerWidth,h=innerHeight,d=Math.min(2,devicePixelRatio);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);let H=h*.56,b=g.createLinearGradient(0,0,0,h);b.addColorStop(0,'#b5dce6');b.addColorStop(.56,'#f5d9c4');b.addColorStop(1,'#b4c8d0');g.fillStyle=b;g.fillRect(0,0,w,h);for(let j=0;j<3;j++){for(let sign of [-1,1]){g.fillStyle=['#c5a4ac','#ac899d','#896e89'][j];g.globalAlpha=sign===1?.57:1;g.beginPath();g.moveTo(0,H);for(let x=0;x<=w+3;x+=3){let u=(x+off*(j+1)*.3)/h,amp=(.52+.38*Math.sin(u*7+j*2)+.12*Math.sin(u*21+j)+.045*Math.sin(u*89)+.018*Math.sin(u*252))*h*(.22-j*.045);g.lineTo(x,H+sign*amp)}g.lineTo(w,H);g.fill()}}g.globalAlpha=1;for(let k=0;k<170;k++){let y=H+(h-H)*(k/170)**1.5;g.fillStyle=k%3?'#ffeed63c':'#817a8b35';g.fillRect((k*89.23%100)/100*w,y,w*(k%9+1)*.014,1)}}onresize=paint;paint();c.onpointerdown=e=>{last=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(last!==null){off+=last-e.clientX;last=e.clientX;paint()}};c.onpointerup=c.onpointercancel=()=>last=null;c.onkeydown=e=>{if(e.key.startsWith('Arrow')){off+=e.key==='ArrowLeft'?-50:50;paint()}}</script></html>
