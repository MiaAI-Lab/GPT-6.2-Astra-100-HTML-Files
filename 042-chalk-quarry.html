<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Chalk Yard</title><style>*{box-sizing:border-box}body{background:#bbdbd4;color:#29453e;font:15px monospace;margin:0}main{max-width:880px;margin:4vh auto;padding:0 5vw}h1{font:900 clamp(40px,7vw,82px)/1 Arial;margin:.2em 0;letter-spacing:-.07em}#yard:before{content:'NORTH FACE  /  LIFT 04';position:absolute;inset:9px 0 auto;padding:9px 12px;border-block:3px solid #43695c;background:repeating-linear-gradient(60deg,#83ac9f 0 2px,transparent 2px 24px);font:bold 11px monospace;letter-spacing:.18em}#yard{position:relative;overflow:hidden;height:48vh;min-height:250px;background:repeating-linear-gradient(0deg,transparent 0 27px,#43695c33 28px);border-block:4px solid #43695c}.slab{position:absolute;height:22px;border:1px solid #43695c;background:repeating-linear-gradient(170deg,#f1efdc 0 5px,#dedfc9 6px,#f4f1de 7px 11px);box-shadow:inset 0 -5px #95a99a}footer{display:flex;align-items:center;flex-wrap:wrap;gap:15px;margin-top:15px}button{background:#43695c;color:white;border:0;font:bold 16px monospace;padding:13px;cursor:pointer}input{accent-color:#43695c;width:140px}label{font-size:12px}</style><main><small>STONEWORKS / SHIFT GAME</small><h1>The chalk yard</h1><p>Drop the traveling slab. Only the part over stone will hold.</p><div id="yard"></div><footer><button id="drop">Drop slab ↓</button><span id="score" aria-live="polite"></span><label>MANUAL RAIL <input id="rail" type="range" min="0" max="100" value="50"></label></footer></main><script>let left,width,pos,n,moving,over,manual,reduce=matchMedia('(prefers-reduced-motion:reduce)');function block(x,w,y){let b=document.createElement('div');b.className='slab';Object.assign(b.style,{left:x+'%',width:w+'%',bottom:y+'px'});yard.append(b);return b}function next(){moving=block(pos,width,yard.clientHeight-86)}function reset(){yard.replaceChildren();left=30;width=40;n=0;pos=30;over=false;manual=false;for(let j=0;j<4;j++)block(14+j*4,72-j*8,4+j*15);block(left,width,64);next();score.textContent='00 COURSES';drop.textContent='Drop slab ↓'}function position(x){pos=x;moving.style.left=x+'%'}function tick(ms){if(!over&&!manual&&!reduce.matches)position((1+Math.sin(ms*.0017))*(100-width)/2);requestAnimationFrame(tick)}rail.oninput=()=>{if(!over){manual=true;position(rail.value/100*(100-width))}};drop.onclick=()=>{if(over)return reset();let a=Math.max(left,pos),b=Math.min(left+width,pos+width);moving.remove();if(pos<left||pos+width>left+width){let off=block(pos<left?pos:Math.max(b,pos),Math.min(width,Math.abs(pos-left)),64+(n+1)*18);if(!reduce.matches)off.animate([{transform:'translateY(0)'},{transform:'translateY(230px) rotate(35deg)'}],{duration:550,easing:'ease-in'});setTimeout(()=>off.remove(),550)}if(b>a){left=a;width=b-a;block(left,width,64+(++n)*18);score.textContent=String(n).padStart(2,'0')+' COURSES'}if(b<=a||n===7){over=true;drop.textContent='New stack';score.textContent+=n===7?' / COMPLETE':' / MISSED'}else{pos=left;next();manual=false}};reset();requestAnimationFrame(tick)</script></html>
