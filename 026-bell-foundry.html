<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Widow Bell</title><style>*{box-sizing:border-box}body{margin:0;background:#342d26;color:#e7b969;font:16px Georgia;text-align:center}main{max-width:900px;margin:auto;padding:4vh 5vw}header,footer{font:12px monospace;letter-spacing:.2em;border-block:1px solid #ac9768;padding:13px}svg{display:block;height:52vh;width:100%}h1{font-weight:400;font-size:clamp(43px,8vw,100px);margin:0}p{font-style:italic}button{background:#e7b969;color:#342d26;border:0;padding:14px 26px;font: bold 14px Georgia;margin:0 0 20px;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}</style><main><header>HARROW FOUNDRY　·　CASTING XII</header><svg viewBox="0 0 560 360" aria-label="Engraved bronze bell"><g id="bell" fill="none" stroke="#e7b969"><path d="M275 0v50h10V0M255 62q0-30 25-30t25 30"/><g id="ribs"></g><ellipse cx="280" cy="287" rx="162" ry="28"/><ellipse cx="280" cy="287" rx="143" ry="18"/><path d="M276 170v105q-16 15 4 29 21-14 4-29V170" fill="#ae8453"/></g></svg><h1>The Widow Bell</h1><p>Cast for the harbor that lost its lighthouse.</p><button id="strike">Strike bell · sound on</button><footer>BRONZE　 /　 NORTH GALLERY</footer></main><script>for(let i=0;i<=55;i++){let v=Math.cos(Math.PI*i/55);ribs.innerHTML+='<path d="M'+(280+v*26)+' 57 C'+(280+v*125)+' 65 '+(280+v*80)+' 220 '+(280+v*162)+' '+(287+Math.sin(i*Math.PI/55)*26)+'" opacity=".8"/>'}let ctx;strike.onclick=()=>{ctx??=new AudioContext();ctx.resume();[175,349,428,587,941].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.12/(i+1),ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+4);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+4)});if(!matchMedia('(prefers-reduced-motion:reduce)').matches){bell.style.transformOrigin='280px 32px';bell.animate([0,6,-4,2,-1,0].map(a=>({transform:'rotate('+a+'deg)'})),{duration:1400,easing:'ease-out'})}}</script></html>
