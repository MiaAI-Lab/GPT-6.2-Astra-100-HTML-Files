<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Through the Alder Book</title><style>*{box-sizing:border-box}body{background:#c5d5be;color:#354b43;text-align:center;margin:0}main{width:min(840px,92vw);margin:4vh auto}h1{font:italic clamp(33px,6vw,75px) Georgia;margin:.2em}svg{width:100%;display:block;background:#eddcb5;border:12px solid #354b43;box-shadow:5px 10px 0 #95a890}.layer{transform-origin:300px 180px;filter:drop-shadow(3px 5px 2px #28392e55)}p{font:italic 19px Georgia}label{font:11px monospace;letter-spacing:.15em}input{accent-color:#354b43;vertical-align:middle;width:35%;margin:0 12px}input:focus-visible{outline:3px solid}</style><main><h1>Through the Alder Book</h1><svg viewBox="0 0 600 360" aria-label="Paper forest tunnel framing a little house"><circle cx="348" cy="107" r="33" fill="#e9b775"/><path d="M0 233Q175 83 306 183T600 163V360H0" fill="#acbd9c"/><path d="M0 243Q270 155 390 221T600 190V360H0" fill="#8ea98b"/><g id="house"><path d="M277 180h49v41h-49" fill="#f0d2a0"/><path d="M269 183l32 -33 35 33z" fill="#a36048"/><path d="M299 196h11v25h-11" fill="#6b6651"/></g><g id="trees"></g></svg><p>Past the third stand of alder, a lamp was still burning.</p><label>CLOSED<input type="range" min="0" max="100" value="20" aria-label="Open the book">OPEN</label></main><script>for(let j=0;j<3;j++){let edge=145-j*44,ground=264+j*35,S='<path d="M0 0H'+edge+'q-38 75 -26 151l46 -49 -3 21 -45 65 -4 58 23 -24 -10 47Q196 '+(ground+39)+' 301 '+(ground+7)+'T600 '+ground+'V360H0Z"/>';let shapes=S+S.replace('<path','<path transform="translate(600 0) scale(-1 1)"');for(let k=0;k<44;k++){let x=(k*37%edge)+5,y=k*23%105;shapes+='<ellipse cx="'+x+'" cy="'+y+'" rx="17" ry="8" transform="rotate(-33 '+x+' '+y+')"/><ellipse cx="'+(600-x)+'" cy="'+y+'" rx="20" ry="9"/>'}trees.innerHTML+='<g class="layer" fill="'+['#829a79','#56745e','#354b43'][j]+'">'+shapes+'</g>'}let s=document.querySelector('input');s.oninput=()=>document.querySelectorAll('.layer').forEach((g,i)=>g.style.transform='scale('+(1+s.value*(i+1)*.002)+')');s.oninput()</script></html>
