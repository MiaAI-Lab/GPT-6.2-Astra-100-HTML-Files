<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cue Thirty-Two</title><style>*{box-sizing:border-box}body{margin:0;background:#292738;color:#efddc3;font:18px Georgia}main{max-width:980px;margin:auto;padding:4vh 5vw}header{display:flex;align-items:baseline;gap:1em;flex-wrap:wrap}h1{font:italic clamp(40px,7vw,85px) Georgia;margin:.15em 0}small{font:12px monospace;letter-spacing:.13em}canvas{display:block;background:#39405a;width:100%;height:44vh;border:12px ridge #a99170;box-shadow:0 9px 0 #171722}footer{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:20px}button{font:bold 14px monospace;background:#efddc3;color:#392e3a;padding:13px;border:0;cursor:pointer}</style><main><header><h1>Cue thirty-two.</h1><small>ACT II / WINTER GARDEN</small></header><canvas id="stage" aria-label="Paper birches on a winter theater stage"></canvas><footer><i>“At the closing of the gate, snow.”</i><button id="go">GO · SNOW</button></footer></main><script>let g=stage.getContext('2d'),frame,calm=matchMedia('(prefers-reduced-motion:reduce)').matches;function set(t=-1){let w=stage.clientWidth,h=stage.clientHeight,d=Math.min(2,devicePixelRatio);if(stage.width!==Math.round(w*d)||stage.height!==Math.round(h*d)){stage.width=w*d;stage.height=h*d}g.setTransform(d,0,0,d,0,0);g.fillStyle='#39405a';g.fillRect(0,0,w,h);g.fillStyle='#d6c5ab';g.beginPath();g.arc(w*.68,h*.26,h*.13,0,7);g.fill();for(let j=0;j<3;j++){g.beginPath();g.moveTo(0,h);for(let x=0;x<=w+3;x+=3)g.lineTo(x,h*(.66+j*.12)+Math.sin(x/w*9+j)*h*.07);g.lineTo(w,h);g.fillStyle=['#646a80','#7c8293','#a4a2a5'][j];g.fill()}for(let i=0;i<13;i++){let x=w*((i*37%101)/100),bottom=h*(.82+.13*(i%3)/2),height=h*(.29+.25*(i*21%97)/97);g.save();g.translate(x,bottom);g.rotate(Math.sin(i*19)*.09);g.fillStyle='#ddd4c7';g.fillRect(-3,-height,6,height);g.strokeStyle='#d7d0c5';for(let j=1;j<7;j++){let y=-height*j/8;g.beginPath();g.moveTo(0,y);g.lineTo((j%2?1:-1)*height*.17,y-height*.18);g.stroke();g.fillStyle='#555669';g.fillRect(-3,y,4,2)}g.restore()}if(t>=0){g.fillStyle='#efddc3';for(let i=0;i<185;i++){let y=(t*(42+i%35)-(i*71%430));if(calm)y=(i*47%100)/100*h;if(y<0||y>h)continue;let x=(i*.618034%1)*w+Math.sin(i+t*2)*10;g.fillRect(x,y,2+3*Math.abs(Math.cos(i+t*3)),2+i%3)}}}go.onclick=()=>{cancelAnimationFrame(frame);let start=performance.now();function snow(n){let t=(n-start)/1000;set(t);if(!calm&&t<(stage.clientHeight+450)/42)frame=requestAnimationFrame(snow)}frame=requestAnimationFrame(snow)};onresize=()=>set();set()</script></html>
