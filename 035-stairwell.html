<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landing Without End</title><style>*{box-sizing:border-box}body{margin:0;background:#d1c5b5;color:#483e34;font:14px monospace}main{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,30%);align-items:center;gap:4vw;padding:4vw}canvas{width:100%;aspect-ratio:1}h1{font:400 clamp(40px,6vw,88px)/.95 Georgia;letter-spacing:-.055em}button{border:1px solid;background:#483e34;color:#f1e9de;padding:14px 20px;font:inherit;cursor:pointer}p{line-height:1.6}small{border-top:2px solid;display:block;padding-top:8px}@media(max-width:700px){main{display:block}canvas{max-height:56vh;object-fit:contain}h1{margin:.35em 0}}</style><main><canvas id="shaft" aria-label="An infinite square spiral staircase"></canvas><section><small>CONCRETE STUDIES / PLAN V</small><h1>Landing without end</h1><p>A square of daylight follows you down. The ground floor has no number.</p><button id="step">Descend one landing ↓</button><p id="level" aria-live="polite">LEVEL 00</p></section></main><script>let c=shaft.getContext('2d'),angle=0,n=0,frame;function draw(a){let size=Math.min(1100,shaft.clientWidth*Math.min(2,devicePixelRatio));shaft.width=shaft.height=size;c.translate(size/2,size/2);c.scale(size/2,size/2);c.rotate(a);c.fillStyle='#483e34';c.fillRect(-1,-1,2,2);for(let k=0;k<11;k++){let r=.96*.78**k,u=r*.78;for(let side=0;side<4;side++){c.save();c.rotate(side*Math.PI/2);for(let j=0;j<10;j++){let f=j/10,g=(j+1)/10;c.fillStyle='hsl(34 15% '+(70-side*8-j*.7-k*1.8)+'%)';c.beginPath();c.moveTo(-r+2*r*f,-r);c.lineTo(-r+2*r*g,-r);c.lineTo(-u+2*u*g,-u);c.lineTo(-u+2*u*f,-u);c.closePath();c.fill();c.strokeStyle='#584e4377';c.lineWidth=.0035;c.stroke()}c.restore()}}}step.onclick=()=>{cancelAnimationFrame(frame);let from=angle,to=++n*Math.PI/2,t=performance.now();level.textContent='LEVEL −'+String(n).padStart(2,'0');function move(ms){let f=matchMedia('(prefers-reduced-motion:reduce)').matches?1:Math.min(1,(ms-t)/850);angle=from+(to-from)*(1-(1-f)**3);draw(angle);if(f<1)frame=requestAnimationFrame(move)}frame=requestAnimationFrame(move)};onresize=()=>draw(angle);draw(0)</script></html>
