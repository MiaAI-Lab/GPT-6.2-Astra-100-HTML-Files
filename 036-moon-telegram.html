<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cable from Mare Nix</title><style>*{box-sizing:border-box}body{margin:0;background:#222c38;color:#bad9b1;font:16px Consolas,monospace}main{max-width:980px;margin:auto;padding:8vh 6vw}header{border-block:2px solid;padding:12px 0;display:flex;justify-content:space-between;gap:8px;font-size:12px}h1{font:400 clamp(40px,7vw,90px)/1 monospace;letter-spacing:-.08em;margin:.6em 0}article{background:repeating-linear-gradient(0deg,#ffffff03 0 1px,transparent 1px 4px);border-block:2px dashed #89a99b;min-height:200px;margin:24px 0;padding:30px 0;color:#d0ebc9;font-size:clamp(20px,3.3vw,37px);line-height:1.45;text-shadow:0 0 7px #bad9b13b}button{font:inherit;background:#bad9b1;color:#222c38;border:0;padding:13px 18px;cursor:pointer}small{display:block;margin-top:20px;letter-spacing:.12em}</style><main><header><span>EXTRATERRESTRIAL CABLE OFFICE</span><span>RX 04</span></header><h1>Mare Nix<br>calling.</h1><small>ORIGIN　/　GLASSHOUSE SIX　·　PRIORITY C</small><article id="wire"></article><button id="decode">Engage decoder →</button><small id="state" aria-live="polite">CARRIER LOCKED · CIPHER INTACT</small></main><script>let code='KGMAT OYUTN AJXEW EZQWT QWIXN BRTNE XKLER POMGY NDRVA LTRFP ZZOAQ AVBET'.split(' '),words='THE FIRST ROSE OPENED DURING EARTHSET. NO ONE HERE REMEMBERS ITS NAME. — IVA'.split(' '),open=false,timer;function print(k){wire.textContent=words.map((w,i)=>i<k?w:code[i%code.length]).join(' ')}decode.onclick=()=>{clearInterval(timer);open=!open;decode.textContent=open?'Reseal cable ↶':'Engage decoder →';state.textContent=open?'TEXT ACCEPTED · END OF CABLE':'CARRIER LOCKED · CIPHER INTACT';let k=0;if(open&&!matchMedia('(prefers-reduced-motion:reduce)').matches){timer=setInterval(()=>{print(++k);if(k>=words.length)clearInterval(timer)},75)}else print(open?words.length:0)};print(0)</script></html>
