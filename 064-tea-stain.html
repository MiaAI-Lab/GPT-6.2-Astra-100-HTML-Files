<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aunt Nella’s Saucer</title><style>body{background:#e9d4b1;color:#704326;margin:0;display:grid;align-content:center;justify-items:center;min-height:100svh;text-align:center;font-family:Georgia}h1{font:italic clamp(32px,5vw,64px) Georgia;margin:.15em}figure{width:min(78vw,55vh);aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle,#f9ecd5 0 54%,#e0c7a0 56%,#f4e4c8 60%,#fff3d9 72%);box-shadow:2px 8px 14px #795a3c38,inset 0 0 0 3px #fff0d4,inset 0 0 0 6px #c9ab78;margin:2vh}svg{position:absolute;inset:0;width:100%;height:100%;transition:transform 1s cubic-bezier(.3,.9,.3,1)}figcaption{position:absolute;inset:39% 20% auto}b{display:block;font-size:clamp(22px,4vw,46px)}small{font:11px monospace;letter-spacing:.17em}button{background:none;color:inherit;border:0;border-bottom:1px solid;padding:.4em;font:italic 19px Georgia}p{max-width:28em;padding:0 1em}@media(prefers-reduced-motion:reduce){svg{transition:none}}</style><small>HOUSEHOLD DIVINATIONS</small><h1>Aunt Nella’s Saucer</h1><figure><svg viewBox="-150 -150 300 300"></svg><figcaption><small>THE SIGN OF</small><b id="omen">The latch</b></figcaption></figure><p id="reading">A familiar door will stick. Lift it a little as you turn.</p><button>Turn the saucer ↻</button><script>const s=document.querySelector('svg');for(let j=0;j<20;j++){let d='';for(let n=0;n<=180;n++){let a=n*Math.PI/90,r=83+Math.sin(a*5+j*.3)*2+Math.cos(a*13+j*.2)*1.5+j*.33;d+=(n?'L':'M')+Math.cos(a)*r+' '+Math.sin(a)*r} s.insertAdjacentHTML('beforeend','<path d="'+d+'Z" fill="none" stroke="#7c492c" opacity=".12"/>')}for(let i=0;i<80;i++){let a=i*2.31,r=75+12*Math.sin(i*22);s.insertAdjacentHTML('beforeend','<ellipse transform="rotate('+a*50+') translate('+r+' 0) rotate('+i*29+')" rx="'+(1+i%4)+'" ry="1" fill="#644229"/>')}let k=0;document.querySelector('button').onclick=()=>{k++;s.style.transform='rotate('+k*120+'deg)';omen.textContent=['The latch','The thimble','The spoon'][k%3];reading.textContent=['A familiar door will stick. Lift it a little as you turn.','Something frayed is waiting for your smallest needle.','Set another place. There will be just enough soup.'][k%3]}</script></html>
