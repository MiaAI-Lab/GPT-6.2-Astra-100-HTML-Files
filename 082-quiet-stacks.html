<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shelf of Small Silences</title><style>*{box-sizing:border-box}body{margin:0;background:#d3bdbe;color:#443946;font-family:Georgia}main{width:min(90vw,760px);margin:5vh auto}h1{font-weight:400;font-size:clamp(34px,6vw,72px);margin:.18em 0 .5em;letter-spacing:-.045em}small{font:12px monospace;letter-spacing:.12em}section{display:flex;justify-content:center;align-items:end;gap:3px;border-bottom:14px solid #534755;padding-top:32px}button{position:relative;writing-mode:vertical-rl;background:repeating-linear-gradient(90deg,#ffffff13 0 1px,transparent 1px 4px),var(--cloth);height:var(--h);width:clamp(46px,8vw,92px);text-align:center;display:grid;place-items:center;border:0;border-inline:6px double #d4b791;color:#fff1d6;font:clamp(16px,3.6vw,27px) Georgia;padding:10px;cursor:pointer;transition:transform .4s cubic-bezier(.2,.85,.3,1.1)}button[aria-pressed=true]{transform:translateY(-22px) rotate(-2deg)}blockquote{max-width:38ch;margin:26px auto;font:italic clamp(21px,3vw,32px)/1.35 Georgia}footer{text-align:center;margin-top:22px}@media(prefers-reduced-motion:reduce){button{transition:none}}</style><main><small>PRIVATE CIRCULATION　·　READING ROOM B</small><h1>Small silences.</h1><section aria-label="Books on the shelf"><button style="--h:34vh;--cloth:#534755">Dust at Noon</button><button style="--h:39vh;--cloth:#6e4849">The Absent Bell</button><button style="--h:31vh;--cloth:#48584d">Under Snow</button><button style="--h:37vh;--cloth:#60516a">Rooms Upstairs</button><button style="--h:33vh;--cloth:#734f36">After Applause</button></section><footer><small>OPENING LINE　/　SELECT A SPINE</small><blockquote id="line" aria-live="polite"></blockquote></footer></main><script>let quotes=['At noon even the dust stopped looking for somewhere to land.','When the bell was taken down, everyone still woke at six.','We knew the road was gone because the morning had no wheels.','From the room upstairs came the careful sound of someone listening.','She held her final bow until she could hear the curtain breathing.'];let books=[...document.querySelectorAll('button')];books.forEach((b,i)=>b.onclick=()=>{books.forEach(k=>k.setAttribute('aria-pressed',k===b));line.textContent='“'+quotes[i]+'”'});books[0].click()</script></html>
