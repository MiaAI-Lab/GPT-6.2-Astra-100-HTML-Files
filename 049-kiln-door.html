<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spyhole at Cone Nine</title><style>*{box-sizing:border-box}body{margin:0;background:#502721;color:#ffbc6c;font:15px monospace}main{max-width:1000px;margin:7vh auto;padding:0 5vw}header{display:flex;justify-content:space-between;border-block:1px solid;padding:12px 0;font-size:12px}h1{font:900 clamp(42px,8vw,100px)/.95 Arial;letter-spacing:-.055em;margin:.4em 0}.bricks{padding:5% 4%;background:repeating-linear-gradient(0deg,transparent 0 26px,#592a22 27px 30px),repeating-linear-gradient(90deg,#824839 0 78px,#592a22 79px 83px)}.port{position:relative;overflow:hidden;height:clamp(150px,28vh,280px);border:8px ridge #5a3d35;background:radial-gradient(ellipse at 45% 95%,#fff3a3,#ffbc6c 45%,#bd492c);display:flex;gap:5%;padding:0 5%;align-items:end}.pot{display:block;width:26%;height:73%;background:linear-gradient(90deg,#a13d26,#f78e46 55%,#ac4629);clip-path:polygon(35% 0,65% 0,61% 14%,76% 24%,94% 51%,90% 76%,71% 100%,29% 100%,10% 76%,6% 51%,24% 24%,39% 14%)}.pot:nth-child(2){height:46%;scale:1.2 1}.pot:nth-child(3){height:83%;scale:.7 1}.door{position:absolute;inset:0;background:repeating-linear-gradient(3deg,#3d302c 0 3px,#40322d 4px 6px);border:8px outset #56443d;display:grid;place-content:center;letter-spacing:.2em;font:bold clamp(14px,3vw,36px) Arial;color:#b7a28d}.door:before,.door:after{content:'●　●';position:absolute;left:4%;color:#856e5e;font:18px monospace}.door:before{top:9%}.door:after{bottom:9%}label{display:block;margin:20px 0}input{accent-color:#ffbc6c;width:100%;margin:12px 0}p{font:italic 18px Georgia}</style><main><header><span>EMBER YARD POTTERY</span><span>FIRING 49</span></header><h1>Cone nine.</h1><div class="bricks"><div class="port"><i class="pot"></i><i class="pot"></i><i class="pot"></i><div class="door" id="door">HOT FACE</div></div></div><label>INSPECTION SHUTTER <input id="handle" type="range" min="0" max="100" value="32"></label><p>Three stoneware siblings in the last orange hour.</p></main><script>handle.oninput=()=>door.style.transform='translateX('+handle.value+'%)';handle.oninput()</script></html>
