<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mail Along the Sound</title><style>*{box-sizing:border-box}body{margin:0;background:#c4e0dd;color:#365960;font:17px Georgia}main{width:min(88%,850px);margin:8vh auto}h1{font:italic clamp(32px,5vw,62px) Georgia}.card{background:#f2ead5;min-height:315px;position:relative;padding:33px 5%;box-shadow:6px 8px 0 #95b1ae;transform:rotate(-1deg)}header{letter-spacing:.27em;font:bold 16px Georgia}.stamp{position:absolute;right:5%;top:22px;width:75px;border:5px dotted #f2ead5;outline:1px solid #c4bcaa;background:#89ada7}.cancel{position:absolute;top:35px;right:11%;border:4px double;border-radius:50%;width:102px;height:102px;display:grid;align-content:center;text-align:center;font:bold 12px monospace;transform:rotate(-15deg)}section{margin-top:90px;display:grid;grid-template-columns:1fr 1fr;gap:6%;align-items:center}p{font:italic clamp(17px,2.3vw,26px)/1.5 Georgia;margin:0}address{border-left:1px solid;padding:5px 0 5px 9%;font:17px/1.8 Georgia}nav{margin:28px 0;display:flex;gap:7px;flex-wrap:wrap}button{font:14px monospace;border:1px solid;background:none;color:inherit;cursor:pointer;padding:10px}button[aria-pressed=true]{background:#365960;color:white}@media(max-width:500px){section{grid-template-columns:1fr;margin-top:112px;gap:15px}address{border-left:0;border-top:1px solid;padding:8px 0}.card{padding:20px}}</style><main><h1>Mail along the Sound</h1><div class="card"><header>POST CARD</header><svg class="stamp" viewBox="0 0 70 88"><path d="M0 68q23-17 70-2v22H0" fill="#365960"/><path d="M24 69l6-42h10l6 42z" fill="#ebe3bf"/><path d="M28 28V17h14v11zm-4-11 11-10 13 10z" fill="#365960"/><text x="49" y="82" fill="white" font-size="14">8c</text></svg><div class="cancel" id="mark"></div><section><p id="message"></p><address>Miss Ada Reed<br>14 Ropewalk<br>Upper Sound</address></section></div><nav id="offices"><button>Gull Quay</button><button>Cold Hook</button><button>Reed Bank</button></nav></main><script>function post(i){let b=offices.children[i];mark.replaceChildren(document.createTextNode(b.textContent.toUpperCase()),document.createElement('br'),document.createTextNode('19 JUN / 0'+(i+1)));message.textContent=['The gulls have taken the warm roof. We have taken our breakfast outside.','Last night the fog bell rang until the baker lit his oven.','Your blue scarf was waiting on the fence where the reeds begin.'][i];Array.from(offices.children).forEach((k,j)=>k.setAttribute('aria-pressed',i===j));if(!matchMedia('(prefers-reduced-motion:reduce)').matches)mark.animate([{opacity:0,transform:'scale(1.3) rotate(-10deg)'},{opacity:1,transform:'scale(1) rotate(-15deg)'}],{duration:290,easing:'cubic-bezier(.7,0,.2,1)'})}Array.from(offices.children).forEach((b,i)=>b.onclick=()=>post(i));post(0)</script></html>
