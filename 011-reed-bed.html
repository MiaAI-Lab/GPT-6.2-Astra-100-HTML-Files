<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combing the Fen</title><style>body{margin:0;background:#e4d996;color:#364324}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}h1{position:absolute;writing-mode:vertical-rl;left:2vw;top:3vh;font:italic clamp(32px,6vw,85px) Georgia;margin:0;pointer-events:none}small{position:absolute;right:4vw;top:5vh;font:11px monospace;letter-spacing:.12em}canvas:focus-visible{outline:3px solid #596938;outline-offset:-4px}</style><canvas tabindex="0" aria-label="Brush the reeds, or move with arrow keys"></canvas><h1>Combing the Fen</h1><small>FIELD IMPRESSION　/　BRUSH THE REEDS</small><script>let c=document.querySelector('canvas'),g=c.getContext('2d'),P=Array.from({length:580},()=>[Math.random(),Math.random(),Math.random(),0]).sort((a,b)=>a[1]-b[1]),w,h,m=-500;function size(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}onresize=size;size();c.onpointermove=c.onpointerdown=e=>m=e.clientX;c.onpointerleave=()=>m=-500;c.onkeydown=e=>{if(e.key.startsWith('Arrow')){e.preventDefault();m=Math.min(w,Math.max(0,m<0?w/2:m+(e.key==='ArrowLeft'?-50:50)))}};function frame(t){g.fillStyle='#e4d996';g.fillRect(0,0,w,h);let calm=matchMedia('(prefers-reduced-motion:reduce)').matches;for(let p of P){let x=p[0]*w,z=p[1],y=h*(.52+.54*z),len=h*(.12+.39*z)*(.6+p[2]*.65),dx=x-m;p[3]+=(Math.exp(-dx*dx/5400)*62-p[3])*(calm?1:.07);let bend=len*.13+p[3]+(calm?0:6*Math.sin(t*.001+p[0]*6));g.strokeStyle=z<.3?'#9c9e5f':z<.75?'#777f48':'#596938';g.lineWidth=.8+z*1.8;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+2,y-len*.5,x+bend,y-len);g.stroke();g.lineWidth=2+z*4;g.lineCap='round';g.beginPath();g.moveTo(x+bend,y-len);g.lineTo(x+bend+3,y-len-9*z);g.stroke()}requestAnimationFrame(frame)}requestAnimationFrame(frame)</script></html>
