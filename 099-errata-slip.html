<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Errata Room</title><style>*{box-sizing:border-box}body{margin:0;color:#322f27;background:#e9e1cc;font:18px Georgia}article{width:min(85vw,870px);margin:7vh auto}header,footer{display:flex;justify-content:space-between;align-items:center;gap:1em;border-block:4px double #605a4c;padding:12px 0}small{font:bold 12px monospace;letter-spacing:.13em}h1{font:normal clamp(57px,13vw,178px)/.95 Georgia;margin:.42em 0 .18em;letter-spacing:-.065em}#letter{font:inherit;letter-spacing:inherit;padding:0;border:0;border-bottom:3px solid #99453e;color:#99453e;background:none;cursor:pointer}em{color:#99453e}p{font-size:clamp(23px,4vw,43px);max-width:29ch;min-height:3em;line-height:1.22}footer{border-bottom:0}#turn{border:1px solid;background:transparent;font:italic 16px Georgia;color:inherit;padding:10px;cursor:pointer}</style><article><header><small>THE ERRATA ROOM</small><small id="folio"></small></header><h1><span id="pre"></span><button id="letter"></button><span id="post"></span></h1><em id="note"></em><p id="meaning" aria-live="polite"></p><footer><small>LIFT THE RED LETTER</small><button id="turn">Turn the leaf →</button></footer></article><script>const entries=[['h','a','o','me','The inward curve of a collar that remembers the neck.','A place whose smallest noises arrive already named.'],['','m','w','ist','Water suspended so lightly that even a lane can wear it.','An old desire, found folded among newer ones.'],['s','a','i','lt','The bright remainder after a sea has left the room.','Fine earth carried in the handwriting of a river.']];let i=0,fixed=false;function show(){let [p,a,b,s,d,e]=entries[i];pre.textContent=p;letter.textContent=fixed?b:a;post.textContent=s;meaning.textContent=fixed?e:d;note.textContent=fixed?'Revised reading · author’s fair copy':'First impression · queried in the margin';folio.textContent='FOLIO '+(127+i);letter.setAttribute
