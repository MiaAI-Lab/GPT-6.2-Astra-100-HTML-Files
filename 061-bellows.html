<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Long Chord</title><style>body{margin:0;background:#b75042;color:#fff1d7;text-align:center;font-family:Georgia}header{padding-top:7vh;letter-spacing:.28em;font:13px monospace}h1{font:italic clamp(42px,6vw,80px) Georgia;margin:.2em}svg{display:block;width:100%;height:44vh}label{display:block;font:12px monospace;letter-spacing:.16em}input{width:min(60vw,450px);accent-color:#622d2c}button{margin:15px;color:#f7dcb4;background:#642e30;border:2px solid #f7dcb4;padding:9px 18px;font:italic 17px Georgia}</style><header>CONCERTINA STUDIES / IN C</header><h1>The Long Chord</h1><svg viewBox="0 0 800 280" aria-label="Red concertina with cream keys"><defs><pattern id="grille" width="12" height="12" patternUnits="userSpaceOnUse"><path d="m6 1 5 5-5 5-5-5z" fill="#632e2e"/></pattern></defs><g id="fold"></g><g id="left"><rect x="-113" y="26" width="115" height="228" rx="12" fill="#742e31" stroke="#f7dcb4" stroke-width="4"/><rect x="-99" y="46" width="75" height="176" rx="22" fill="#d1a77e"/><rect x="-99" y="46" width="75" height="176" rx="22" fill="url(#grille)"/></g><g id="right"><rect y="26" width="114" height="228" rx="12" fill="#742e31" stroke="#f7dcb4" stroke-width="4"/><g id="keys"></g></g></svg><label>BELLOWS / DRAW<br><input type="range" value="63"></label><button>Sound on ♪</button><script>const s=document.querySelector('input'),btn=document.querySelector('button');for(let i=0;i<12;i++){keys.insertAdjacentHTML('beforeend','<rect x="53" y="'+(40+i*16.4)+'" width="52" height="15" fill="#f7dcb4"/>');if(i%3)keys.insertAdjacentHTML('beforeend','<rect x="53" y="'+(36+i*16.4)+'" width="25" height="7" fill="#342527"/>')}let audio,tones=[];function show(){let step=4+Number(s.value)*.12,start=400-step*14;left.setAttribute('transform','translate('+start+')');right.setAttribute('transform','translate('+(800-start)+')');fold.innerHTML='';for(let i=0;i<28;i++){let x=start+i*step;fold.insertAdjacentHTML('beforeend','<path fill="'+(i%2?'#dbad89':'#542d32')+'" d="M'+x+' '+(i%2?44:33)+'l'+step+' '+(i%2?-11:11)+'v'+(i%2?214:192)+'l-'+step+' '+(i%2?-11:11)+'Z"/>')}tones.forEach((o,i)=>o.frequency.setTargetAtTime([130.81,164.81,196][i]*(1+s.value/240),audio.currentTime,.08))}s.oninput=show;show();btn.onclick=()=>{if(tones.length){tones.forEach(o=>o.stop());tones=[];btn.textContent='Sound on ♪'}else{audio??=new AudioContext();audio.resume();tones=[0,1,2].map(()=>{let o=audio.createOscillator(),v=audio.createGain();o.type='triangle';v.gain.value=.035;o.connect(v).connect(audio.destination);o.start();return o});show();btn.textContent='Mute chord'}}</script></html>
