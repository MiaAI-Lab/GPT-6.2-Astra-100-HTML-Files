<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Point House</title><style>*{box-sizing:border-box}body{margin:0;background:#e7edcf;color:#222e2b}main{width:min(1000px,92vw);margin:4vh auto}header{display:flex;justify-content:space-between;align-items:center;border-block:2px solid}h1{font:900 clamp(32px,6vw,70px)/1 Arial;letter-spacing:-.07em;margin:.25em 0}small,output{font:bold 12px monospace}.machine{display:grid;grid-template-columns:2fr 1fr;gap:5%;margin-top:16px}.shaft,.floor{height:66vh}.shaft{overflow:hidden;border:6px solid;background:#d1d9b6}.car{transition:transform 1s cubic-bezier(.55,-.05,.18,1.04)}.floor{display:grid;place-items:center;font-size:min(37vw,54vh);line-height:1}.panel{align-self:center}strong{font:normal clamp(48px,9vw,100px) monospace}nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:15px 0}button{background:transparent;border:2px solid;padding:15px 0;font:bold 18px monospace;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#222e2b;color:#e7edcf}button:focus-visible{outline:4px double;outline-offset:2px}@media(prefers-reduced-motion:reduce){.car{transition:none}}</style><main><header><h1>Point House</h1><small>TYPE LIFT / A</small></header><div class="machine"><div class="shaft"><div class="car"><div class="floor" style="font-family:Georgia">g</div><div class="floor" style="font-family:Arial">g</div><div class="floor" style="font:italic min(37vw,54vh) Georgia">g</div><div class="floor" style="font-family:monospace">g</div></div></div><section class="panel"><small>FLOOR</small><br><strong>01</strong><nav><button aria-pressed="true">1</button><button>2</button><button>3</button><button>4</button></nav><output>ROMAN ROOM</output></section></div></main><script>let bs=[...document.querySelectorAll('button')];bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(c=>c.setAttribute('aria-pressed',b===c));document.querySelector('.car').style.transform='translateY(-'+i*25+'%)';document.querySelector('strong').textContent='0'+(i+1);document.querySelector('output').value=['ROMAN ROOM','GROTESQUE HALL','ITALIC ATELIER','MONOSPACE LOFT'][i]})</script></html>
