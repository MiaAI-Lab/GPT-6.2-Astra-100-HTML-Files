<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Body Through</title><style>*{box-sizing:border-box}body{margin:0;background:#d6e4ca;color:#374d46;padding:4vh 6vw;font:15px monospace}header{display:flex;justify-content:space-between;border-bottom:4px solid;padding-bottom:.8em}h1{font:900 clamp(70px,20vw,250px)/1 system-ui;margin:.04em 0;letter-spacing:-.09em;font-variant-numeric:tabular-nums}main{position:relative;background:repeating-linear-gradient(130deg,#61776d 0 4px,transparent 5px 13px);border-block:3px solid}svg{display:block;width:65%;height:33vh;margin:auto;background:#d6e4ca}.rotor{transform-origin:200px 100px;transition:transform .55s cubic-bezier(.3,1.25,.5,1)}footer{padding-top:1.4em;display:flex;gap:2em;align-items:center;flex-wrap:wrap}button{font:bold 18px monospace;background:#374d46;color:#d6e4ca;border:none;padding:1em}button:hover{background:#1b332c}@media(prefers-reduced-motion:reduce){.rotor{transition:none}}</style><header><b>GATE / EAST</b><span>PUBLIC PASSAGE</span></header><h1 aria-live="polite">00417</h1><main><svg viewBox="0 0 400 200"><g class="rotor" stroke="#374d46" stroke-linecap="round" stroke-width="16"><path d="M200 100h102M200 100l-51 88M200 100l-51-88"/></g><circle cx="200" cy="100" r="24" fill="#7c9183" stroke="#374d46" stroke-width="5"/><circle cx="200" cy="100" r="6" fill="#374d46"/></svg></main><footer><button>Admit one ↗</button><span id="log">Last through · woman carrying violets</span></footer><script>let entries=417;document.querySelector('button').onclick=()=>{entries++;document.querySelector('h1').textContent=String(entries).padStart(5,'0');document.querySelector('.rotor').style.transform='rotate('+((entries-417)*120)+'deg)';log.textContent='Last through · '+['a pair of muddy boots','the overnight baker','a boy with a cello','someone holding two coffees','the first violinist','a courier in green'][entries%6]}</script></html>
