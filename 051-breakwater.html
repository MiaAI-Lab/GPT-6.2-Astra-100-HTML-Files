<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Breakwater Test</title><style>*{box-sizing:border-box}body{margin:0;background:#b5cbd0;color:#384451;font:15px monospace}header,footer{display:flex;align-items:center;justify-content:space-between;padding:2vh 4vw;gap:1em;flex-wrap:wrap}h1{font:900 clamp(42px,9vw,146px)/.84 system-ui;margin:2vh 0;letter-spacing:-.08em}canvas{width:100%;height:56vh;display:block;background:#92b5be;cursor:crosshair;border-block:2px solid}button{padding:.7em;background:transparent;color:inherit;border:1px solid;font:inherit}button:hover{background:#384451;color:white}small{letter-spacing:.12em}</style><header><div><small>COASTAL WORKS / FIELD TEST 51</small><h1>Breakwater.</h1></div><b>SWELL ↓<br>Granite placement trial</b></header><canvas aria-label="Wave tank. Tap to sink a block."></canvas><footer><span>Tap water to sink granite.</span><div><button id="add">Extend wall +</button> <button id="reset">Clear tank</button></div></footer><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),rocks=[[.4,.42],[.45,.43],[.50,.44],[.55,.45]],still=matchMedia('(prefers-reduced-motion: reduce)').matches;let w,h;function draw(t=0){g.clearRect(0,0,w,h);for(let y=3;y<h;y+=7){g.beginPath();for(let x=0;x<=w+3;x+=4){let a=1;for(const [rx,ry] of rocks){let d=y-ry*h;if(d>0&&Math.abs(x-rx*w)<13+d*.17)a=.1}let v=y+a*(3*Math.sin(x*.027+y*.04+t*.0008)+2*Math.sin(x*.05-y*.03));if(a>.2)g.lineTo(x,v);else g.moveTo(x,v)}g.strokeStyle='rgba(250,255,248,.83)';g.stroke()}for(const [rx,ry] of rocks){g.save();g.translate(rx*w,ry*h);g.fillStyle='#384451';g.beginPath();g.moveTo(-14,-4);g.lineTo(-5,-11);g.lineTo(13,-6);g.lineTo(10,8);g.lineTo(-10,10);g.fill();g.fillStyle='#73868a';g.beginPath();g.moveTo(-14,-4);g.lineTo(-5,-11);g.lineTo(13,-6);g.lineTo(1,0);g.fill();g.restore()}}function size(){let s=Math.min(devicePixelRatio,2);w=c.clientWidth;h=c.clientHeight;c.width=w*s;c.height=h*s;g.setTransform(s,0,0,s,0,0);draw()}onresize=size;size();if(!still)requestAnimationFrame(function loop(t){draw(t);requestAnimationFrame(loop)});function place(x,y){if(rocks.length>45)rocks.shift();rocks.push([x,y]);draw()}c.onclick=e=>place(e.offsetX/w,e.offsetY/h);add.onclick=()=>place(.16+(rocks.length*.053)%.68,.46+.04*Math.sin(rocks.length));reset.onclick=()=>{rocks.length=0;draw()}</script></html>
