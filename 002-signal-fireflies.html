<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Answering Meadow</title><style>*{box-sizing:border-box}body{margin:0;background:#16281e;color:#dce972}canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}header,footer{position:fixed;left:6vw;pointer-events:none}header{top:8vh}footer{bottom:6vh;font:14px Georgia}small{font:11px monospace;letter-spacing:.2em}h1{font:italic clamp(84px,16vw,220px)/1 Georgia;margin:.1em 0}canvas:focus-visible{outline:4px solid #dce972;outline-offset:-5px}</style><canvas tabindex="0" aria-label="Flash your lantern"></canvas><header><small>FEN STATION　 /　 FIELD 07</small><h1>Listen.</h1><small>THE ANSWERING MEADOW</small></header><footer>Touch the grass or press space to send a light.</footer><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),grass=document.createElement('canvas'),s=grass.getContext('2d'),bugs=Array.from({length:75},()=>[Math.random(),.38+Math.random()*.57,Math.random()*7]);let w,h,X=-4,Y=0,start=-20;function size(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);grass.width=w;grass.height=h;s.fillStyle='#16281e';s.fillRect(0,0,w,h);for(let i=0;i<1800;i++){let x=Math.random()*w,y=h*(.53+.55*Math.random()),k=(y/h-.45)*h*.4;s.fillStyle=['#223d2e','#1b3326','#11271d','#2b4330'][i%4];s.beginPath();s.moveTo(x,y);s.quadraticCurveTo(x+4,y-k*.65,x-k*.28,y-k);s.lineTo(x+3,y);s.fill()}}onresize=size;size();function draw(ms){let t=ms/1000;g.drawImage(grass,0,0);for(let [u,v,p] of bugs){let x=u*w,y=v*h,dt=t-start-Math.hypot(x-X,y-Y)/460,a=Math.max(.06,.55*Math.pow(.5+.5*Math.cos((matchMedia('(prefers-reduced-motion:reduce)').matches?0:t)+p),5),dt>0?Math.exp(-dt*4):0);let r=3+13*a,G=g.createRadialGradient(x,y,0,x,y,r);G.addColorStop(0,'rgba(238,255,151,'+a+')');G.addColorStop(.15,'rgba(218,251,102,'+a*.8+')');G.addColorStop(1,'transparent');g.fillStyle=G;g.fillRect(x-r,y-r,r*2,r*2)}requestAnimationFrame(draw)}requestAnimationFrame(draw);function flash(x,y){X=x;Y=y;start=performance.now()/1000}c.onpointerdown=e=>flash(e.clientX,e.clientY);c.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();flash(w/2,h*.7)}}
</script></html>
