<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freight by Air</title><style>*{box-sizing:border-box}body{margin:0;background:#c8e1e8;color:#594757}main{min-height:100svh;display:grid;grid-template-columns:1fr 1fr;align-items:center;max-width:1100px;margin:auto;padding:4vw}svg{width:100%;height:min(85vh,780px)}article{border-left:2px dashed #806878;padding:4vw}h1{font:normal clamp(44px,7vw,101px)/.88 Georgia;letter-spacing:-.055em;margin:.4em 0}small,p{font:14px monospace}output{font:italic 56px Georgia}button{font:24px Georgia;border:1px solid;background:transparent;color:inherit;width:43px;height:43px;cursor:pointer}#rig{transition:transform .8s cubic-bezier(.22,.82,.3,1.07)}@media(max-width:600px){main{grid-template-columns:1fr}svg{height:44vh}article{border-left:0;border-top:2px dashed #806878}h1{margin:.2em 0}}@media(prefers-reduced-motion:reduce){#rig{transition:none}}</style><main><svg viewBox="0 0 280 520" aria-label="Crate suspended under seven balloons"><path d="M20 488h240" stroke="#594757" stroke-dasharray="3 6"/><g id="rig" stroke="#594757"><g id="fleet"></g><rect x="103" y="283" width="74" height="50" fill="#c3926c"/><path d="M107 289h66m-65 11h64m-64 11h64m-65 12h66M117 283v50m46-50v50" fill="none" stroke-width="2"/><text x="140" y="315" text-anchor="middle" fill="#594757" stroke="none" font-family="monospace">BK.</text></g></svg><article><small>UPDRAFT FREIGHT CO.</small><h1>Freight<br>by air.</h1><p>CONSIGNMENT　/　BOUND VOLUMES</p><button id="unload" aria-label="Unload one book">−</button> <output id="total">4</output> <button id="load" aria-label="Load one book">+</button><p id="status"></p></article></main><script>for(let [x,y,color] of [[102,70,'#d9b295'],[170,65,'#c99291'],[137,48,'#f1d3a3'],[75,112,'#db9b89'],[197,117,'#e5bd9b'],[117,130,'#bb8090'],[158,107,'#f0c889']])fleet.innerHTML+='<path d="M'+x+' '+(y+27)+'L140 285" fill="none"/><ellipse cx="'+x+'" cy="'+y+'" rx="26" ry="34" fill="'+color+'"/><path d="M'+(x-14)+' '+y+'q-2-15 9-21" stroke="#fff3d5" fill="none"/>';let n=4;function lift(){rig.style.transform='translateY('+n*15+'px)';total.textContent=n;status.textContent=n===10?'GROUNDED · unload to dispatch.':'AIRBORNE · clearance '+(10-n)*15+' spans.';unload.disabled=n===0;load.disabled=n===10}load.onclick=()=>{n++;lift()};unload.onclick=()=>{n--;lift()};lift()</script></html>
