<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unclaimed at the Lyric</title><style>*{box-sizing:border-box}body{margin:0;background:repeating-linear-gradient(93deg,#a8ad96 0 2px,#b4b99f 3px 9px);color:#364030;font:18px Georgia;min-height:100svh;display:grid;place-items:center}main{width:min(88vw,800px)}article{position:relative;background:#e5e2c9;border:8px double #49503d;padding:5%;box-shadow:6px 12px 0 #49503d33;transform:rotate(-2deg);overflow:hidden}h1{font:normal clamp(50px,12vw,145px)/1 Georgia;letter-spacing:.045em;margin:0}small{font:bold 12px monospace;letter-spacing:.13em}strong{font:italic clamp(42px,9vw,94px) Georgia}aside{background:#c3c9ae;position:absolute;right:0;inset-block:0;width:18%;border-left:3px dashed #697157;writing-mode:vertical-rl;text-align:center;padding:4%;letter-spacing:.22em;transition:translate .65s cubic-bezier(.6,-.1,.75,.6)}article.open aside{translate:110% 0}button{margin-top:25px;background:#364030;color:#f7f4da;border:0;font:16px Georgia;padding:14px 22px;cursor:pointer}p{max-width:45ch;min-height:3em}@media(prefers-reduced-motion:reduce){aside{transition:none}}</style><main><article id="ticket"><small>LAST PERFORMANCE • CLOAKROOM</small><h1>LYRIC</h1><hr><small>CLAIM NUMBER</small><br><strong id="num">047</strong><aside>RETAIN THIS PORTION</aside></article><button id="redeem">Redeem coat 047</button><p id="note" aria-live="polite">Three coats hung overnight. By morning the theatre had closed.</p></main><script>let i=0,open=false,ids=['047','112','006'],notes=['A green wool overcoat. In the left pocket, a paper star from the scenery, folded twice to fit.','A raincoat still smelling of oranges. Its cuff carries a pencilled reminder: stand when Ada bows.','A child’s blue duffel. Inside the hood, the very last glass marble from the orchestra pit.'];redeem.onclick=()=>{open=!open;if(!open)i=(i+1)%3;ticket.classList.toggle('open',open);num.textContent=i
