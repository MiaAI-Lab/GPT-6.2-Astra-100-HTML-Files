<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lamplighter’s Round</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#472b3b,#795064);color:#ffc483;min-height:100svh;font-family:Georgia}header{padding:4vh 6vw}small{font:12px monospace;letter-spacing:.16em}h1{font:italic clamp(38px,7vw,91px)/1 Georgia;margin:.15em 0}main{display:flex;align-items:end;height:52vh;border-bottom:12px solid #372736}.house{position:relative;width:33.34%;height:50%;border:5px solid #432f3e;background:#805a62;padding:18px 5px;text-align:center;box-shadow:inset 0 12px #65444d}.house:nth-child(2){height:61%;background:#8b6668}.house:nth-child(3){height:45%}.house:before{content:'';position:absolute;top:-14px;left:-4%;width:108%;height:14px;background:#4b3544;clip-path:polygon(7% 0,95% 0,100% 100%,0 100%)}main{overflow:hidden}b{display:block;color:#f3d7b5;font-size:clamp(13px,2.8vw,30px)}i{display:inline-block;width:17%;height:37%;margin:10% 2% 0;background:repeating-linear-gradient(90deg,#483642 0 35%,#6c4957 36% 43%);border:3px solid #483642}.on i{background:repeating-linear-gradient(90deg,#ffc483 0 35%,#6c4957 36% 43%)}button{position:absolute;bottom:calc(100% + 16px);left:calc(50% - 32px);width:64px;height:75px;border:5px solid #47323b;border-block-width:8px;border-radius:42%;color:#f0d5b7;background:repeating-linear-gradient(0deg,#714550 0 9px,#5c3643 10px 12px);font:bold 18px Georgia;cursor:pointer}button:before{content:'';position:absolute;height:45vh;bottom:100%;left:50%;width:2px;background:#362832}.on button{background:repeating-linear-gradient(0deg,#ffc483 0 9px,#b36f52 10px 12px);color:#573442;box-shadow:0 0 28px #ffba6e77}footer{padding:3vh 6vw;font:15px monospace}button:focus-visible{outline:3px solid white}</style><header><small>MARROW LANE / EVENING DUTY</small><h1>Lamplighter’s Round</h1><i style="display:inline;background:none;border:none;margin:0">Tap the lanterns above the shops.</i></header><main><div class="house on"><button aria-pressed="true" aria-label="Tea shop lantern">I</button><b>Tea merchant</b><i></i><i></i><i></i></div><div class="house"><button aria-pressed="false" aria-label="Tailor lantern">II</button><b>The tailor</b><i></i><i></i></div><div class="house"><button aria-pressed="false" aria-label="Bookbinder lantern">III</button><b>Bookbinder</b><i></i><i></i><i></i></div></main><footer id="tally">1 of 3 houses awake.</footer><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{let lit=b.parentNode.classList.toggle('on');b.setAttribute('aria-pressed',lit);tally.textContent=document.querySelectorAll('.house.on').length+' of 3 houses awake.'})</script></html>
