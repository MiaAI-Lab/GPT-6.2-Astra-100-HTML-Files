<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Floating Ink</title><style>body{margin:0;background:#e9bfae;color:#273b49;font:16px Georgia}main{display:grid;grid-template-rows:1fr auto;height:100svh}canvas{width:100%;height:100%;min-height:0;display:block;touch-action:none;cursor:crosshair}footer{padding:14px 4vw;display:flex;justify-content:space-between;align-items:center;border-top:3px solid #405d76;gap:10px}h1{font:italic clamp(22px,4vw,52px) Georgia;margin:0}small{font:11px monospace;letter-spacing:.1em}button{background:transparent;border:1px solid;color:inherit;font:16px Georgia;padding:10px;cursor:pointer}canvas:focus-visible{outline:4px solid white;outline-offset:-4px}</style><main><canvas id="vat" tabindex="0" aria-label="Drag to comb the ink or press Enter to curl it"></canvas><footer><div><small>COMB THE PIGMENT</small><h1>The floating ink</h1></div><button id="rinse">Rinse the vat</button></footer></main><script>const ctx=vat.getContext('2d'),colors=[[233,191,174],[64,93,118],[245,217,178],[163,88,66],[234,170,148],[50,77,92]],marks=[];let scheduled=false;function render(){scheduled=false;let d=Math.min(devicePixelRatio,1.5),w=Math.round(vat.clientWidth*d),h=Math.round(vat.clientHeight*d),factor=Math.min(1,750/w,580/h);w=Math.max(1,Math.floor(w*factor));h=Math.max(1,Math.floor(h*factor));vat.width=w;vat.height=h;let im=ctx.createImageData(w,h);for(let j=0;j<h;j++){for(let i=0;i<w;i++){let x=i/w,y=j/h;for(let m of marks){let dx=x-m.x,dy=y-m.y,f=Math.max(0,1-(dx*dx+dy*dy)*26);x+=dy*f*2.4;y-=dx*f*2.4}let a=y+.14*Math.sin(6*x+4*y)+.085*Math.sin(10*x-7*y)+.04*Math.sin(21*x+8*y),v=(a*9+.25*Math.sin(x*14+y*13)+10)%1,k=v<.31?0:v<.39?1:v<.57?2:v<.63?3:v<.89?4:5,p=4*(j*w+i);im.data[p]=colors[k][0];im.data[p+1]=colors[k][1];im.data[p+2]=colors[k][2];im.data[p+3]=255}}ctx.putImageData(im,0,0)}function mark(x,y){marks.push({x,y});if(marks.length>12)marks.shift();if(!scheduled){scheduled=true;requestAnimationFrame(render)}}vat.onpointerdown=e=>{vat.setPointerCapture(e.pointerId);mark(e.offsetX/vat.clientWidth,e.offsetY/vat.clientHeight)};vat.onpointermove=e=>{if(e.buttons)mark(e.offsetX/vat.clientWidth,e.offsetY/vat.clientHeight)};vat.onkeydown=e=>{if(e.key==='Enter')mark(.5,.5)};rinse.onclick=()=>{marks.length=0;render()};onresize=render;render()</script></html>
