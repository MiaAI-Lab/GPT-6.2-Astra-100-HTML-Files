<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orchard Roll Call</title><style>*{box-sizing:border-box}body{margin:0;background:#e0e5be;color:#34472e;font:16px Georgia}main{padding:4vw;display:grid;grid-template-columns:1fr 2fr;align-items:center;gap:4vw;min-height:100svh}h1{font:400 clamp(36px,5vw,68px)/1 Georgia}output{display:block;font:700 clamp(65px,10vw,140px)/1 Arial;letter-spacing:-.08em}small{font:12px monospace}nav{margin:18px 0;display:grid;gap:3px}button{text-align:left;background:transparent;border:0;border-bottom:1px solid #809271;padding:8px 5px;color:inherit;font:15px Georgia;cursor:pointer}button[aria-pressed=true]{background:#4a6340;color:white}canvas{width:100%;height:74vh;border:4px double #4a6340}@media(max-width:620px){main{display:flex;flex-direction:column-reverse;justify-content:center}canvas{height:43vh}article{width:100%}nav{grid-template-columns:1fr 1fr}h1{margin:.2em 0}output{float:right}}</style><main><article><small>FALLOW HILL / INVENTORY</small><h1>Orchard roll call</h1><output id="total"></output><small>TREES STANDING</small><nav id="bands"><button>All plantings</button><button>Whips · first season</button><button>Bearing · midlife</button><button>Standards · old wood</button></nav><p>North field, pear stock. A fictional autumn census.</p></article><canvas id="grove"></canvas></main><script>let band=-1;function draw(){let w=grove.clientWidth,h=grove.clientHeight,d=Math.min(2,devicePixelRatio),c=grove.getContext('2d');grove.width=w*d;grove.height=h*d;c.scale(d,d);c.fillStyle='#d0d6ad';c.fillRect(0,0,w,h);let count=0;for(let j=0;j<12;j++)for(let i=0;i<9;i++){let k=j*9+i;if(k%17===0)continue;let age=(k*7+Math.floor(j/2))%3,active=band<0||age===band;if(active)count++;let x=(i+.5+(j%2)*.24)*w/9.5,y=(j+.6)*h/12.3,r=Math.min(w/9.5,h/12.3)*(.15+.062*age);c.globalAlpha=active?1:.15;c.fillStyle='#8b9372';c.beginPath();c.ellipse(x+r*.5,y+r*.65,r*1.2,r*.8,0,0,7);c.fill();for(let f=0;f<8;f++){let a=f*2.4+k;c.fillStyle=['#94a65c','#668447','#4a6340'][age];c.beginPath();c.arc(x+Math.sin(a)*r*.53,y+Math.cos(a)*r*.57,r*.76,0,7);c.fill()}c.fillStyle='#d6d896';c.fillRect(x-r*.3,y-r*.6,2,2)}total.value=count;Array.from(bands.children).forEach((b,i)=>b.setAttribute('aria-pressed',i-1===band))}Array.from(bands.children).forEach((b,i)=>b.onclick=()=>{band=i-1;draw()});onresize=draw;draw()</script></html>
