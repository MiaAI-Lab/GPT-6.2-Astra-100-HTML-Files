<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sixty-Second Transit</title><style>body{margin:0;background:#191b30;color:#ecdbaf;text-align:center;font:12px monospace}main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center}canvas{width:min(86vw,60vh);aspect-ratio:1}h1{font:normal clamp(26px,4vw,50px) Georgia;margin:.2em}time{font-size:20px;letter-spacing:.25em}small{letter-spacing:.19em;margin-bottom:10px}</style><main><small>OBSERVATORY OF SMALL HOURS</small><canvas aria-label="One-minute transit clock"></canvas><h1>Sixty-Second Transit</h1><time></time></main><script>let c=document.querySelector('canvas'),g=c.getContext('2d'),sun=document.createElement('canvas');sun.width=sun.height=500;let b=sun.getContext('2d');b.translate(250,250);b.beginPath();b.arc(0,0,172,0,7);b.clip();b.fillStyle='#ecdbaf';b.fillRect(-180,-180,360,360);for(let k=0;k<8000;k++){let x=Math.random()*350-175,y=Math.random()*350-175;b.fillStyle=k%3?'#b4a38266':'#fff2c977';b.fillRect(x,y,1+Math.random()*7,1)}function frame(){let d=Math.min(2,devicePixelRatio)*c.clientWidth/500;if(c.width!==Math.floor(d*500)){c.width=c.height=Math.floor(d*500)}g.setTransform(d,0,0,d,250*d,250*d);g.clearRect(-250,-250,500,500);g.drawImage(sun,-250,-250);let now=new Date(),sec=now.getSeconds()+now.getMilliseconds()/1000;g.save();g.beginPath();g.arc(0,0,172,0,7);g.clip();g.fillStyle='#191b30';g.beginPath();g.arc(-225+sec*7.5,-15+sec*.4,56,0,7);g.fill();g.restore();for(let i=0;i<60;i++){let a=(i/30-.5)*Math.PI;g.strokeStyle=i===Math.floor(sec)?'#fff3c2':'#807d82';g.lineWidth=i===Math.floor(sec)?4:1;g.beginPath();g.moveTo(193*Math.cos(a),193*Math.sin(a));let r=i%5?199:210;g.lineTo(r*Math.cos(a),r*Math.sin(a));g.stroke()}document.querySelector('time').textContent=now.toLocaleTimeString('en-GB');setTimeout(frame,matchMedia('(prefers-reduced-motion:reduce)').matches?1000:80)}frame()</script></html>
