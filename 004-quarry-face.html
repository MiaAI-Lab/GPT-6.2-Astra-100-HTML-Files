<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bench Four</title><style>*{box-sizing:border-box}body{background:#dbc198;color:#514740;margin:0;font:13px monospace}main{margin:4vw}header,footer{display:flex;align-items:center;justify-content:space-between;border-block:1px solid;padding:12px 0;gap:14px}h1{font:bold clamp(50px,11vw,160px)/.85 Arial;margin:.35em 0;letter-spacing:-.08em}svg{width:100%;height:48vh}input{accent-color:#514740;width:min(40vw,330px)}g{transition:opacity .5s,transform .7s cubic-bezier(.2,.7,.2,1)}.gone{opacity:0;transform:translateY(-70px)}:focus-visible{outline:3px solid}@media(prefers-reduced-motion:reduce){g{transition:none}}</style><main><header><b>WEST CUT　 /　 SURVEY B</b><span>SECTION · 04</span></header><h1>Bench Four.</h1><svg viewBox="0 0 850 370" role="img" aria-label="Four stepped terraces of excavated stone"></svg><footer><label>EXCAVATE　<input aria-label="Excavation depth" type="range" min="0" max="3" value="0"></label><output>01 / CAPSTONE</output></footer></main><script>
let svg=document.querySelector('svg');for(let i=3;i>=0;i--){let x=80+46*(3-i),y=40+i*69,w=620-(3-i)*88,f='';for(let j=0;j<80;j++){let a=x+(j*71%w),b=y+47+j*19%34;f+='<path d="M'+a+' '+b+'l14 -3 8 1 13 -4" stroke="#514740" opacity=".45"/>'}svg.innerHTML+='<g id="b'+i+'"><path d="M'+x+' '+(y+38)+'l85 -38h'+w+'l-85 38z" fill="'+['#f3deb3','#dfbb8c','#c89869','#ae8669'][i]+'"/><path d="M'+x+' '+(y+38)+'h'+w+'v48H'+x+'z" fill="'+['#ba966e','#ac815c','#936e54','#836956'][i]+'"/><path d="M'+(x+w)+' '+(y+38)+'l85 -38v48l-85 38z" fill="#76604d"/>'+f+'</g>'}document.querySelector('input').oninput=e=>{let v=+e.target.value;for(let i=0;i<4;i++)document.querySelector('#b'+i).classList.toggle('gone',i<v);document.querySelector('output').value='0'+(v+1)+' / '+['CAPSTONE','RUST BAND','CLAY SEAM','BEDROCK'][v]}
</script></html>
