<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Low Water</title><style>body{margin:0;background:#142f34;color:#c2eee0}canvas{width:100%;height:100svh;display:block;touch-action:none}header{position:absolute;left:5vw;top:4vh;pointer-events:none;text-shadow:0 2px 5px #142f34}h1{font:italic clamp(46px,7vw,110px) Georgia;margin:.1em 0}small{font:12px monospace;letter-spacing:.15em}footer{position:absolute;bottom:3vh;right:5vw;background:#142f34;padding:8px;font:italic 16px Georgia}canvas:focus-visible{outline:4px solid #99e9cf;outline-offset:-5px}</style><canvas id="pool" tabindex="0" aria-label="Tide pool. Touch or press Enter to disturb the anemones."></canvas><header><small>INTERTIDAL NOTES　·　IV</small><h1>Low water</h1></header><footer>Brush the fringe. The whole colony listens.</footer><script>const c=pool.getContext('2d'),animals=[[.13,.57,.17],[.43,.78,.12],[.52,.39,.16],[.83,.57,.21],[.94,.12,.105],[.02,.99,.12],[.71,1,.1]],still=matchMedia('(prefers-reduced-motion: reduce)').matches;let x=-999,y=-999,t=0,w,h;function paint(){c.fillStyle='#142f34';c.fillRect(0,0,w,h);animals.forEach(([u,v,s],k)=>{let X=u*w,Y=v*h,R=Math.min(w,h)*s,fold=Math.min(1,Math.hypot(x-X,y-Y)/(R*1.6));for(let j=0;j<150;j++){let a=j*2.39996,r=R*(.52+.45*(.5+.5*Math.sin(j*342.23)))*(.4+.6*fold),b=a+.24*Math.sin(a*5+t+k)+.55*(1-fold);c.beginPath();c.moveTo(X+R*.15*Math.cos(a),Y+R*.1*Math.sin(a));c.quadraticCurveTo(X+r*.65*Math.cos(a-.23),Y+r*.54*Math.sin(a-.23),X+r*Math.cos(b),Y+r*.83*Math.sin(b));c.strokeStyle=['#99e9cf','#47877c','#bf927c','#699990'][j%4];c.lineWidth=1+(j%4)*.55;c.stroke()}c.beginPath();c.ellipse(X,Y,R*.13,R*.08,-.3,0,7);c.fillStyle='#082327';c.fill()})}function size(){w=innerWidth;h=pool.clientHeight;let d=Math.min(devicePixelRatio,2);pool.width=w*d;pool.height=h*d;c.setTransform(d,0,0,d,0,0);paint()}function tick(now){t=now*.00045;paint();requestAnimationFrame(tick)}size();onresize=size;pool.onpointermove=pool.onpointerdown=e=>{x=e.clientX;y=e.clientY;paint()};pool.onpointerleave=()=>{x=-999;paint()};pool.onkeydown=e=>{if(e.key==='Enter'){x=x<0?w*.52:-999;y=h*.39;paint()}};if(!still)requestAnimationFrame(tick)</script></html>
