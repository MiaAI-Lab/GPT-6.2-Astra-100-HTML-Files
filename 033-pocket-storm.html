<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm No. 3</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at 50% 55%,#61536b,#373147 68%);color:#eac7ff;font:15px Georgia}small{font:12px monospace;letter-spacing:.22em}.jar{position:relative;display:block;margin:55px auto 22px;width:min(65vw,270px);height:min(49vh,360px);border:3px double #d5b7db;border-radius:28% 28% 14% 14% / 14% 14% 8% 8%;background:linear-gradient(100deg,#9b889d44,#352d4400 20% 72%,#bcaac347);color:inherit;cursor:pointer;box-shadow:inset 10px 0 15px #ddd3de22,0 15px 24px #292334}.jar:before{content:'';position:absolute;bottom:100%;height:29px;width:65%;left:17%;background:repeating-linear-gradient(0deg,#4c414d 0 3px,#ac959c 4px 5px);border:2px solid #ab99a8;border-radius:5px}canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit}.tag{position:absolute;bottom:8%;left:15%;width:70%;background:#e3d1bd;color:#493c48;padding:9px;border:4px double;font:italic 20px Georgia}h1{font-weight:400;font-size:clamp(34px,5vw,60px);margin:0}.jar:focus-visible{outline:3px solid #fff;outline-offset:6px}</style><small>THE WEATHER CUPBOARD</small><button class="jar" id="jar" aria-label="Discharge the bottled storm"><canvas id="weather"></canvas><span class="tag">Cumulo III</span></button><h1>Pocket thunder</h1><p>Collected above the slate works. Tap to discharge.</p><script>let c=weather.getContext('2d'),w,h,bolt=[],start=0,frame;function draw(ms){c.clearRect(0,0,w,h);for(let j=0;j<37;j++){let x=w*(.12+.76*((j*37%53)/53)),y=h*(.22+.11*Math.sin(j*4));let g=c.createRadialGradient(x,y,0,x,y,w*.14);g.addColorStop(0,j%3?'#6f627e':'#95859c');g.addColorStop(1,'#574b6500');c.fillStyle=g;c.fillRect(x-w*.14,y-w*.14,w*.28,w*.28)}c.strokeStyle='#c3a8cc66';c.lineWidth=.8;for(let j=0;j<39;j++){let x=w*(.16+.68*((j*23%41)/41)),y=h*(.36+.25*((j*17%37)/37));c.beginPath();c.moveTo(x,y);c.lineTo(x-2,y+5);c.stroke()}let a=Math.max(0,1-(ms-start)/1450);c.globalAlpha=a;c.strokeStyle='#eac7ff';c.shadowColor='#eac7ff';c.shadowBlur=8;for(let path of bolt){c.beginPath();path.forEach(([x,y])=>c.lineTo(x,y));c.stroke()}c.shadowBlur=0;c.globalAlpha=1;if(a>0&&!matchMedia('(prefers-reduced-motion:reduce)').matches)frame=requestAnimationFrame(draw)}function spark(){cancelAnimationFrame(frame);bolt=[];let x=w*.5,y=h*.3,path=[[x,y]];for(let j=0;j<14;j++){x+=(Math.random()-.5)*w*.13;y+=h*.027;path.push([x,y]);if(j%3==1)bolt.push([[x,y],[x+w*.06,y+h*.026],[x+w*.04,y+h*.06],[x+w*.13,y+h*.085]])}bolt.push(path);start=performance.now();draw(start)}function size(){w=weather.clientWidth;h=weather.clientHeight;let d=Math.min(devicePixelRatio,2);weather.width=w*d;weather.height=h*d;c.setTransform(d,0,0,d,0,0);spark()}jar.onclick=spark;onresize=size;size()</script></html>
