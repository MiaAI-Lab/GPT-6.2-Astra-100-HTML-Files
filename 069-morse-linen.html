<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Message in Running Stitch</title><style>*{box-sizing:border-box}body{margin:0;background:#3b5255;color:#dddac0;padding:6vh 7vw;font:15px monospace}h1{font:italic clamp(35px,6vw,83px) Georgia;margin:.18em 0 .4em}main{background:repeating-linear-gradient(0deg,#8c8e7240 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,#fcf8db80 0 1px,#dddac0 1px 4px);min-height:32vh;padding:clamp(20px,4vw,60px);color:#3b5255;outline:2px dashed #6a7566;outline-offset:-11px;box-shadow:3px 6px 0 #273d40;display:flex;gap:1.6em 1em;align-content:center;flex-wrap:wrap}.letter{text-align:center}.line{display:flex;gap:4px;height:18px;align-items:center}.thread{height:5px;width:7px;border-radius:50%;background:#3b5255;box-shadow:1px 1px 1px #8f9988,inset 0 1px #819390}.dash{width:21px}.space{width:1.2em}label{display:block;margin:2em 0 .5em}input{box-sizing:border-box;width:min(100%,34em);font:23px Georgia;padding:.4em;background:transparent;border:0;border-bottom:2px solid;color:inherit}small{letter-spacing:.16em}</style><small>THE TELEGRAPH SEWING ROOM</small><h1>Running stitch.</h1><main id="cloth" aria-label="Morse sampler"></main><label for="message">Message · letters and spaces</label><input id="message" maxlength="40" value="SEND TEA" autocomplete="off"><script>const codes=['.-','-...','-.-.','-..','.','..-.','--.','....','..','.---','-.-','.-..','--','-.','---','.--.','--.-','.-.','...','-','..-','...-','.--','-..-','-.--','--..'];function stitch(){cloth.replaceChildren();for(const ch of message.value.toUpperCase()){if(ch===' '){let n=document.createElement('span');n.className='space';cloth.append(n);continue}let v=codes[ch.charCodeAt(0)-65];if(!v)continue;let el=document.createElement('div');el.className='letter';let row=document.createElement('div');row.className='line';for(let s of v){let b=document.createElement('i');b.className='thread '+(s==='-'?'dash':'');row.append(b)}el.append(row,ch);cloth.append(el)}}message.oninput=stitch;stitch()</script></html>
