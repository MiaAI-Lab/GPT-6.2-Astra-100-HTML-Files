<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Minute of Ash</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at bottom,#482c24,#231d1c 75%);color:#ffc087;font:16px Georgia}main{width:min(90vw,920px);text-align:center}small{font:12px monospace;letter-spacing:.2em}time{display:block;font:normal clamp(66px,14vw,170px)/1.05 Georgia;font-variant-numeric:tabular-nums;letter-spacing:-.055em}canvas{width:100%;height:36vh;display:block}p{font-style:italic;color:#e2c0ac}</style><main><small>THE HEARTH KEEPER'S CLOCK</small><time id="dial"></time><canvas id="bed" aria-label="Sixty coals count out the seconds"></canvas><p>One coal for every second the minute has kept.</p></main><script>const ctx=bed.getContext('2d');function hearth(){let now=new Date(),s=now.getSeconds(),w=bed.clientWidth,h=bed.clientHeight,d=Math.min(2,devicePixelRatio);bed.width=w*d;bed.height=h*d;ctx.scale(d,d);dial.textContent=now.toLocaleTimeString([],{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});for(let i=0;i<60;i++){let x=(i%10+.5)*w/10,y=(Math.floor(i/10)+.6)*h/6,r=Math.min(w/23,h/14),hot=i<s;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(i*32)*.45);let glow=ctx.createRadialGradient(-r*.15,0,0,0,0,r);glow.addColorStop(0,hot?'#ffc087':'#645750');glow.addColorStop(.58,hot?'#ba5930':'#514641');glow.addColorStop(1,'#312421');ctx.fillStyle=glow;ctx.beginPath();for(let j=0;j<8;j++){let a=j*Math.PI/4,R=r*(.82+.17*Math.sin(i*9+j*41));ctx.lineTo(Math.cos(a)*R*1.13,Math.sin(a)*R*.78)}ctx.closePath();ctx.fill();ctx.strokeStyle='#302324';ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(-r*.23,-r*.2);ctx.lineTo(0,r*.12);ctx.lineTo(r*.4,-r*.52);ctx.stroke();ctx.restore()}}hearth();onresize=hearth;setInterval(hearth,1000)</script></html>
