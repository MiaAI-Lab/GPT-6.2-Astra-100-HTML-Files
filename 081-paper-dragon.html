<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ribbon Beast</title><style>body{background:#f0c76f;color:#492a22;margin:0}main{height:100svh;position:relative;overflow:hidden}canvas{width:100%;height:100%;touch-action:none;display:block}header,footer{position:absolute;pointer-events:none;left:5vw}header{top:4vh}h1{font:900 clamp(48px,10vw,145px)/.85 system-ui;letter-spacing:-.085em;margin:.12em 0}small,footer{font:bold 13px monospace}footer{bottom:4vh}canvas:focus-visible{outline:4px dashed #963e39;outline-offset:-6px}</style><main><canvas id="field" tabindex="0" aria-label="Guide the dragon by touch or arrow keys"></canvas><header><small>SOUTH GATE • PAPER PARADE</small><h1>Ribbon Beast</h1></header><footer>Take the nose for a walk ↗</footer></main><script>const g=field.getContext('2d');let w,h,r,chain=[];function oval(x,y,a,b,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,a,b,0,0,7);g.fill()}function draw(){g.clearRect(0,0,w,h);for(let i=chain.length-1;i>=0;i--){let p=chain[i],next=chain[i+1]||chain[i-1],a=Math.atan2(p.y-next.y,p.x-next.x);g.save();g.translate(p.x,p.y);g.rotate(a);g.scale(r,r);if(i){let k=Math.min(1,(chain.length-i)/6);g.scale(k,k);g.fillStyle='#963e39';g.beginPath();g.moveTo(-1,-.3);g.lineTo(-1.25,-1.4);g.lineTo(.75,-.5);g.fill();oval(0,0,1,1,'#773630');oval(.08,0,.88,.9,i%2?'#b44f38':'#ce6845');oval(.2,0,.22,.7,'#f0c76f')}else{g.strokeStyle='#492a22';g.lineWidth=.1;for(let s of [-1,1]){g.beginPath();g.moveTo(-.2,s*.5);g.lineTo(-1.25,s*1.45);g.lineTo(-.92,s*.65);g.stroke();g.beginPath();g.moveTo(1,s*.45);g.quadraticCurveTo(2.4,s*2,2.6,s*.5);g.stroke()}oval(0,0,1.5,1.03,'#963e39');oval(1.1,0,.8,.6,'#d96536');for(let s of [-1,1]){oval(.4,s*.62,.38,.29,'#fff0bf');oval(.52,s*.63,.13,.15,'#492a22')}}g.restore()}}function resize(){w=field.clientWidth;h=field.clientHeight;r=Math.min(w,h)*.039;let d=Math.min(2,devicePixelRatio);field.width=w*d;field.height=h*d;g.setTransform(d,0,0,d,0,0);chain=Array.from({length:31},(_,i)=>({x:w*(.85-.70*i/30),y:h*(.57+.12*Math.sin(i*.24))}));draw()}function lead(x,y){chain[0]={x,y};for(let i=1;i<chain.length;i++){let p=chain[i],q=chain[i-1],a=Math.atan2(p.y-q.y,p.x-q.x);p.x=q.x+Math.cos(a)*r*.92;p.y=q.y+Math.sin(a)*r*.92}draw()}field.onpointerdown=e=>{field.setPointerCapture(e.pointerId);lead(e.clientX,e.clientY)};field.onpointermove=e=>{if(e.buttons)lead(e.clientX,e.clientY)};field.onkeydown=e=>{let dir={ArrowLeft:[-20,0],ArrowRight:[20,0],ArrowDown:[0,20],ArrowUp:[0,-20]}[e.key];if(dir){e.preventDefault();lead(Math.max(0,Math.min(w,chain[0].x+dir[0])),Math.max(0,Math.min(h,chain[0].y+dir[1])))}};onresize=resize;resize()</script></html>
