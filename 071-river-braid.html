<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Channels of the Vey</title><style>body{margin:0;background:#d8c9ac;color:#344f53;font-family:Georgia}canvas{width:100%;height:100svh;display:block}header{position:absolute;top:5vh;left:5vw}small{font:12px monospace;letter-spacing:.18em}h1{font:italic clamp(39px,7vw,90px)/.95 Georgia;margin:.2em 0}label{position:absolute;bottom:5vh;left:5vw;background:#e8dcc1;border:1px solid;padding:12px 18px;font:13px monospace}input{display:block;width:min(60vw,290px);accent-color:#52757b;margin-top:10px}</style><canvas aria-label="Braided channels of the Vey River"></canvas><header><small>IMAGINED WATERSHEDS / PLATE VII</small><h1>Channels<br>of the Vey</h1></header><label>HEADWORKS · DIVERT FLOW<input type="range" value="46"></label><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('input');function river(){let w=c.clientWidth,h=c.clientHeight,d=Math.min(devicePixelRatio,2),v=s.value/100;c.width=w*d;c.height=h*d;g.scale(d,d);let seed=125;function r(){seed=seed*16807%2147483647;return seed/2147483647}g.fillStyle='#836e4d35';for(let j=0;j<4200;j++)g.fillRect(r()*w,r()*h,r()*2.6+.4,1);for(let i=0;i<38;i++){let k=i/37-.5;g.beginPath();for(let j=0;j<=200;j++){let x=j/200*w,u=j/200;let y=h*(.69-.33*u+.10*Math.sin(8*u)+k*(.30+.19*Math.sin(u*13+v*3))+.045*Math.sin(13*u+i*.43+v*3)+.021*Math.sin(23*u+i*.2));g.lineTo(x,y)}g.strokeStyle='#ebe1ca';g.lineWidth=4+(i%5);g.stroke();g.lineWidth=(1.4+i%4)*(1+.35*Math.sin(i+v*5));g.strokeStyle=i%4?'#6a9292':'#446f79';g.stroke()}g.font='italic 15px Georgia';g.fillStyle='#4c625e';g.fillText('Broom Flats',w*.68,h*.23);g.fillText('South gravel beds',w*.53,h*.76);g.font='13px monospace';g.fillText('N ↑',w*.87,h*.09)}onresize=s.oninput=river;river()</script></html>
