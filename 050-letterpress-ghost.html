<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Ghost Impression</title><style>*{box-sizing:border-box}body{margin:0;background:#eeebd9;color:#1d4967;font:14px monospace}main{max-width:950px;margin:auto;padding:4vh 5vw}header,footer{border-block:1px solid;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 0}header{font-size:12px;letter-spacing:.11em}svg{display:block;width:100%;height:62vh}svg use{mix-blend-mode:multiply}input{accent-color:#1d4967;width:min(40vw,260px)}label{display:flex;gap:10px;align-items:center}h1{font:italic 25px Georgia;margin:.5em 0}</style><main><header><b>FINCH PRINTING OFFICE</b><span>GALLEY 050 / TWO PLATES</span></header><svg viewBox="0 0 610 450"><defs><g id="type" font-family="Georgia,serif" text-anchor="middle"><text x="305" y="106" font-size="84" letter-spacing="20">ECHO</text><text x="305" y="205" font-size="113" letter-spacing="12">ECHO</text><text x="305" y="307" font-size="133" font-weight="bold">ECHO</text><text x="305" y="412" font-size="144" letter-spacing="-8" font-family="Arial,sans-serif" font-weight="900">ECHO</text></g><g id="cross" fill="none" stroke="#1d4967"><circle r="6"/><path d="M-12 0h24M0-12v24"/></g></defs><use href="#cross" x="17" y="20"/><use href="#cross" x="593" y="20"/><use href="#cross" x="17" y="430"/><use href="#cross" x="593" y="430"/><use href="#type" fill="#1d4967"/><use href="#type" id="ghost" fill="#dc795f"/></svg><footer><h1>The ghost impression</h1><label>REGISTER <input id="screw" type="range" min="-20" max="20" value="10"></label><output id="registerReadout"></output></footer></main><script>function register(){let n=+screw.value;ghost.setAttribute('transform','translate('+n+' '+n*.3+')');registerReadout.value=n===0?'IN REGISTER':(n>0?'+':'')+(n*.2).toFixed(1)+' mm'}screw.oninput=register;register()</script></html>
