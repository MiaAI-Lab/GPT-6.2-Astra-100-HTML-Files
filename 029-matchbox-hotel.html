<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Matchbox Hotel</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#cc6550;color:#251f22;display:grid;place-items:center;font:16px Georgia}main{text-align:center;width:min(90%,810px)}small{letter-spacing:.25em;font:12px monospace}.case{position:relative;width:58%;margin:10vh auto;transform:rotate(-8deg);transition:translate .65s cubic-bezier(.25,.8,.2,1)}.open .case{translate:-17% 0}.lid{position:relative;background:#eed4a5;border:8px solid #251f22;box-shadow:0 12px #77604e,0 21px 0 #36262a,5px 26px 16px #7c4135;padding:6% 2% 8%}.lid:after{content:'';position:absolute;bottom:0;left:0;width:100%;height:9%;background:radial-gradient(#eed4a5 1px,#251f22 2px);background-size:5px 5px}b{display:block;font:900 clamp(60px,14vw,145px)/1 Georgia}h1{font: bold clamp(15px,3vw,38px) Georgia;margin:0}.drawer{position:absolute;inset:3% 0 5%;background:#f6e5c9;border:7px ridge #c5a37b;display:grid;align-content:center;padding:3%;font:clamp(12px,1.6vw,19px)/1.4 monospace;transition:transform .65s cubic-bezier(.25,.8,.2,1)}.open .drawer{transform:translateX(72%);padding-left:27%}button{font:bold 16px Georgia;background:#251f22;color:#f6e5c9;padding:13px 25px;border:0;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:4px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><main id="hotel"><small>FRONT DESK　·　OPEN ALL NIGHT</small><div class="case"><div class="drawer" id="card"></div><div class="lid">✦　✦　✦<b>H</b><h1>Matchbox Hotel</h1><i>Single rooms</i></div></div><button id="key">Turn the room key</button><p>One guest to a drawer. Breakfast by the spark.</p></main><script>let n=0;key.onclick=()=>{let open=hotel.classList.toggle('open');if(open){card.textContent=['01 / M. Finch. Sleeps with a thimble of rain.','02 / J. Wick. Left a scarf of blue smoke.','03 / A. Ash. Requests the cold pillow.'][n++%3]}key.textContent=open?'Close the drawer':'Turn the room key'}</script></html>
