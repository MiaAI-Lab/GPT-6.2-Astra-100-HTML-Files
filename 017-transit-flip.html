<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Last Cars</title><style>*{box-sizing:border-box}body{margin:0;background:#29342c;color:#ffda70;font:14px monospace}main{width:min(1140px,92vw);margin:14vh auto}header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:4px solid}h1{font:900 clamp(45px,7vw,90px) Arial;letter-spacing:-.07em;margin:0}section{display:flex;gap:.5vw;margin:8vh 0 2vh}i{position:relative;flex:1;min-width:0;background:linear-gradient(#18241d 48%,#0c160f 49% 51%,#202b23 52%);box-shadow:0 4px 0 #111b15;text-align:center;font:normal clamp(26px,7.5vw,107px)/1.5 monospace;border-radius:3px;animation:flip .55s cubic-bezier(.3,.8,.4,1) both}i:after{content:'';position:absolute;inset:49% 0 auto;height:2px;background:#121c15bb}@keyframes flip{from{transform:perspective(300px) rotateX(-82deg);color:#665c32}}footer{display:flex;justify-content:space-between;gap:12px;align-items:center}button{font:bold 13px monospace;background:#ffda70;border:0;padding:14px;color:#29342c;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}p{color:#d2dbc9}@media(prefers-reduced-motion:reduce){i{animation:none}}</style><main><header><h1>Last cars</h1><small>WEST DEPOT</small></header><p>Outbound trams　 /　 Night roster</p><section aria-label="Destination"></section><footer><output></output><button>Dispatch car →</button></footer></main><script>let n=0,r=[['SALT QUAY','23.48　 /　 TRACK 3'],['FOX YARDS','00.06　 /　 TRACK 1'],['OLD BASIN','00.19　 /　 TRACK 2']];function show(){let s=document.querySelector('section');s.replaceChildren();for(let [k,ch] of [...r[n][0]].entries()){let i=document.createElement('i');i.textContent=ch;i.style.animationDelay=k*.045+'s';s.append(i)}document.querySelector('output').value=r[n][1]}document.querySelector('button').onclick=()=>{n=(n+1)%3;show()};show()</script></html>
