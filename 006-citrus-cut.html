<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanguinella</title><style>*{box-sizing:border-box}body{margin:0;background:#ffc85b;color:#552724}main{min-height:100svh;display:grid;grid-template-columns:3fr 2fr;align-items:center;padding:4vw;gap:3vw}canvas{width:100%;aspect-ratio:1}small,label{font:bold 12px monospace;letter-spacing:.15em}h1{font:900 clamp(55px,7vw,120px)/.82 Arial;letter-spacing:-.08em;margin:.4em 0}p{font:italic 22px/1.4 Georgia;max-width:23ch}input{display:block;width:90%;accent-color:#b83f25;margin:20px 0}:focus-visible{outline:3px solid}@media(max-width:650px){main{grid-template-columns:1fr;gap:0}canvas{max-height:48svh;object-fit:contain}h1{font-size:clamp(40px,12vw,64px)}h1 br{display:none}}</style><main><canvas aria-label="Cross section of a blood orange"></canvas><section><small>FRUTTA　 /　 LOT 06</small><h1>Sangui<br>nella.</h1><p>Ruby at the heart, bitter at the rim. A cut for the morning table.</p><label>SECTION DEPTH<input type="range" min="12" max="100" value="80"></label></section></main><script>
let c=document.querySelector('canvas'),g=c.getContext('2d'),sl=document.querySelector('input');function paint(){let d=Math.min(1400,Math.round(c.clientWidth*devicePixelRatio));c.width=c.height=d;g.setTransform(d/600,0,0,d/600,d/2,d/2);let r=125+1.45*sl.value;function disc(r,color){g.fillStyle=color;g.beginPath();g.arc(0,0,r,0,7);g.fill()}disc(r+12,'#ac4925');disc(r+7,'#ff9433');disc(r,'#ffe4ac');let seed=72,rand=()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296);for(let j=0;j<11;j++){let a=j*Math.PI*2/11+.13,b=a+.55;g.save();g.beginPath();g.moveTo(0,0);g.arc(0,0,r-7,a,b);g.closePath();g.clip();disc(r,['#bf4825','#af3725','#cb5226'][j%3]);for(let k=0;k<460;k++){let t=a+rand()*.57,R=Math.sqrt(rand())*r;g.fillStyle=['#ed7132','#9e3027','#dc5b2c','#f48a42','#b83f25'][k%5];g.beginPath();g.ellipse(Math.cos(t)*R,Math.sin(t)*R,2+rand()*7,1+rand()*3,t,0,7);g.fill()}g.restore()}disc(3+sl.value*.11,'#ffddb0')}sl.oninput=paint;onresize=paint;paint()
</script></html>
