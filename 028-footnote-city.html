<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A City in the Margins</title><style>*{box-sizing:border-box}body{margin:6vw;background:#ebe5cd;color:#322f27;font:18px Georgia}header{border-block:3px double;padding:14px 0;display:flex;justify-content:space-between;font-variant:small-caps}main{display:grid;grid-template-columns:2fr 1fr;align-items:center;gap:6vw;min-height:75vh}article{font-size:clamp(38px,5.7vw,86px);line-height:1.13;letter-spacing:-.04em}button{font:bold 20px Georgia;vertical-align:super;background:none;color:#573b54;border:1px solid;border-radius:50%;cursor:pointer}button[aria-pressed=true]{background:#573b54;color:#ebe5cd}aside{border-left:1px solid;padding-left:1.5em}svg{width:100%;background:#d5ccb0}h1{font-size:26px;font-style:italic}small{font:12px monospace;letter-spacing:.15em}footer{border-top:1px solid;padding-top:12px;font-style:italic}@media(max-width:650px){main{display:block}article{margin:40px 0}aside{margin-bottom:30px}svg{max-height:145px}}</style><header><span>The Periphery Reader</span><span>Volume IV</span></header><main><article>From the steps<button aria-label="Note one">1</button> I carried a pear down Salt Lane<button aria-label="Note two">2</button> to a house with two shadows.<button aria-label="Note three">3</button></article><aside id="margin"><small>WALKER'S MARGINALIA</small><h1 id="place"></h1><svg viewBox="0 0 240 140"><g id="streets" stroke="#ebe5cd" stroke-width="7"></g><circle id="pin" r="8" fill="#573b54" stroke="#fff5da" stroke-width="3"/></svg><p id="note" aria-live="polite"></p></aside></main><footer>Consult the numbered marks in the passage.</footer><script>let data=[['I. Pigeon Steps','At noon the flower seller poured her leftover water down all nineteen steps.',62,79],['II. Salt Lane','The grocer kept a saucer outside for the donkey that brought the morning milk.',121,45],['III. Double House','Two chimneys shared a kitchen. In the winter each family lit its own side.',179,109]];function show(i){let d=data[i];place.textContent=d[0];note.textContent=d[1];pin.setAttribute('cx',d[2]);pin.setAttribute('cy',d[3]);streets.innerHTML='';for(let j=-2;j<9;j++){streets.innerHTML+='<path d="M'+(j*32)+' 0l'+(18+i*12)+' 145 M0 '+(j*27)+'l245 '+(-30+i*5)+'"/>'}document.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));if(!matchMedia('(prefers-reduced-motion:reduce)').matches)margin.animate([{opacity:.4},{opacity:1}],{duration:250,easing:'ease-out'})}document.querySelectorAll('button').forEach((b,j)=>b.onclick=()=>show(j));show(0)</script></html>
