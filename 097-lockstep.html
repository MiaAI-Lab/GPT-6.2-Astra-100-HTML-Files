<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Keyless Works</title><style>body{margin:0;background:#cec7a6;color:#554a34;font:18px Georgia}main{max-width:850px;margin:4vh auto;padding:0 5vw}h1{font:normal clamp(40px,7vw,88px) Georgia;margin:.16em 0;letter-spacing:-.055em}small{font:bold 12px monospace;letter-spacing:.14em}svg{width:100%;max-height:49vh;border-block:1px solid #8f8569}button{font:bold 15px monospace;background:#554a34;color:#f3e7bd;padding:13px 18px;border:0;cursor:pointer}#moving,#pin{transition:transform .35s cubic-bezier(.2,.75,.25,1.15)}footer{display:flex;align-items:center;justify-content:space-between;gap:12px}@media(prefers-reduced-motion:reduce){#moving,#pin{transition:none}}</style><main><small>CLOCKMAKER'S EXERCISES　/　VII</small><h1>The keyless works</h1><svg viewBox="0 0 600 280" aria-label="Two brass wheels with opposing red witness lines"><defs><g id="wheel"><path id="teeth" fill="#b19a58" stroke="#554a34" stroke-width="2"/><circle r="85" fill="none" stroke="#75653e"/><g id="holes"></g><circle r="12" fill="#706747" stroke="#554a34"/><path d="m-7 4 14-8" stroke="#e4dabb" stroke-width="3"/><path d="M72 0H97" stroke="#8c4130" stroke-width="5"/></g></defs><g transform="translate(204 140)"><use href="#wheel"/></g><g transform="translate(397 140)"><g id="moving"><use href="#wheel"/></g></g><path id="pin" d="M288 14h24v25l-12 14-12-14z" fill="#554a34"/></svg><p>Bring the red witness lines nose to nose.</p><footer><button id="advance">Advance wheel</button><small id="reading"></small></footer></main><script>let path='';for(let i=0;i<96;i++){let a=(i-.5)*Math.PI/48,r=i%4<2?101:92;path+=(i?'L':'M')+Math.cos(a)*r+' '+Math.sin(a)*r}teeth.setAttribute('d',path+'Z');for(let j=0;j<6;j++)holes.innerHTML+='<ellipse transform="rotate('+j*60+')" cx="51" cy="0" rx="24" ry="14" fill="#cec7a6" stroke="#776a49"/>';let deg=90;function display(){moving.style.transform='rotate('+deg+'deg)';let lock=deg===180;pin.style.transform=lock?'translateY(75px)':'';reading.textContent=lock?'PIN SEATED':deg+'° / FREE';advance.textContent=lock?'Release & reset':'Advance one tooth'}advance.onclick=()=>{deg=deg===180?90:deg+15;display()};display()</script></html>
