<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The North Pitch</title><style>*{box-sizing:border-box}body{margin:0;background:#d0d3a7;color:#364735;font:18px Georgia}main{max-width:1050px;margin:auto;padding:4vh 5vw}h1{font:normal clamp(49px,8vw,116px)/1 Georgia;letter-spacing:-.06em;margin:.18em 0}small{font:bold 12px monospace;letter-spacing:.14em}svg{width:100%;display:block;max-height:47vh}nav{border-block:1px solid #485d40;padding:8px 0;display:flex;gap:1em;flex-wrap:wrap}button{font:italic 18px Georgia;background:none;color:inherit;border:0;border-bottom:2px solid transparent;padding:8px 0;cursor:pointer}button[aria-pressed=true]{border-color:currentColor}p{max-width:52ch}</style><main><small>ROOFLINE FIELD NOTES　/　ASH COTTAGE</small><h1>The north pitch.</h1><svg viewBox="0 0 700 280" aria-label="Slate roof and enlarged circular specimen"><defs><pattern id="slate" width="76" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)"><rect width="76" height="42" fill="#819282"/><path d="M0 0v18q16 16 38 0V0m0 0v18q17 16 38 0M18 24v18m39-18v18" fill="none" stroke="#465c50" stroke-width="3"/></pattern><g id="lichen"><path d="M-24 7Q-34-13-14-14Q-9-28 6-19Q22-29 23-11Q41 0 26 13Q18 26 5 18Q-13 29-24 7" fill="#dfb960" stroke="#785c35"/><circle cx="-8" cy="-4" r="5" fill="#9e7940"/><circle cx="10" cy="6" r="7" fill="#9e7940"/></g><g id="moss" fill="#52663d" stroke="#aab36b"><circle cx="-12" cy="3" r="17"/><circle cx="9" cy="0" r="21"/><path d="m-12 7 4-15m9 19 5-18m5 14 5-10"/></g><g id="stone" stroke="#465c36" fill="#9cac78"><path d="M0 18Q-40 14-24-2Q-3-5 0 18Q-21-26-6-25Q8-23 0 18Q12-30 25-15Q34-5 0 18Q27 3 29 15Q30 24 0 18"/></g></defs><path d="M0 195 700 14V280H0Z" fill="url(#slate)"/><use href="#lichen" x="138" y="212"/><use href="#moss" x="350" y="163"/><use href="#stone" x="552" y="90"/><g id="lens"><circle r="54" fill="#e6e3ba" stroke="#485d40" stroke-width="3"/><use id="sample" transform="scale(1.5)"/></g></svg><nav><button>Lichen coins</button><button>Moss cushion</button><button>Stonecrop</button></nav><p id="entry" aria-live="polite"></p></main><script>let sites=[['lichen',138,175,'On the lowest slates the gold patches sit almost flush, as though someone has rubbed coins into the stone.'],['moss',350,140,'A green cushion straddles the seam. Rain collects at its tips long after the gutter has stopped singing.'],['stone',552,86,'Five fleshy leaves have made a rosette in the old nail hole. From the lane it resembles a green brass tack.']];document.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{let [id,x,y,note]=sites[i];lens.setAttribute('transform','translate('+x+' '+y+')');sample.setAttribute('href','#'+id);entry.textContent=note;document.querySelectorAll('button').forEach(k=>k.setAttribute('aria-pressed',k===b))});document.querySelector('button').click()</script></html>
