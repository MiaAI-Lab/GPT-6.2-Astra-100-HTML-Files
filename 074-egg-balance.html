<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Patient Egg</title><style>*{box-sizing:border-box}body{margin:0;background:#c7dbbb;color:#496451;font:17px Georgia;padding:5vh 6vw;overflow-x:hidden}h1{font:italic clamp(42px,8vw,104px) Georgia;letter-spacing:-.06em;margin:.12em 0}small,label{font:12px monospace;letter-spacing:.12em}.apparatus{height:41vh;position:relative}#beam{position:absolute;left:0;top:66%;width:100%;height:12px;background:linear-gradient(90deg,#496451 0 45%,#eae5b8 45% 55%,#496451 55%);z-index:1}.fulcrum{position:absolute;top:66%;left:calc(50% - 30px);border:solid transparent;border-width:0 30px 54px;border-bottom-color:#849978}#egg{position:absolute;bottom:100%;width:clamp(48px,8vw,100px);aspect-ratio:.74;transform-origin:center bottom;background:radial-gradient(ellipse at 48% 38%,#687254 0 1px,transparent 2px) 4px 1px/13px 17px,radial-gradient(ellipse at 20% 20%,#889470 0 2px,transparent 3px) 3px 5px/21px 23px,radial-gradient(ellipse at 28% 28%,#f0edc9,#a6b28d 70%,#83967e);border:1px solid #7c8b69;border-radius:53% 47% 47% 53% / 62% 63% 37% 38%}footer{display:flex;align-items:center;gap:2em;flex-wrap:wrap}input{display:block;width:min(65vw,390px);accent-color:#496451}button{color:inherit;border:1px solid;background:none;font:16px Georgia;padding:10px}</style><small>KITCHEN EXPERIMENT 74</small><h1>The patient egg.</h1><p id="hint">Tilt toward the pale nest. Counter-tilt to brake. Hold for two seconds.</p><div class="apparatus"><div class="fulcrum"></div><div id="beam"><div id="egg"></div></div></div><footer><label>LEFT ← BEAM → RIGHT<input type="range" min="-10" max="10" value="0"></label><button>Reset egg</button><b id="score">Unsettled</b></footer><script>const slider=document.querySelector('input'),calm=matchMedia('(prefers-reduced-motion: reduce)').matches;let x=.28,v=0,hold=0,last=0;if(calm)slider.value=-5;if(calm)hint.textContent='Place the egg on the pale nest and hold for two seconds.';function tick(t){let dt=Math.min((t-last)/1000,.04);last=t;let tilt=Number(slider.value);if(calm)x=.5+tilt*.042;else{v=(v+tilt*.028*dt)*Math.exp(-1.22*dt);x+=v*dt;if(x<.05||x>.95){x=Math.max(.05,Math.min(.95,x));v*=-.28}}beam.style.transform='rotate('+(calm?0:tilt*.65)+'deg)';egg.style.left=x*100+'%';egg.style.transform='translateX(-50%) rotate('+((x-.5)*35)+'deg)';hold=Math.abs(x-.5)<.05&&Math.abs(v)<.025?hold+dt:0;score.textContent=hold>=2?'Balanced. A steady hand.':hold>.1?'Holding · '+hold.toFixed(1)+' s':'Unsettled';requestAnimationFrame(tick)}requestAnimationFrame(tick);document.querySelector('button').onclick=()=>{x=.28;v=0;hold=0;slider.value=calm?-5:0}</script></html>
