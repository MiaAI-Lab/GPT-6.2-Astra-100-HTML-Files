<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Vanishing Disc</title><style>*{box-sizing:border-box}body{margin:0;background:#261c27;color:#ffdfb5;font:14px monospace}main{height:100svh;min-height:550px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}header,footer{padding:20px 6vw;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font:italic clamp(25px,4vw,52px) Georgia;margin:0}.orbit{position:relative;display:grid;place-items:center}.star,.moon,.rays{position:absolute;width:min(42vw,36vh);aspect-ratio:1;border-radius:50%}.star{background:#ffcc88;box-shadow:0 0 12px #ffb875,0 0 38px #ffb87588,0 0 90px #ffb87544}.rays{scale:2.6;background:repeating-conic-gradient(from 13deg,#ffc78a99 0 .25deg,transparent .4deg 3.72deg);mask:radial-gradient(black 15%,#0009 31%,transparent 70%)}.moon{background:#261c27;box-shadow:inset 0 0 2px #9c6854}label{display:grid;gap:9px;font-size:12px;letter-spacing:.16em}input{accent-color:#ffb875;width:min(60vw,320px)}footer{border-top:1px solid #79616c}output{font:italic 22px Georgia}</style><main><header><h1>The vanishing disc</h1><small>OCCULTATION MODEL / VII</small></header><div class="orbit"><div id="rays" class="rays"></div><div class="star"></div><div id="moon" class="moon"></div></div><footer><label>LUNAR ALIGNMENT<input id="align" type="range" min="-100" max="100" value="-32"></label><output id="phase"></output></footer></main><script>function read(){let v=+align.value;moon.style.translate=v+'% 0';rays.style.opacity=.18+.82*(1-Math.abs(v)/100)**4;phase.value=v===0?'Totality / corona visible':v<0?'Ingress / '+Math.abs(v)+' divisions':'Egress / '+v+' divisions'}align.oninput=read;read()</script></html>
