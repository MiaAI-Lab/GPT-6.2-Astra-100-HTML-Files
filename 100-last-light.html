<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Last Light</title><style>*{box-sizing:border-box}body{margin:0;background:#f4e1c9;color:#70495b;font-family:Georgia}main{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}header,footer{padding:3vh 5vw;display:flex;align-items:center;justify-content:space-between;gap:14px}small{font:12px monospace;letter-spacing:.14em}h1{font:italic clamp(30px,5vw,72px)/1 Georgia;margin:0}.pan{position:relative;display:grid;place-items:center;min-height:48vh;margin:0 4vw}.pan p{text-align:center;font:italic clamp(25px,5vw,70px) Georgia;position:relative;padding-right:35%;width:100%;margin:0}.pan svg{position:absolute;width:100%;height:100%;transition:transform 1.6s cubic-bezier(.65,0,.22,1),filter 1.6s;transform-origin:70% center;box-shadow:0 5px 9px #70495b33}.shut svg{transform:scaleX(.026);filter:brightness(.77)}button{border:1px solid #70495b;background:none;color:inherit;font:italic 17px Georgia;padding:11px 20px;cursor:pointer}@media(prefers-reduced-motion:reduce){.pan svg{transition:none}}</style><main><header><h1>The last light</h1><small>ENDPIECE　/　100</small></header><div class="pan" id="pan"><p>Carry the evening home.</p><svg viewBox="0 0 900 400" preserveAspectRatio="none" aria-label="An accordion-fold panorama of a sun setting behind plum-colored mountains"><defs><linearGradient id="sky" x2="0%" y2="100%"><stop stop-color="#db9e98"/><stop offset="1" stop-color="#f0bb92"/></linearGradient><pattern id="fold" width="150" height="400" patternUnits="userSpaceOnUse"><path d="M0 0h75v400H0Z" fill="#72556a" opacity=".13"/><path d="M75 0h75v400H75Z" fill="#fff2d8" opacity=".1"/><path d="M75 0v400" stroke="#f8debc" opacity=".5"/></pattern></defs><rect width="900" height="400" fill="url(#sky)"/><circle cx="550" cy="201" r="95" fill="#ffe4aa"/><path d="M0 245 110 203 181 224 288 187 343 217 433 188 504 216 572 192 629 205 728 173 900 231V400H0Z" fill="#b48c99"/><path d="M0 182 58 215 136 221 258 274 336 255 405 284 514 254 620 242 769 195 900 206V400H0Z" fill="#957589"/><path d="M0 265 139 286 234 321 367 317 418 330 547 297 664 284 780 238 900 224V400H0Z" fill="#70495b"/><path d="m0 342 105-22 127 21 80 1 89 25 90 3 92 30H0Z" fill="#543f51"/><rect width="900" height="400" fill="url(#fold)"/></svg></div><footer><small>FOLDED VIEWS　·　DUSK</small><button id="foldBtn" aria-expanded="true">Fold the evening ↤</button></footer></main><script>foldBtn.onclick=()=>{let closed=pan.classList.toggle('shut');foldBtn.textContent=closed?'Unfold the view ↔':'Fold the evening ↤';foldBtn.setAttribute('aria-expanded',!closed)}</script></html>
