<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convergence</title><style>*{box-sizing:border-box}body{margin:0;background:#242c31;color:#f0cf69;font:14px monospace}main{max-width:1300px;margin:auto;padding:6vh 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid #798184;padding-bottom:14px}h1{font:normal clamp(36px,8vw,110px)/1 monospace;letter-spacing:-.08em;margin:.55em 0}svg{width:100%;background:repeating-linear-gradient(90deg,transparent 0 39px,#ffffff09 40px)}section{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-top:1px solid #798184;padding:20px 0}output{font: bold 34px monospace;color:white}input{accent-color:#f0cf69;width:min(45vw,360px)}p{color:#c5ced2}</style><main><header><b>DEPT. OF OPTICS</b><span>BENCH 04 / AIR</span></header><h1>Convergence</h1><svg viewBox="0 0 800 300" aria-label="Parallel rays converging beyond a convex lens"><defs><pattern id="rule" width="16" height="15" patternUnits="userSpaceOnUse"><path d="M0 0v12" stroke="#becbcc"/></pattern></defs><path d="M0 150h800" stroke="#859496" stroke-dasharray="4 8"/><g id="rays" fill="none" stroke="#f0cf69" stroke-width="2"></g><path d="M318 37Q266 150 318 263Q370 150 318 37" fill="#8bcbc64d" stroke="#aad4d6" stroke-width="2"/><rect x="0" y="275" width="800" height="16" fill="url(#rule)"/></svg><section><label for="focus">FOCAL LENGTH</label><input id="focus" type="range" min="85" max="410" value="192"><output id="mm"></output></section><p>Set the distance from the optical center to the point of reunion.</p></main><script>function trace(){let f=+document.querySelector('input').value;rays.innerHTML=[-78,-39,0,39,78].map(y=>'<path d="M0 '+(150+y)+'H318L800 '+(150+y*(1-482/f))+'"/>').join('');mm.textContent=f+' mm'}document.querySelector('input').oninput=trace;trace()</script></html>
