<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Silent Downbeat</title><style>*{box-sizing:border-box}body{margin:0;background:#46212e;color:#f4dbab;text-align:center}main{padding:5vh 4vw}h1{font:italic clamp(37px,6vw,82px) Georgia;margin:.25em}small{font:11px monospace;letter-spacing:.2em}svg{height:50vh;width:100%}#hand{transition:transform .52s cubic-bezier(.4,-.22,.18,1.17)}button{background:#f4dbab;color:#46212e;border:0;padding:14px 32px;font:italic 22px Georgia;cursor:pointer}button:focus-visible{outline:3px double #f4dbab;outline-offset:5px}output{display:block;margin:16px;font:12px monospace;letter-spacing:.2em}@media(prefers-reduced-motion:reduce){#hand{transition:none}}</style><main><small>STUDIO PER DIREZIONE　 /　 COMMON TIME</small><h1>The Silent Downbeat</h1><svg viewBox="0 0 420 320" aria-label="Four-beat conducting diagram"><path d="M210 51Q180 180 210 264Q182 219 92 174Q205 219 333 161Q235 168 210 51" fill="none" stroke="#ccac8c" stroke-width="1.5" stroke-dasharray="4 5"/><g id="marks"></g><g id="hand" style="transform:translate(210px,51px)"><path d="M0 0l116 65 7 -8z" fill="#f4dbab"/><path d="M113 61l30 12" stroke="#b89971" stroke-width="10" stroke-linecap="round"/></g></svg><button>Give the beat</button><output>PREPARATION　 /　 LEVARE</output></main><script>let pts=[[210,264],[92,174],[333,161],[210,51]],n=0;pts.forEach(([x,y],i)=>marks.innerHTML+='<circle cx="'+x+'" cy="'+y+'" r="17" fill="#46212e" stroke="#c99c7e"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" fill="#f4dbab">'+(i+1)+'</text>');document.querySelector('button').onclick=()=>{let [x,y]=pts[n];hand.style.transform='translate('+x+'px,'+y+'px) rotate('+[8,-18,12,-10][n]+'deg)';document.querySelector('output').value=['I　 /　 DOWN','II　 /　 IN','III　 /　 OUT','IV　 /　 UP'][n];n=(n+1)%4}</script></html>
