<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wind Post</title><style>*{box-sizing:border-box}body{margin:0;background:#c6b78c;color:#5e452d;font-family:Georgia}article{background:#e9dfb6;margin:3vh auto;padding:16px;width:min(90vw,650px);border:8px double #785c39;text-align:center;box-shadow:5px 7px #785c3940}small{font:bold 12px monospace;letter-spacing:.13em}h1{font:normal clamp(56px,9vw,104px)/1 Georgia;margin:.14em 0;letter-spacing:-.065em}canvas{width:100%;height:40vh;border-block:1px dashed #785c39}button{font:bold 14px monospace;letter-spacing:.06em;color:#e9dfb6;background:#624933;padding:13px 20px;border:0;cursor:pointer}</style><article><small>BOTANICAL AIRMAIL　/　MAPLE DIVISION</small><h1>Wind Post</h1><canvas id="air" aria-label="Veined maple seeds in flight"></canvas><p>From the high branch to the first patch of open earth.</p><button id="send">DISPATCH SEEDS ↗</button></article><script>const g=air.getContext('2d');let frame,calm=matchMedia('(prefers-reduced-motion:reduce)').matches;function scene(t=0){let w=air.clientWidth,h=air.clientHeight,d=Math.min(2,devicePixelRatio);if(air.width!==Math.round(w*d)||air.height!==Math.round(h*d)){air.width=w*d;air.height=h*d}g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);for(let i=0;i<14;i++){let u=((i*37%97)/99+.05),v=(i*23%91)/99+.04,s=Math.min(w,h)/260*(.6+.5*(i%4)/3);g.save();g.translate(w*u+Math.sin(i+t*3)*13,h*(t===0?v:Math.min(.93,v*.35+t*(.5+i%4*.15))));g.rotate(i*1.83+t*8);g.scale(s*(.85+.15*Math.sin(t*11+i)),s);g.fillStyle='#b29d66';g.strokeStyle='#785c39';g.beginPath();g.moveTo(0,0);g.bezierCurveTo(9,-12,25,-31,31,-51);g.bezierCurveTo(49,-56,54,-39,35,-24);g.quadraticCurveTo(16,-6,0,0);g.fill();g.stroke();for(let j=0;j<6;j++){g.beginPath();g.moveTo(2,-2);g.quadraticCurveTo(18+j,-17,33+j,-46+j*3);g.stroke()}g.fillStyle='#785c39';g.beginPath();g.ellipse(0,0,6,9,.5,0,7);g.fill();g.restore()}}send.onclick=()=>{cancelAnimationFrame(frame);let start=performance.now();function fly(n){let t=calm?1:Math.min(1,(n-start)/2700);scene(t);if(t<1)frame=requestAnimationFrame(fly)}frame=requestAnimationFrame(fly)};onresize=()=>scene();scene()</script></html>
