<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night Clerk</title><style>*{box-sizing:border-box}body{background:#242025;color:#272127;font:14px 'Courier New',monospace;margin:0}main{width:min(405px,89vw);margin:7vh auto}article{background:#ffcbb6;padding:30px 24px 40px;mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,black 90deg,transparent 0) bottom/16px 9px repeat-x}h1{font:900 clamp(32px,7vw,48px)/1 monospace;letter-spacing:-.08em;margin:12px 0}small{letter-spacing:.14em}.row,h2{display:flex;justify-content:space-between;gap:10px}.row{margin:8px 0}section{border-block:2px dashed;padding:10px 0}h2{font-size:20px}i{display:block;height:35px;width:61%;background:repeating-linear-gradient(90deg,#242025 0 2px,transparent 2px 5px,#242025 5px 6px,transparent 6px 8px,#242025 8px 12px,transparent 12px 14px)}nav{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}button{background:#3f363d;color:#ffcbb6;border:1px solid #7e666b;box-shadow:0 3px #151216;padding:12px;font:inherit;cursor:pointer}button:active{transform:translateY(2px)}button:focus-visible{outline:2px solid white}</style><main><article><small>24 HR　 /　 WINDOW B</small><h1>NIGHT CLERK</h1><p>Merchant of misplaced sleep<br>Terminal 03 · Till open</p><section></section><h2>TIME OWED <output></output></h2><i></i><p>Keep for your morning records.</p></article><nav><button>Old argument</button><button>Loose tap</button><button>Tomorrow</button><button>Settle till</button></nav></main><script>let a=[1,0,0],names=['Replay an argument','Listen to the tap','Rehearse tomorrow'],cost=[12,3,7];function render(){document.querySelector('section').innerHTML=a.some(Boolean)?a.map((v,i)=>v?'<div class="row"><span>'+v+' × '+names[i]+'</span><b>'+v*cost[i]+'m</b></div>':'').join(''):'Till settled. Sleep well.';document.querySelector('output').value=a.reduce((s,v,i)=>s+v*cost[i],0)+' min'}document.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{if(i===3)a.fill(0);else a[i]++;render()});render()</script></html>
