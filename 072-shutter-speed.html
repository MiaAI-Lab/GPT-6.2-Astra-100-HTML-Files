<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Turn of the Dancer</title><style>body{margin:0;background:#e5cbd4;color:#593850;font-family:Arial,sans-serif}header{padding:5vh 6vw 1vh;display:flex;align-items:baseline;gap:4vw;flex-wrap:wrap}h1{font:900 clamp(41px,7vw,105px)/.92 Arial;margin:.1em 0;letter-spacing:-.065em}small,label{font:12px monospace;letter-spacing:.15em}svg{width:100%;height:43vh;background:repeating-linear-gradient(90deg,transparent 0 39px,#79576b24 40px);border-block:1px solid}footer{padding:3vh 6vw;display:flex;justify-content:space-between;gap:1em;flex-wrap:wrap}input{accent-color:#593850;width:min(65vw,360px);display:block;margin:12px 0}i{font:italic 21px Georgia}</style><header><small>MOTION TEST<br>CONTACT 072</small><h1>One turn of<br>the dancer.</h1></header><svg viewBox="0 0 760 300" id="plate" aria-label="A dancer at multiple points through a turn"></svg><footer><label>EXPOSURE LENGTH<input type="range" min="1" max="15" value="11"></label><i id="time"></i></footer><script>const s=document.querySelector('input');function expose(){plate.replaceChildren();let n=Number(s.value);for(let j=0;j<n;j++){let t=(15-n+j)/14,a=t*Math.PI*2,x=84+t*590,y=134-28*Math.sin(t*Math.PI);let xml='<g transform="translate('+x+' '+y+') rotate('+(12*Math.sin(a))+')" fill="#593850" opacity="'+(.12+.82*((j+1)/n)**2)+'"><circle cy="-44" r="12"/><circle cx="-9" cy="-49" r="6"/><path d="M-7-33Q-19-15-8 6L-29 37Q0 49 30 32L6 4 12-19 6-32Z"/><g fill="none" stroke="#593850" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="8" d="M-6-24Q-37 '+(-20-22*Math.sin(a))+' -49 '+(-32-36*Math.sin(a))+'M8-24Q32 '+(-34+20*Math.cos(a))+' 51 '+(-28+37*Math.cos(a))+'"/><path stroke-width="11" d="M-7 31Q-17 64 '+(-10-22*Math.sin(a))+' 101M8 32Q'+(30+14*Math.sin(a))+' 58 '+(41+24*Math.cos(a))+' '+(68+23*Math.sin(a))+'"/></g></g>';plate.insertAdjacentHTML('beforeend',xml)}time.textContent=n+' recorded '+(n===1?'position':'positions')}s.oninput=expose;expose()</script></html>
