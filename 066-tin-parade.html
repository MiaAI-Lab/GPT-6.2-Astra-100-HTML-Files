<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Thursday Tin Parade</title><style>*{box-sizing:border-box}body{margin:0;background:#aacfc6;color:#762e2a;text-align:center;padding-top:6vh;font:16px Georgia}small{font:bold 12px monospace;letter-spacing:.22em}h1{font:900 clamp(42px,8vw,118px)/.91 system-ui;letter-spacing:-.08em;margin:.18em}section{height:38vh;display:flex;align-items:flex-end;justify-content:space-evenly;border-bottom:18px double #8b332d;padding-bottom:30px;overflow:hidden}.bird{width:clamp(65px,16vw,180px);aspect-ratio:1.25;background:radial-gradient(circle at 70% 27%,#211f1e 0 3%,#fce4aa 3.3% 7%,transparent 7.5%),linear-gradient(150deg,#fae4ac,#cfad78);position:relative;border:2px solid #60342c;border-radius:48% 57% 37% 49%;box-shadow:inset 0 -6px #af8768}.bird:before{content:'';position:absolute;left:8%;top:45%;width:55%;height:35%;border-radius:0 0 80% 80%;border:2px solid #823e32;background:repeating-linear-gradient(70deg,#8b332d 0 5px,#cf8368 6px 9px)}.bird:after{content:'';position:absolute;left:95%;top:28%;border:solid transparent;border-width:7px 0 7px 18px;border-left-color:#8b332d}.bird i{position:absolute;height:27px;width:5px;background:#5a4940;top:98%;left:37%;transform-origin:top}.bird i+i{left:61%}.bird i:after{content:'';position:absolute;bottom:0;left:-2px;width:17px;height:4px;background:#5a4940}.run .bird{animation:march .38s ease-in-out 8 alternate}.run i{animation:leg .19s ease-in-out 16 alternate}.run i+i{animation-direction:alternate-reverse}@keyframes leg{from{transform:rotate(-25deg)}to{transform:rotate(28deg)}}@keyframes march{to{transform:translate(6px,-8px) rotate(3deg)}}button{font:bold 18px Georgia;background:#8b332d;color:#fff0c3;border:3px double #fff0c3;padding:12px 24px;margin:3vh}p{margin:0}@media(prefers-reduced-motion:reduce){.run .bird,.run i{animation:none}.run .bird{transform:rotate(-5deg)}}</style><small>CLOCKWORK GOODS · SERIES THREE</small><h1>The Thursday<br>Tin Parade</h1><section aria-label="Three tin birds"><div class="bird"><i></i><i></i></div><div class="bird" style="filter:hue-rotate(38deg);width:clamp(59px,13vw,144px)"><i></i><i></i></div><div class="bird" style="filter:hue-rotate(-22deg);width:clamp(54px,11vw,120px)"><i></i><i></i></div></section><button>Wind the spring ↻</button><p>Three birds. One key. Keep clear of table edges.</p><script>let timer;document.querySelector('button').onclick=()=>{clearTimeout(timer);document.body.classList.remove('run');void document.body.offsetWidth;document.body.classList.add('run');timer=setTimeout(()=>document.body.classList.remove('run'),3100)}</script></html>
