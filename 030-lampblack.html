<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Under the Soot</title><style>*{box-sizing:border-box}body{margin:0;background:#272625;color:#efc97a;font:14px monospace}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}header,footer{position:absolute;left:5%;right:5%;pointer-events:none}header{top:4%;letter-spacing:.15em}footer{bottom:4%;display:flex;align-items:end;justify-content:space-between;gap:12px}h1{font:italic clamp(32px,6vw,78px)/1 Georgia;margin:.1em 0}button{pointer-events:auto;border:1px solid #efc97a;background:#272625;color:inherit;padding:10px;cursor:pointer}aside{display:flex;gap:5px;flex-wrap:wrap}</style><canvas id="gold"></canvas><canvas id="soot" aria-label="Rub the charcoal coating"></canvas><header>ATELIER VESPER　/　INTAGLIO VII</header><footer><section><h1>Under the soot</h1>Rub the plate to find the sun.</section><aside><button id="polish">Polish</button><button id="coat">Recoat</button></aside></footer><script>let g=gold.getContext('2d'),s=soot.getContext('2d'),w,h,n=0;function rub(x,y,r){s.globalCompositeOperation='destination-out';s.beginPath();s.arc(x,y,r,0,7);s.fill()}function cover(){s.globalCompositeOperation='source-over';s.fillStyle='#272625';s.fillRect(0,0,w,h);s.fillStyle='#45423c';for(let i=0;i<8500;i++)s.fillRect(Math.random()*w,Math.random()*h,1,1);for(let i=0;i<100;i++)rub(w*(.18+i*.006),h*(.66-i*.003)+Math.sin(i*.24)*6,Math.min(w,h)*(.035+.075*Math.sin(i/100*Math.PI)**2));n=0}function resize(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio,2);for(let e of [gold,soot]){e.width=w*d;e.height=h*d;e.getContext('2d').setTransform(d,0,0,d,0,0)}g.fillStyle='#352f26';g.fillRect(0,0,w,h);g.strokeStyle='#efc97a';g.lineWidth=.85;let scale=Math.min(w*.46,h*.45);for(let j=0;j<100;j++){g.beginPath();for(let i=0;i<=900;i++){let a=i/900*Math.PI*2,r=scale*(.11+j*.008+.075*Math.cos(a*18+j*.09));g.lineTo(w/2+r*Math.cos(a),h/2+r*Math.sin(a))}g.closePath();g.stroke()}cover()}soot.onpointerdown=e=>{soot.setPointerCapture(e.pointerId);rub(e.clientX,e.clientY,28)};soot.onpointermove=e=>{if(soot.hasPointerCapture(e.pointerId))rub(e.clientX,e.clientY,28)};polish.onclick=()=>{for(let i=0;i<120;i++)rub(w*i/119,h*(.15+(n%12)*.065)+30*Math.sin(i*.035),32);n++};coat.onclick=cover;onresize=resize;resize()</script></html>
