<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>An Hour Under Linen</title><style>*{box-sizing:border-box}body{margin:0;background:#e9cf9d;color:#6d3926}main{width:min(900px,92vw);margin:6vh auto}header{border-bottom:1px solid;padding-bottom:10px;font:12px monospace;letter-spacing:.15em}h1{font:italic clamp(39px,7vw,80px)/1 Georgia;margin:.25em 0}.linen{height:42vh;display:grid;place-items:center;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 3px,#9a79501a 4px),repeating-linear-gradient(90deg,#dfbe91 0 3px,#e8cba0 4px 6px)}.loaf{position:relative;width:min(69%,520px);aspect-ratio:2.25;border-radius:46% 52% 45% 49%;background:radial-gradient(ellipse at 41% 25%,#f2ce8a,#d19a53 42%,#b0743c 67%,#834a28 86%);box-shadow:5px 14px 14px -5px #75482880;transform:rotate(-12deg) scale(var(--scale,.95));overflow:hidden}.cut{position:absolute;top:18%;height:57%;width:var(--cut,7%);transform:skew(-23deg) rotate(9deg);border-radius:75% 12% 85% 13%;background:linear-gradient(90deg,#955e34,#e3b16f 40%,#f6d89e);border-left:2px solid #9b683d}.fleck{position:absolute;border-radius:50%;background:#f7db9770}label{display:flex;gap:15px;align-items:center;margin:20px 0;font:13px monospace}input{accent-color:#6d3926;flex:1}p{font:italic 21px Georgia}input:focus-visible{outline:3px solid}</style><main><header>BAKEHOUSE JOURNAL　 /　 DOUGH 21</header><h1>An hour under linen</h1><div class="linen"><div class="loaf"></div></div><label>PROOF <input type="range" min="0" max="60" value="32"><output>32 min</output></label><p>The cuts have begun to smile.</p></main><script>let l=document.querySelector('.loaf'),s=document.querySelector('input');for(let i=0;i<230;i++){let f=document.createElement('i');f.className='fleck';f.style.cssText='left:'+i*17.93%100+'%;top:'+i*7.31%100+'%;height:'+(1+i%3)+'px;width:'+(2+i%4)+'px';l.append(f)}for(let i=0;i<4;i++){let f=document.createElement('i');f.className='cut';f.style.left=19+i*17+'%';l.append(f)}s.oninput=()=>{l.style.setProperty('--scale',.73+s.value*.006);l.style.setProperty('--cut',(2+s.value*.15)+'%');document.querySelector('output').value=s.value+' min';document.querySelector('p').textContent=s.value<20?'I tuck the seam beneath and wait.':s.value<44?'The cuts have begun to smile.':'The shoulders lift. I dust the peel.'};s.oninput()</script></html>
