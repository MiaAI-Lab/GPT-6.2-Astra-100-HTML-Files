<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Pearl Reckoner</title><style>
*{box-sizing:border-box}body{margin:0;background:#ede2ce;color:#493630;font:16px Georgia,serif}main{width:min(850px,90vw);margin:5vh auto}header,footer{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid;padding:12px 0}small,label{font:11px monospace;letter-spacing:.16em}h1{font:italic clamp(54px,9vw,112px)/.95 Georgia;margin:.32em 0}.board{padding:14px 5%;border:12px ridge #906a51;background:repeating-linear-gradient(88deg,#a98265 0 2px,#b28d70 3px 6px,#be9879 8px 15px);box-shadow:0 18px 22px -16px #493630}.wire{position:relative;height:clamp(48px,8vh,77px);cursor:pointer;background:linear-gradient(transparent 48%,#543f32 49%,#cfbfa0 51%,transparent 53%)}i{position:absolute;top:50%;width:7%;aspect-ratio:1;transform:translateY(-50%);border-radius:48% 56% 44% 51%;background:radial-gradient(ellipse at 33% 25%,white 1%,#f4ece1 18%,#cfaeba 46%,#927782 69%,#ead7c4 85%);box-shadow:2px 4px 4px #62483288;transition:left .65s cubic-bezier(.22,.81,.19,1)}output{font:italic 42px Georgia;color:#824e58}footer{margin-top:18px}p{font-style:italic}:focus-visible{outline:3px solid #824e58}@media(prefers-reduced-motion:reduce){i{transition:none}}
</style><main><header><small>MERE HARBOR　/　CHANDLERY</small><small>NO. 08</small></header><h1>The Pearl Reckoner</h1><p>Five strings for the day's catch.</p><section class="board" aria-label="Pearl counting board"></section><footer><label>GATHER ON THE LEFT</label><output></output></footer><p>Touch a wire or use its arrow keys to reckon the catch.</p></main><script>
let counts=[2,4,1,3,0];const board=document.querySelector('.board');counts.forEach((n,r)=>{let w=document.createElement('div');board.append(w);w.className='wire';w.tabIndex=0;w.role='slider';for(let [k,v] of Object.entries({'aria-label':'Wire '+(r+1),'aria-valuemin':0,'aria-valuemax':8}))w.setAttribute(k,v);for(let i=0;i<8;i++)w.append(document.createElement('i'));function set(v){counts[r]=Math.max(0,Math.min(8,v));w.setAttribute('aria-valuenow',counts[r]);[...w.children].forEach((b,j)=>b.style.left=(j*7.5+(j<counts[r]?0:40))+'%');document.querySelector('output').value=counts.reduce((a,b)=>a+b)+' pearls'}w.onclick=e=>set(Math.round(8*(e.clientX-w.getBoundingClientRect().left)/w.clientWidth));w.onkeydown=e=>{if(['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();set(counts[r]+(e.key==='ArrowRight'?1:-1))}};set(n)})
</script></html>
