<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After the Overture</title><style>body{margin:0;background:radial-gradient(ellipse at 50% 38%,#663446,#442035 65%);color:#e9ab99;font:18px Georgia}main{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}header,footer{padding:3vh 5vw}header{display:flex;align-items:center;justify-content:space-between;font:12px monospace;letter-spacing:.13em}button{color:#f4c7ad;background:none;border:1px solid #a97c79;padding:11px 18px;cursor:pointer;font:14px Georgia}canvas{width:100%;height:45vh;align-self:center;cursor:pointer}h1{font:italic clamp(38px,7vw,94px)/1 Georgia;margin:.1em 0 .25em}footer{border-top:1px solid #966276}</style><main><header><span>FOYER　·　HOUSE CLOSED</span><button id="audioBtn" aria-pressed="false">Sound off</button></header><canvas id="cord" aria-label="A velvet rope between two brass posts"></canvas><footer><h1>After the overture</h1><button id="strike">Pluck the velvet cord</button></footer></main><script>const c=cord.getContext('2d'),calm=matchMedia('(prefers-reduced-motion:reduce)').matches;let audio,on=false,last=-10000,frame=0;function draw(now){let w=cord.clientWidth,h=cord.clientHeight,d=Math.min(2,devicePixelRatio);if(cord.width!==Math.round(w*d)||cord.height!==Math.round(h*d)){cord.width=w*d;cord.height=h*d}c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);let t=(now-last)/1000;for(let x of [w*.1,w*.9]){let brass=c.createLinearGradient(x-9,0,x+9,0);brass.addColorStop(0,'#87623e');brass.addColorStop(.4,'#f6d8a0');brass.addColorStop(1,'#a17851');c.fillStyle=brass;c.fillRect(x-5,h*.29,10,h*.6);c.beginPath();c.arc(x,h*.27,12,0,7);c.fill();c.beginPath();c.ellipse(x,h*.9,24,5,0,0,7);c.fill()}for(let k=0;k<3;k++){c.beginPath();for(let i=0;i<=120;i++){let u=i/120,Y=h*(.34+.34*4*u*(1-u))+(calm?0:h*.19*Math.exp(-t*2)*Math.sin(t*24-u*6)*Math.sin(Math.PI*u));c.lineTo(w*(.1+.8*u),Y-k*2)}c.strokeStyle=['#301823','#8f4253','#d28583'][k];c.lineWidth=[15,11,3][k];c.stroke()}if(t<2.9&&!calm)frame=requestAnimationFrame(draw)}function pluck(){cancelAnimationFrame(frame);last=performance.now();draw(last);if(on){let osc=audio.createOscillator(),gain=audio.createGain();osc.type='triangle';osc.frequency.value=123.47;gain.gain.setValueAtTime(.14,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+1.1);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+1.1)}}audioBtn.onclick=()=>{audio||=new AudioContext();audio.resume();on=!on;audioBtn.textContent=on?'Sound on':'Sound off';audioBtn.setAttribute('aria-pressed',on)};cord.onpointerdown=strike.onclick=pluck;onresize=()=>draw(performance.now());draw(performance.now())</script></html>
