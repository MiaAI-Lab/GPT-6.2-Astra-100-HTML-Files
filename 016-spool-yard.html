<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Winding Room</title><style>*{box-sizing:border-box}body{background:#ffd1a4;color:#632d39;margin:0;text-align:center;font:13px Georgia}main{width:min(840px,94vw);margin:7vh auto}h1{font:italic clamp(45px,8vw,92px)/1 Georgia;margin:.16em}small{letter-spacing:.27em;font-weight:bold}canvas{width:100%;aspect-ratio:1.9;display:block}label{display:flex;align-items:center;justify-content:center;gap:18px;font:13px monospace}input{accent-color:#83354a;width:45%;cursor:ew-resize}input:focus-visible{outline:3px solid}p{font-style:italic}</style><main><small>HOLLIS &amp; DAUGHTER</small><h1>The Winding Room</h1><p>Mercerised cotton, shade sixteen · Mulberry wine</p><canvas aria-label="Mulberry thread wound on a wooden spool"></canvas><label>YARDAGE<input type="range" min="0" max="180" value="136"><output>136 yd</output></label></main><script>let c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('input');function draw(){let d=Math.min(2,devicePixelRatio)*c.clientWidth/760;c.width=760*d;c.height=400*d;g.setTransform(d,0,0,d,c.width/2,c.height/2);g.rotate(-.14);let r=43+75*Math.sqrt(s.value/180);function ellipse(x,a,b,fill){g.beginPath();g.ellipse(x,0,a,b,0,0,7);g.fillStyle=fill;g.fill()}ellipse(-218,38,136,'#996749');g.fillStyle='#cc9462';g.fillRect(-218,-43,436,86);if(+s.value){let grad=g.createLinearGradient(0,-r,0,r);for(let [n,col] of [[0,'#713343'],[.25,'#c36c81'],[.55,'#98465a'],[1,'#622739']])grad.addColorStop(n,col);g.fillStyle=grad;g.fillRect(-216,-r,432,2*r);g.save();g.beginPath();g.rect(-216,-r,432,2*r);g.clip();for(let i=0;i<720;i++){let x=i*131%570-280;g.strokeStyle=i%4?'#541d331f':'#ffe0b850';g.beginPath();g.moveTo(x,-r);g.bezierCurveTo(x+3,-r*.4,x+(i%2?16:-16),r*.4,x+(i%2?44:-44),r);g.stroke()}g.restore()}ellipse(219,38,136,'#935939');ellipse(227,38,136,'#da9e69');for(let i=0;i<14;i++){g.strokeStyle='#945a3e55';g.beginPath();g.ellipse(227,0,4+i*2.2,18+i*8,0,0,7);g.stroke()}ellipse(227,0+8,24,'#69442f');document.querySelector('output').value=s.value+' yd'}s.oninput=draw;onresize=draw;draw()</script></html>
