<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Hidden Colours of Ink</title><style>*{box-sizing:border-box}body{min-height:100svh;margin:0;display:flex;justify-content:center;align-items:center;gap:6vw;padding:5vw;background:#e6dbc9;color:#4d4266}article{max-width:23em}small,label{font:13px monospace;letter-spacing:.08em}h1{font:normal clamp(36px,6vw,86px)/.95 Georgia;letter-spacing:-.06em;margin:.3em 0}p{font:italic 20px/1.4 Georgia}canvas{width:clamp(130px,26vw,300px);height:68vh;background:#f7efdf;box-shadow:4px 6px 10px #58493135}input{display:block;width:100%;accent-color:#4d4266;margin-top:1em}@media(max-width:600px){body{gap:4vw}article{width:49vw}canvas{width:35vw}p{font-size:17px}}</style><article><small>NIB HOUSE / ASSAY 06</small><h1>Widow<br><i>Violet.</i></h1><p>A black line in the bottle. Three different travellers on the paper.</p><label>WATER FRONT<input type="range" min="0" max="100" value="68"></label></article><canvas aria-label="Absorbent paper showing three separated pigments"></canvas><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),slider=document.querySelector('input');function paint(){let w=c.clientWidth,h=c.clientHeight,d=Math.min(devicePixelRatio,2);c.width=w*d;c.height=h*d;g.scale(d,d);let seed=83;function rand(){seed=seed*16807%2147483647;return seed/2147483647}let v=slider.value/100;for(let k=0;k<3;k++){g.fillStyle=['#82663535','#34787838','#4d426653'][k];for(let j=0;j<11500;j++){let u=rand(),x=(rand()+rand()+rand()-1.5)*w*.28,y=(rand()+rand()-1)*h*(.03+v*.06);g.fillRect(w*.5+x,h*(.86-v*[.79,.52,.28][k])+y+Math.sin(x*.11)*h*.008,1.5+u*2,1+u*2)}}g.strokeStyle='#695b57';g.font='10px monospace';for(let n=0;n<11;n++){let y=h*(.86-n*.075);g.fillRect(0,y,8,1);g.fillStyle='#77695a';g.fillText(n,10,y+3)}g.setLineDash([3,5]);g.beginPath();g.moveTo(w*.15,h*(.86-v*.84));g.lineTo(w*.9,h*(.86-v*.84));g.stroke()}slider.oninput=onresize=paint;paint()</script></html>
