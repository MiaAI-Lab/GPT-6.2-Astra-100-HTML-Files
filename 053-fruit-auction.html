<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Single Pear Sale</title><style>*{box-sizing:border-box}body{margin:0;padding:3vh 6vw;background:#f1eba8;color:#393b20;text-align:center;font-family:Times,serif}header{border-block:4px double;padding:.7em;letter-spacing:.23em;font-size:12px}h1{font-size:clamp(35px,6vw,84px);font-weight:400;letter-spacing:-.06em;margin:.25em}figure{margin:auto;position:relative;width:210px;height:235px}.specimen{width:100%;height:100%;display:block}mark{position:absolute;top:48%;left:14%;font:bold 42px system-ui;transform:rotate(-15deg);border:4px solid;padding:0 .3em;background:#f1eba8;color:#973d32}h2{font:italic clamp(26px,4vw,49px) Georgia;margin:8px}p{font-size:18px}button{background:#404427;color:#f1eba8;border:0;padding:13px 24px;font:bold 16px Georgia}footer{margin:2em auto;border-top:1px solid;padding:1em;max-width:600px;font:12px monospace}</style><header>ROCHE &amp; PIT · AUCTIONEERS</header><h1>The Single Pear Sale</h1><figure><svg class="specimen" viewBox="0 0 220 240" role="img" aria-label="Catalogue drawing of a russet pear"><defs><radialGradient id="skin" cx=".33" cy=".35" r=".78"><stop stop-color="#dad581"/><stop offset=".53" stop-color="#b7b355"/><stop offset=".83" stop-color="#93913e"/><stop offset="1" stop-color="#777235"/></radialGradient><path id="outline" d="M110 47C90 45 88 63 85 83C80 108 62 114 47 139C27 171 32 204 58 217C74 226 92 230 108 226C129 230 154 219 168 204C190 179 177 144 155 124C138 109 130 94 129 72C127 57 123 49 110 47Z"/><clipPath id="fruitmask"><use href="#outline"/></clipPath><pattern id="hatch" width="6" height="7" patternUnits="userSpaceOnUse"><path d="M1 1l2 2" stroke="#634a22" opacity=".36" stroke-width=".8"/></pattern></defs><ellipse cx="113" cy="227" rx="53" ry="3" fill="#bcb671"/><g transform="rotate(8 112 135)"><path d="M110 51Q100 25 114 12" stroke="#573e26" stroke-width="6" fill="none"/><path d="M111 34Q137 4 163 17Q139 41 111 34Z" fill="#606935"/><path d="m114 32 42-14" stroke="#9eaa65"/><use href="#outline" fill="url(#skin)" stroke="#716329"/><use href="#outline" fill="url(#hatch)"/><g id="pores" clip-path="url(#fruitmask)"></g></g></svg><mark hidden>SOLD</mark></figure><small id="lot">LOT 001</small><h2>The Ambassador</h2><p id="note">Travelled first class in its own velvet sock.</p><button>Bid 15 francs</button><footer>Buyer collects before the fruit gives way.</footer><script>let grain=21;function random(){grain=grain*16807%2147483647;return grain/2147483647}for(let k=0;k<850;k++){let x=35+145*random(),y=43+185*random();pores.insertAdjacentHTML('beforeend','<circle cx="'+x+'" cy="'+y+'" r="'+(.25+random()*.72)+'" fill="'+(k%4?'#76682f':'#eee3a1')+'" opacity=".55"/>')}let n=0,b=0;const fruit=[['The Ambassador','Travelled first class in its own velvet sock.'],['Little Duchess','From a tree that leans over two estates.'],['Monsieur Pluie','Picked in the rain by a retired tenor.']],button=document.querySelector('button'),stamp=document.querySelector('mark');button.onclick=()=>{if(b===3){b=0;n++;stamp.hidden=true;lot.textContent='LOT '+String(n+1).padStart(3,'0');document.querySelector('h2').textContent=fruit[n%3][0];note.textContent=fruit[n%3][1];document.querySelector('.specimen').style.filter='hue-rotate('+n*12+'deg)'}else b++;if(b===3){stamp.hidden=false;note.textContent='Hammer price · 25 francs'}button.textContent=b===3?'Open next lot →':'Bid '+(15+5*b)+' francs'}</script></html>
