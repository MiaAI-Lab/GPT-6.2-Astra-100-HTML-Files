<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office of Unusual Parcels</title><style>*{box-sizing:border-box}body{margin:0;background:#a53741;color:#3c312b;font:14px monospace}main{margin:6vh auto;width:min(780px,90vw)}article{position:relative;overflow:hidden;background:repeating-linear-gradient(#f0dcc2 0 30px,#dfc8aa 31px);padding:6%;min-height:58vh;cursor:crosshair;box-shadow:5px 6px #762d33}header{border-block:3px double;padding:10px 0}h1{font:bold clamp(44px,8vw,95px)/.92 Georgia;letter-spacing:-.065em;max-width:12ch}b{display:block}.seal{position:absolute;transform:translate(-50%,-50%) rotate(-13deg);border:5px double #a53741;border-radius:50%;color:#a53741;padding:16px 11px;font:bold 20px monospace;pointer-events:none;animation:land .23s ease-out;background:#f0dcc244}@keyframes land{from{scale:1.4;opacity:.15}}button{margin-top:20px;background:#f0dcc2;border:0;padding:12px 16px;cursor:pointer;font:inherit}button:focus-visible,article:focus-visible{outline:4px solid white}aside{color:#fff1db;margin-top:14px}@media(prefers-reduced-motion:reduce){.seal{animation:none}}</style><main><article tabindex="0" role="button" aria-label="Admit this parcel"><header>O.U.P.　 /　 OFFICE OF UNUSUAL PARCELS</header><p>DECLARATION OF CONTENTS</p><h1>A jar of distant thunder.</h1><b>ORIGIN　 /　 EASTERN RIDGE</b><p>Glass upright. Open after rain.</p></article><aside>Strike the docket to admit the goods.</aside><button>Next consignment →</button></main><script>let p=document.querySelector('article'),i=0,items=[['A jar of distant thunder.','EASTERN RIDGE','Glass upright. Open after rain.'],['Three borrowed shadows.','NOON MARKET','Keep flat. Return by sundown.'],['One spare Thursday.','CALENDAR WORKS','Perishable after midnight.']];function stamp(x,y){let s=document.createElement('span');s.className='seal';s.textContent='ADMITTED';s.style.left=x+'px';s.style.top=y+'px';p.append(s);if(p.querySelectorAll('.seal').length>12)p.querySelector('.seal').remove()}p.onclick=e=>{let r=p.getBoundingClientRect();stamp(e.clientX-r.left,e.clientY-r.top)};p.onkeydown=e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();stamp(p.clientWidth*.62,p.clientHeight*.55)}};document.querySelector('button').onclick=()=>{i=(i+1)%3;p.querySelectorAll('.seal').forEach(s=>s.remove());p.querySelector('h1').textContent=items[i][0];p.querySelector('b').textContent='ORIGIN　 /　 '+items[i][1];p.lastElementChild.textContent=items[i][2]}</script></html>
