<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amber Fold</title><style>*{box-sizing:border-box}body{margin:0;background:#302935;color:#f2d7b7}main{position:relative;min-height:100svh;overflow:hidden}#disc{position:absolute;left:50%;top:48%;translate:-50% -50%;width:min(65vh,75vw);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(ellipse at 25% 40%,#302935 0 10%,#dfa872 11%,#786050 13%,#302935 17%)}canvas{position:absolute;inset:0;width:100%;height:100%}header,footer{position:absolute;left:5vw;right:5vw}header{top:4vh}small,label{font:12px monospace;letter-spacing:.16em}h1{font:italic clamp(39px,6vw,82px)/1 Georgia;margin:.15em 0}footer{bottom:5vh;display:flex;align-items:center;gap:20px}input{width:min(48vw,320px);accent-color:#dfa872}</style><main><div id="disc"></div><canvas id="glass" aria-label="Caustic light in smoked glass"></canvas><header><small>OPTICAL CAST　·　AMBER SERIES</small><h1>Amber Fold</h1></header><footer><label for="angle">LENS ANGLE</label><input id="angle" type="range" min="0" max="360" value="40"></footer></main><script>let gl=glass.getContext('webgl',{alpha:false}),program;if(gl){let vert='attribute vec2 pt;void main(){gl_Position=vec4(pt,0.,1.);}',frag='precision mediump float;uniform vec2 res;uniform float turn;void main(){vec2 p=(2.*gl_FragCoord.xy-res)/min(res.x,res.y);float r=length(p),a=atan(p.y,p.x)+turn;vec3 bg=vec3(.15,.125,.16);float mask=1.-smoothstep(.72,.73,r);float waves=sin(r*29.+4.*sin(3.*a+r*8.)+2.*cos(2.*a-r*7.));float shine=pow(.5+.5*waves,10.)*(.32+.68*abs(sin(a+2.*r)));vec3 amber=vec3(.93,.67,.39);vec3 lens=vec3(.22,.16,.17)+amber*shine+.18*amber*pow(.5+.5*cos(4.*a+17.*r),4.);lens+=amber*.75*exp(-180.*abs(r-.712));gl_FragColor=vec4(mix(bg,lens,mask),1.);}';program=gl.createProgram();for(let [type,src] of [[gl.VERTEX_SHADER,vert],[gl.FRAGMENT_SHADER,frag]]){let sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);gl.attachShader(program,sh)}gl.linkProgram(program);if(gl.getProgramParameter(program,gl.LINK_STATUS)){gl.useProgram(program);let buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let pt=gl.getAttribLocation(program,'pt');gl.enableVertexAttribArray(pt);gl.vertexAttribPointer(pt,2,gl.FLOAT,false,0,0)}else gl=null}function render(){if(!gl){glass.hidden=true;disc.style.rotate=angle.value+'deg';return}let d=Math.min(devicePixelRatio,2);glass.width=innerWidth*d;glass.height=glass.clientHeight*d;gl.viewport(0,0,glass.width,glass.height);gl.uniform2f(gl.getUniformLocation(program,'res'),glass.width,glass.height);gl.uniform1f(gl.getUniformLocation(program,'turn'),angle.value*Math.PI/180);gl.drawArrays(gl.TRIANGLES,0,3)}angle.oninput=onresize=render;render()</script></html>
