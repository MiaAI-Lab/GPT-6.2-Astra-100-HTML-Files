<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Grammar of Drizzle</title><style>*{box-sizing:border-box}body{margin:0;background:#dedced;color:#423557}section{position:relative;height:50vh;overflow:hidden;border-bottom:1px solid #42355755}i{position:absolute;top:-12%;left:var(--x);font:italic var(--s) Georgia;animation:fall var(--t) linear var(--d) infinite}.still i{animation:none;top:var(--row);left:var(--col)}@keyframes fall{to{top:105%;transform:translateX(-24px) rotate(18deg)}}main{width:min(680px,88vw);margin:4vh auto}h1{font:italic clamp(32px,6vw,75px)/1 Georgia;margin:.28em 0}p{font:20px/1.55 Georgia}small,button{font:11px monospace;letter-spacing:.1em}button{background:transparent;color:inherit;border:0;border-bottom:1px solid;padding:8px 0;cursor:pointer}button:focus-visible{outline:3px solid}@media(prefers-reduced-motion:reduce){i{animation:none;top:var(--row)}}</style><section aria-hidden="true"></section><main><small>WEATHER VERSES　 /　 XIV</small><h1>A Grammar of Drizzle</h1><p>The roof keeps count in commas.<br>One full stop slips through the eaves.</p><button>Gather the punctuation</button></main><script>let s=document.querySelector('section');for(let j=0;j<60;j++){let i=document.createElement('i');i.textContent=',:;·’'[j%5];for(let [k,v] of Object.entries({x:(j*31.7%100)+'%',s:(16+j%6*5)+'px',t:(3+j%8*.7)+'s',d:-(j*1.81%7)+'s',row:(24+Math.floor(j/20)*19)+'%',col:(9+(j%20)*4.2)+'%'}))i.style.setProperty('--'+k,v);s.append(i)}document.querySelector('button').onclick=e=>e.target.textContent=s.classList.toggle('still')?'Release the shower':'Gather the punctuation'</script></html>
