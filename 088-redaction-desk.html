<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supper Under Seal</title><style>*{box-sizing:border-box}body{background:#e3d3ba;color:#322f2d;margin:0;font:18px Georgia}main{width:min(89vw,920px);margin:5vh auto;border-block:6px double;padding:2vh 0}header{display:flex;justify-content:space-between;align-items:center}small,b{font:bold 12px monospace;letter-spacing:.1em}b{border:3px double #93473a;padding:7px;color:#93473a;transform:rotate(-9deg)}h1{font:italic clamp(47px,9vw,115px)/.94 Georgia;letter-spacing:-.06em;margin:.4em 0}section{display:grid;grid-template-columns:minmax(58px,18%) 1fr;align-items:center;border-top:1px solid #998c7a;padding:13px 0}button{position:relative;overflow:hidden;width:fit-content;text-align:left;font:italic clamp(19px,3vw,37px) Georgia;color:inherit;background:none;border:0;padding:4px 5px;cursor:pointer}button:after{content:'';position:absolute;inset:2px 0;background:repeating-linear-gradient(1deg,#322f2d 0 3px,#393530 4px 5px);transform:skew(-3deg);transition:transform .5s cubic-bezier(.6,.02,.13,1)}button[aria-pressed=true]:after{transform:translateX(104%) skew(16deg)}button:focus-visible{outline:3px solid #93473a}footer{font:italic 16px Georgia;padding:1em 0}@media(prefers-reduced-motion:reduce){button:after{transition:none}}</style><main><header><small>DINING ARCHIVE / FILE 19</small><b>DECLASSIFIED</b></header><h1>Supper under seal.</h1><section><small>I / COLD</small><button aria-label="Reveal or seal cold course">Pearls of pickled mustard</button></section><section><small>II / BROTH</small><button aria-label="Reveal or seal broth course">Black leek consommé</button></section><section><small>III / ROAST</small><button aria-label="Reveal or seal roast course">Quince under a salt crust</button></section><section><small>IV / SWEET</small><button aria-label="Reveal or seal sweet course">Burnt honey, stolen cream</button></section><footer>Release each course by lifting its seal.</footer></main><script>document.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',false);b.onclick=()=>{let show=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',show);if(show)b.setAttribute('aria-label',b.textContent+'. Seal again')}})</script></html>
