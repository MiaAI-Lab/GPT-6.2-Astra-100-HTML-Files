<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rooms Behind Brick</title><style>*{box-sizing:border-box}body{margin:0;background:#e6d6bc;color:#613c35;font-family:Georgia}header,aside{max-width:980px;margin:auto;padding:2vh 5vw}h1{font:normal clamp(33px,6vw,77px) Georgia;margin:.15em 0}small{font:12px monospace;letter-spacing:.12em}main{border-block:13px ridge #9d806d;background:repeating-linear-gradient(0deg,transparent 0 13px,#c2917d 14px 15px),repeating-linear-gradient(90deg,#d9a68a 0 40px,#c2917d 40px 42px);padding:3vh max(7vw,calc((100vw - 760px)/2));display:grid;grid-template-columns:repeat(4,1fr);gap:3vh 5vw}main>*{height:clamp(60px,12vh,115px);border:6px ridge #b29278;border-bottom:9px outset #c5ac8f;box-shadow:2px 4px 0 #906b59;background:linear-gradient(90deg,transparent 46%,#ddd1b6 47% 52%,transparent 53%),linear-gradient(0deg,transparent 49%,#d9cbb2 50% 55%,transparent 56%),linear-gradient(130deg,#677477,#3c403b)}button{cursor:pointer;color:#402d28;font:bold 18px Georgia;background:repeating-linear-gradient(0deg,#c78e77 0 8px,#e3bca2 9px 11px)}button.open{background:#f3cd85;box-shadow:inset 7px 0 #8b6c49}aside p{font:italic clamp(20px,3.2vw,34px) Georgia;margin:.4em 0}button:focus-visible{outline:4px solid #242922}</style><header><small>IMAGINED ADDRESSES / BRACKEN QUAY</small><h1>Rooms behind brick.</h1></header><main aria-label="House facade"><i></i><button aria-label="Open window A">A</button><i></i><i></i><i></i><i></i><i></i><button aria-label="Open window B">B</button><button aria-label="Open window C">C</button><i></i><i></i><i></i></main><aside><small id="room">HOUSE RECORD / THREE SEALED WINDOWS</small><p id="voice" aria-live="polite">Choose a bricked window to hear who lived behind it.</p></aside><script>document.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('open'));b.classList.add('open');room.textContent=['ATTIC / M. DENN','LANDING / KIT WYE','FRONT ROOM / A. VELL'][i];voice.textContent=['“We dried the washing over the map. By morning the whole coast smelt of soap.”','“The third stair sang F sharp. I always knew when my sister was home.”','“An hour of sun used to reach the piano. I played until it left the keys.”'][i]})</script></html>
