<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sounding No. 9</title><style>body{margin:0;background:#282e36;color:#c3b88d;display:grid;place-items:center;min-height:100svh;font:15px monospace}header{position:absolute;top:5vh;left:4vw;writing-mode:vertical-rl;letter-spacing:.2em}canvas{width:min(78vw,69vh);height:min(78vw,69vh)}footer{position:absolute;bottom:4vh;text-align:center}button{background:#c3b88d;color:#282e36;border:0;padding:12px 28px;font:bold 17px monospace}</style><header>SOUNDING No. 9</header><canvas aria-label="Deep circular brick well"></canvas><footer><button>Drop the stone ↓</button><p id="report" aria-live="polite">Stone suspended · line dry</p></footer><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),btn=document.querySelector('button');let w;function frame(t){g.clearRect(0,0,w,w);g.save();g.translate(w/2,w/2);g.fillStyle='#131820';g.beginPath();g.arc(0,0,w*.49,0,7);g.fill();for(let j=0;j<22;j++){let r=w*.49*.885**j,inner=r*.885;for(let i=0;i<24;i++){let a=(i+j*.5)*Math.PI/12,b=a+Math.PI/12-.016;g.beginPath();g.arc(0,0,r,a,b);g.arc(0,0,inner+1,b,a,true);g.closePath();let l=(.5+.5*Math.cos(a+2))*(1-j/23);g.fillStyle='rgb('+(44+l*114)+','+(48+l*104)+','+(53+l*75)+')';g.fill()}}if(t<1){g.fillStyle='#dfc77e';g.beginPath();g.ellipse(0,0,w*(.028*(1-t)+.001),w*(.021*(1-t)+.001),.7,0,7);g.fill()}else if(t<2){g.strokeStyle='#ded7ac';g.globalAlpha=2-t;g.beginPath();g.arc(0,0,w*.045*(t-1)+1,0,7);g.stroke()}g.restore()}function size(){w=c.clientWidth;let d=Math.min(devicePixelRatio,2);c.width=c.height=w*d;g.setTransform(d,0,0,d,0,0);frame(0)}onresize=size;size();btn.onclick=()=>{btn.disabled=true;let start=performance.now();report.textContent='Stone released · listening';function tick(now){let t=(now-start)/1100;frame(matchMedia('(prefers-reduced-motion: reduce)').matches?Math.floor(t):t);if(t<2)requestAnimationFrame(tick);else{report.textContent='Surface found · fictional depth 18 fathoms';btn.disabled=false;frame(0)}}requestAnimationFrame(tick)}</script></html>
