<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Estuary at Low Water</title><style>*{box-sizing:border-box}body{margin:0;background:#ddd6aa;color:#263d3d;font:14px monospace}header,footer{padding:18px 4vw;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font:italic clamp(28px,4vw,54px) Georgia;margin:0}figure{margin:0 3vw;position:relative;border:5px double}canvas{width:100%;height:58vh;display:block}figcaption{position:absolute;bottom:12%;left:8%;font:italic 21px Georgia;background:#eee5bdde;padding:4px 10px}label{display:flex;gap:12px;align-items:center}input{accent-color:#376f75;width:min(40vw,320px)}</style><header><h1>Bracken Reach</h1><span>MODEL ESTUARY / SHEET II</span></header><figure><canvas id="chart"></canvas><figcaption>The Silt Narrows</figcaption></figure><footer><label>TIDE <input id="tide" type="range" min="-50" max="65" value="-4"><output id="heightOut"></output></label><span>↑ N　 0 ━━━ 2 km</span></footer><script>let c=chart.getContext('2d'),field,img;function size(){let d=Math.min(1.5,devicePixelRatio,1000/chart.clientWidth),w=chart.width=Math.round(chart.clientWidth*d),h=chart.height=Math.round(chart.clientHeight*d);img=c.createImageData(w,h);field=new Float32Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let u=x/w*8,v=y/h*5;field[y*w+x]=Math.sin(u+v*.75)+.53*Math.cos(v*2.9-u*.8)+.38*Math.sin(u*2.7+v*1.5)+.15*Math.sin(v*6+u*.6)}paint()}function paint(){let level=+tide.value/100;for(let i=0;i<field.length;i++){let z=field[i]-level,water=z<0,band=Math.abs(z*5)%1<.09,n=(i*13%11)*.45,p=water?[55,111,117]:[221,214,170],f=water?Math.max(.65,1+z*.18):1-Math.min(.25,z*.06);for(let j=0;j<3;j++)img.data[i*4+j]=p[j]*f+n+(band?(water?24:-35):0);img.data[i*4+3]=255}c.putImageData(img,0,0);heightOut.value=(level*4).toFixed(2)+' m'}onresize=size;tide.oninput=paint;size()</script></html>
