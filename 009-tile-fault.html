<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fault in the Bath</title><style>*{box-sizing:border-box}body{margin:0;background:#e6cbe4;color:#362c5d;display:grid;place-items:center;min-height:100svh}main{width:min(62vh,85vw);margin:20px}article{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#efe2cf;padding:6px;box-shadow:4px 6px 0 #b9a3ac}button{aspect-ratio:1;overflow:hidden;border:1px solid #bba4bf;background:#cdb6d3;padding:0;cursor:pointer}i{display:block;width:100%;height:100%;background-image:repeating-radial-gradient(circle at 43% 57%,#4b3985 0 9px,#eaddcb 10px 13px,#a99acb 14px 24px,#4b3985 25px 28px,#e6cbe4 29px 41px);background-size:300% 300%;transition:transform .45s cubic-bezier(.26,.83,.32,1)}h1{font:italic clamp(30px,5vw,58px) Georgia;margin:.35em 0}aside{border-top:1px solid;padding-top:12px;display:flex;justify-content:space-between;font:12px monospace}small{display:block;letter-spacing:.15em;font:11px monospace;margin-bottom:12px}button:focus-visible{outline:4px solid #e65825;outline-offset:-5px;position:relative;z-index:1}@media(prefers-reduced-motion:reduce){i{transition:none}}</style><main><small>CONSERVATION ROOM　 /　 CERAMIC IX</small><article></article><h1>Fault in the Bath</h1><aside><span>Turn tiles to mend the rings.</span><output>8 / 9</output></aside></main><script>let vals=Array(9).fill(0);vals[5]=1;vals.forEach((v,i)=>{let b=document.createElement('button'),k=document.createElement('i');document.querySelector('article').append(b);b.append(k);b.ariaLabel='Rotate tile '+(i+1);k.style.backgroundPosition=(i%3*50)+'% '+Math.floor(i/3)*50+'%';function paint(){k.style.transform='rotate('+vals[i]*90+'deg)';let n=vals.filter(x=>!(x%4)).length;document.querySelector('output').value=n===9?'IN REGISTER':n+' / 9'}b.onclick=()=>{vals[i]++;paint()};paint()})</script></html>
