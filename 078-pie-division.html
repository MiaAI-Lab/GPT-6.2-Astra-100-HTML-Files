<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fair Portions</title><style>*{box-sizing:border-box}body{margin:0;background:#eed4aa;color:#653322;text-align:center;font:18px Georgia}main{margin:2vh auto;width:min(94%,850px);border-block:4px double #924b30;padding:15px 0}h1{font:italic clamp(48px,8vw,98px)/1 Georgia;margin:.15em}small{font:bold 12px monospace;letter-spacing:.17em}svg{width:min(85vw,53vh);display:block;margin:1em auto}button{border:1px solid;color:inherit;background:transparent;font:26px Georgia;width:46px;height:46px;cursor:pointer}output{display:inline-block;min-width:135px}p{margin:.8em}button:disabled{opacity:.35}</style><main><small>THE ROUND TABLE BAKERY</small><h1>Fair Portions</h1><i>Sour cherry, brown sugar &amp; a pinch of salt.</i><svg viewBox="-145 -145 290 290" aria-label="Cherry pie separated into equal wedges"><defs><pattern id="strips" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="30" height="30" fill="#973e3b"/><circle cx="21" cy="20" r="6" fill="#752d36"/><path d="M0 5h30M6 0v30" stroke="#9b5834" stroke-width="10"/><path d="M0 3h30M4 0v30" stroke="#ecaf66" stroke-width="7"/></pattern><g id="pie"><circle r="108" fill="#bc783f"/><circle r="100" fill="url(#strips)" stroke="#f4bb71" stroke-width="8"/><circle r="106" fill="none" stroke="#e3a05c" stroke-width="7" stroke-dasharray="4 4"/></g></defs><g id="slices"></g></svg><button id="less" aria-label="Remove one guest">−</button><output id="guests"></output><button id="more" aria-label="Add one guest">+</button><p id="share"></p></main><script>let n=4;function serve(){slices.innerHTML='';for(let i=0;i<n;i++){let a=i*2*Math.PI/n,b=(i+1)*2*Math.PI/n,m=(a+b)/2;slices.innerHTML+='<defs><clipPath id="p'+i+'"><path d="M0 0L'+130*Math.cos(a)+' '+130*Math.sin(a)+'A130 130 0 0 1 '+130*Math.cos(b)+' '+130*Math.sin(b)+'Z"/></clipPath></defs><g transform="translate('+12*Math.cos(m)+' '+12*Math.sin(m)+')" clip-path="url(#p'+i+')"><use href="#pie"/></g>'}guests.textContent=n+' at supper';share.textContent='Each place receives 1 / '+n+' of the pie.';less.disabled=n===2;more.disabled=n===8}less.onclick=()=>{n--;serve()};more.onclick=()=>{n++;serve()};serve()</script></html>
