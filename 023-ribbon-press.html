<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loose Register</title><style>*{box-sizing:border-box}body{margin:0;background:#ffd8d0;color:#263859}main{width:min(920px,94vw);margin:4vh auto;display:grid;grid-template-columns:auto 1fr;gap:12px}h1{writing-mode:vertical-rl;transform:rotate(180deg);font:900 clamp(36px,7vw,85px)/.92 Arial;letter-spacing:-.07em;margin:0}svg{width:100%;height:67vh;border:1px solid;background:#ffddd2}label{grid-column:2;display:flex;gap:10px;align-items:center;font:12px monospace}input{accent-color:#255cad;flex:1;min-width:0}output{min-width:4ch}input:focus-visible{outline:3px solid}</style><main><h1>Loose Register</h1><svg viewBox="0 0 480 500" aria-label="Overlapping serpentine press ribbons"><defs><path id="loop" d="M-35 425C110 434 421 221 379 117S97 83 106 204s294 176 347 -3S256 14 211 122s70 236 310 243"/></defs><g fill="none"><use href="#loop" stroke="#255cad" stroke-width="47"/><use href="#loop" stroke="#ffd8d0" stroke-width="2"/><g id="plate" style="mix-blend-mode:multiply" transform="translate(0 58)"><use href="#loop" stroke="#ee6243" stroke-width="42"/><use href="#loop" stroke="#ffd8d0" stroke-width="2"/></g></g><path d="M9 20h20m-10 -10v20M451 480h20m-10 -10v20" stroke="#263859"/><text x="24" y="482" font-family="monospace" font-size="10" fill="#263859">TWIN PLATE STUDY　/　PULL XXIII</text></svg><label>PLATE B<input type="range" min="-95" max="95" value="0"><output>0 mm</output></label></main><script>document.querySelector('input').oninput=e=>{plate.setAttribute('transform','translate('+e.target.value+' 58)');document.querySelector('output').value=e.target.value+' mm'}</script></html>
