<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Violet Sugar Works</title><style>*{box-sizing:border-box}body{margin:0;background:#edc5e2;color:#6e4181;font:17px Georgia}main{min-height:100svh;display:flex;align-items:center;justify-content:center;gap:6vw;padding:5vw}canvas{width:min(45vw,400px);height:69vh}article{max-width:350px}h1{font:bold italic clamp(38px,7vw,95px)/.92 Georgia;letter-spacing:-.06em;margin:.3em 0}small{font:12px monospace;letter-spacing:.14em}p{line-height:1.5}button{font:italic 20px Georgia;border:2px solid;background:#fcdfed;color:inherit;padding:12px 20px;cursor:pointer}output{display:block;margin:16px 0;font:12px monospace}@media(max-width:560px){main{display:block;text-align:center}canvas{height:47vh;width:75vw}article{margin:auto}}</style><main><canvas id="tank"></canvas><article><small>CONFECTIONER'S BENCH</small><h1>Violet sugar works</h1><p>The first grain gives the syrup somewhere to begin. Leave room for the last one.</p><button id="seed">Seed the syrup</button><output id="batch"></output></article></main><script>let growth=3;function draw(){let w=tank.clientWidth,h=tank.clientHeight,d=Math.min(2,devicePixelRatio),c=tank.getContext('2d');tank.width=w*d;tank.height=h*d;c.scale(w*d/300,h*d/450);c.fillStyle='#fff4f47a';c.strokeStyle='#b88fb7';c.lineWidth=3;c.beginPath();c.roundRect(25,48,250,380,30);c.fill();c.stroke();c.fillStyle='#c89ece75';c.fillRect(34,125,232,278);c.fillStyle='#bc8159';c.fillRect(145,8,9,374);function poly(points,color){c.fillStyle=color;c.beginPath();for(let [x,y] of points)c.lineTo(x,y);c.closePath();c.fill()}for(let i=0;i<growth*22;i++){let y=360-(i/(growth*22))*growth*34,x=150+Math.sin(i*7.3)*Math.cos(i*1.4)*44,r=7+8*Math.abs(Math.sin(i*4.2)),v=r*1.4;poly([[x,y-v],[x+r,y-r*.35],[x,y+r*.1],[x-r,y-r*.35]],'#f3d8ee');poly([[x-r,y-r*.35],[x,y+r*.1],[x,y+v],[x-r,y+r*.4]],'#9666a9');poly([[x+r,y-r*.35],[x,y+r*.1],[x,y+v],[x+r,y+r*.4]],'#bf8fc6')}batch.value='GROWTH PASS / 0'+growth;seed.textContent=growth===7?'Harvest skewer':'Seed the syrup'}seed.onclick=()=>{growth=growth===7?0:growth+1;draw()};onresize=draw;draw()</script></html>
