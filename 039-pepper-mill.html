<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three Turns of Pepper</title><style>*{box-sizing:border-box}body{margin:0;background:#f1b49a;color:#3e2823;font:17px Georgia}main{min-height:100svh;display:flex;align-items:center;justify-content:center;gap:9vw;padding:25px}article{width:min(36vw,350px)}h1{font:italic clamp(41px,6.7vw,95px)/.96 Georgia;margin:.35em 0}small{font:12px monospace;letter-spacing:.15em}.mill{position:relative;width:min(34vw,235px);height:55vh;max-height:430px;display:flex;align-items:center;flex-direction:column}.mill i,.mill b,.mill em{background:linear-gradient(90deg,#3e2823,#92583c 29%,#ac7351 39%,#69402d 66%,#37221d);display:block}.mill:before{content:'';width:14%;height:4%;background:#a48555;border-radius:40%}.mill b{width:62%;height:28%;border-radius:49% 49% 38% 38%}.mill i{width:50%;height:9%;border-radius:42%;border-block:4px double #412922}.mill em{width:76%;height:53%;clip-path:polygon(24% 0,76% 0,68% 24%,69% 43%,81% 75%,97% 88%,100% 100%,0 100%,3% 88%,19% 75%,31% 43%,32% 24%)}.plate{position:absolute;bottom:-10%;width:125%;height:13%;border-radius:50%;background:#f2dfbc;box-shadow:0 5px #bc927d,inset 0 0 0 7px #fff0d3}.plate span{position:absolute;width:3px;height:3px;background:#3e2823;border-radius:40%}button{background:#3e2823;color:#f1d9c4;border:0;padding:14px 16px;font:inherit;cursor:pointer}output{display:block;margin:18px 0;font:13px monospace}@media(max-width:550px){main{gap:8vw}.mill{height:330px}article{width:45vw}}</style><main><div class="mill"><b id="topper"></b><i></i><em></em><div class="plate" id="plate"></div></div><article><small>MAISON POIVRE</small><h1>Three turns.</h1><p>One for the nose, one for the tongue, one for the road.</p><output id="order">ORDER 01 / BARE PLATE</output><button id="grind">Grind a turn</button></article></main><script>let n=0;grind.onclick=()=>{if(n===3){n=0;plate.replaceChildren()}else{n++;for(let k=0;k<36;k++){let s=document.createElement('span');s.style.left=(18+Math.random()*64)+'%';s.style.top=(32+Math.random()*40)+'%';plate.append(s);if(!matchMedia('(prefers-reduced-motion:reduce)').matches)s.animate([{transform:'translateY(-45px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:300+k*5,easing:'ease-in'})}if(!matchMedia('(prefers-reduced-motion:reduce)').matches)topper.animate([{transform:'skewX(0)'},{transform:'skewX(8deg)'},{transform:'skewX(0)'}],350)}order.value=['ORDER 01 / BARE PLATE','TURN 01 / FLORAL','TURN 02 / WARM','TURN 03 / HOUSE BLEND'][n];grind.textContent=n===3?'Clear the plate':'Grind a turn'}</script></html>
