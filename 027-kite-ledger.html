<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>East of the Dunes</title><style>*{box-sizing:border-box}body{margin:0;background:#a8e3e2;color:#203c3e;font:14px monospace}canvas{display:block;width:100%;height:68vh}header{position:absolute;top:5%;left:6%;font-size:12px;letter-spacing:.15em}strong{display:block;font:900 clamp(48px,9vw,115px) Arial;color:#9b382d}footer{border-top:3px solid;background:#f4eaca;padding:22px 6vw;min-height:32vh;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{font:italic clamp(32px,5vw,68px) Georgia;margin:0}input{display:block;accent-color:#9b382d;width:min(240px,78vw);margin-top:12px}</style><header>DUNE FLIGHT LOG<strong>27.</strong></header><canvas id="sky"></canvas><footer><div><h1>East of the dunes</h1><p>Split-tail prototype · sewn silk · offshore breeze</p></div><label>BRIDLE TRIM <output id="degree"></output><input id="trim" type="range" min="-30" max="30" value="7"></label></footer><script>let c=sky.getContext('2d'),w,h,reduce=matchMedia('(prefers-reduced-motion:reduce)'),t=0;function size(){w=sky.clientWidth;h=sky.clientHeight;let d=Math.min(devicePixelRatio,2);sky.width=w*d;sky.height=h*d;c.setTransform(d,0,0,d,0,0);paint()}function paint(){let a=+trim.value/60,x=w*.65,y=h*.33,r=Math.min(w*.15,h*.22);degree.value=trim.value+'°';c.clearRect(0,0,w,h);c.strokeStyle='#80c9c9';for(let j=0;j<12;j++){c.beginPath();c.moveTo(0,h*(j+.4)/12);c.bezierCurveTo(w*.4,h*j/12,w*.8,h*(j+2)/12,w,h*(j+.1)/12);c.stroke()}c.strokeStyle='#486e69';c.beginPath();c.moveTo(0,h);c.quadraticCurveTo(x*.7,h*.85,x,y);c.stroke();c.save();c.translate(x,y);c.rotate(a+.15*Math.sin(t));c.fillStyle='#9b382d';c.beginPath();c.moveTo(0,-r);c.lineTo(r*.75,0);c.lineTo(r*.25,r);c.lineTo(0,r*.52);c.lineTo(-r*.35,r);c.lineTo(-r*.75,0);c.closePath();c.fill();c.fillStyle='#ffba71';c.beginPath();c.moveTo(0,-r);c.lineTo(-r*.75,0);c.lineTo(0,r*.52);c.fill();c.restore();for(let j=0;j<29;j++){let f=j/28,px=x+Math.sin(f*7+t+a)*r*f,py=y+r*.58+f*h*.51;c.save();c.translate(px,py);c.rotate(Math.cos(f*7+t)*.6);c.fillStyle=j%2?'#bc543b':'#eaa85e';c.beginPath();c.moveTo(-7,-3);c.lineTo(7,3);c.lineTo(7,-3);c.lineTo(-7,3);c.fill();c.restore()}}function tick(ms){if(!reduce.matches){t=ms*.0007;paint()}requestAnimationFrame(tick)}onresize=size;trim.oninput=paint;size();requestAnimationFrame(tick)</script></html>
