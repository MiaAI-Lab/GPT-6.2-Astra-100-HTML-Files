<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Pocket Loom</title><style>*{box-sizing:border-box}body{margin:0;background:#ead1bb;color:#694643;font:16px Georgia}main{width:min(93%,800px);margin:4vh auto}header{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid;gap:8px}h1{font:italic clamp(33px,6vw,65px) Georgia;margin:0}small{font:12px monospace}canvas{display:block;width:100%;height:54vh;margin:18px 0}footer{display:flex;align-items:center;justify-content:space-between;gap:12px}button{font:inherit;border:0;background:#694643;color:#fff1dc;padding:13px 20px;cursor:pointer}</style><main><header><h1>The pocket loom</h1><small>FEN &amp; FALLOW</small></header><canvas id="loom"></canvas><footer><div><small id="pick"></small><p>Fennel twill, a narrow band for gathering herbs.</p></div><button id="shuttle">Throw shuttle →</button></footer></main><script>let row=18;function draw(){let w=loom.clientWidth,h=loom.clientHeight,d=Math.min(2,devicePixelRatio),c=loom.getContext('2d');loom.width=w*d;loom.height=h*d;c.scale(d,d);let x=w*.13,W=w*.74,top=h*.07,bottom=h*.93,dy=(bottom-top)/40,dx=W/75;for(let j=0;j<75;j++){c.fillStyle=j%3?'#b78d6e':'#faf0d7';c.fillRect(x+j*dx,top,Math.max(1,dx*.38),bottom-top)}for(let k=0;k<row;k++){let y=bottom-(k+1)*dy;for(let j=0;j<75;j++){let colors=['#694643','#bc7456','#d6a35c','#eee1c0'],v=(Math.floor((j+k*.65)/8)+Math.floor(k/4))%4;c.fillStyle=colors[v];c.fillRect(x+j*dx,y,dx+.2,dy*.94);c.fillStyle=(j+k)%3?'#ffffff30':'#482e3240';c.fillRect(x+j*dx+1,y+1,dx*.35,dy*.7)}}for(let y of [top-7,bottom]){c.fillStyle='#7a513b';c.fillRect(x-13,y,W+26,8)}let y=bottom-row*dy-10;c.fillStyle='#663d31';c.beginPath();let sx=(row/2)%2?w*.78:w*.2;c.moveTo(sx-32,y);c.lineTo(sx,y-6);c.lineTo(sx+32,y);c.lineTo(sx,y+6);c.fill();pick.textContent='PICK '+row+' / 40';shuttle.textContent=row===40?'Lift swatch':(row/2)%2?'← Throw shuttle':'Throw shuttle →'}shuttle.onclick=()=>{row=row===40?0:Math.min(40,row+2);draw()};onresize=draw;draw()</script></html>
