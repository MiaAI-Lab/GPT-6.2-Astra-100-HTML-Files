<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pass Post</title><style>*{box-sizing:border-box}body{margin:0;background:#d0debc;color:#413c30;font:13px monospace}main{padding:3vw}header{display:flex;justify-content:space-between;align-items:center}h1{font:italic clamp(45px,8vw,110px)/1 Georgia;margin:0}svg{display:block;margin:2vh 0;width:100%;height:55vh;border-block:1px solid}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:none;color:inherit;border:1px solid;padding:10px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#413c30;color:#d0debc}button:focus-visible{outline:3px solid #9e3d2a}.ink{stroke-dasharray:1;animation:route 1.4s cubic-bezier(.3,.7,.3,1)}@keyframes route{from{stroke-dashoffset:1}}@media(max-width:650px){svg{height:43vh;background:repeating-linear-gradient(0deg,transparent 0 20px,#5d483b10 21px)}header{align-items:end}header span{font-size:10px}}@media(prefers-reduced-motion:reduce){.ink{animation:none}}</style><main><header><h1>Pass Post</h1><span>HIGH COUNTRY<br>MAIL SHEET 15</span></header><svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet" aria-label="Contour map of three fictional mountain passes"><g id="terrain"></g><g id="route"></g><g id="stations"></g></svg><nav></nav></main><script>for(let [x,y,rx,ry] of [[160,155,180,108],[420,290,205,150],[655,115,184,134],[60,435,125,90]])for(let j=1;j<24;j++){let d='';for(let k=0;k<=96;k++){let a=k*Math.PI/48,r=j/22*(1+.1*Math.sin(a*3+x)+.08*Math.cos(a*5+j*.07));d+=(k?'L':'M')+(x+Math.cos(a)*rx*r).toFixed(1)+' '+(y+Math.sin(a)*ry*r).toFixed(1)}terrain.innerHTML+='<path d="'+d+'Z" fill="none" stroke="#5d483b" opacity=".55" stroke-width="'+(j%5?.65:1.6)+'"/>'}let pts=[[260,104],[485,210],[590,76]],names=['Alder Notch','Flint Saddle','North Tooth'];pts.forEach(([x,y],i)=>{stations.innerHTML+='<circle cx="'+x+'" cy="'+y+'" r="6" fill="#a34832" stroke="#f2ebce" stroke-width="3"/>';let b=document.createElement('button');b.textContent='0'+(i+1)+'　'+names[i];document.querySelector('nav').append(b);b.onclick=()=>{document.querySelectorAll('button').forEach(v=>v.setAttribute('aria-pressed',v===b));route.innerHTML='<path class="ink" pathLength="1" d="M230 345 Q305 293 280 270 T320 218 Q'+(x-35)+' '+(y+50)+' '+x+' '+y+'" fill="none" stroke="#a34832" stroke-width="4"/>'}});document.querySelector('button').click()</script></html>
