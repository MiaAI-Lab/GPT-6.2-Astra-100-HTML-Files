<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Underpass in D</title><style>body{margin:0;background:#263439;color:#edb477;text-align:center;font-family:system-ui}header{margin-top:4vh}h1{font-weight:900;font-size:clamp(37px,7vw,93px);letter-spacing:-.075em;margin:.12em}small{font:12px monospace;letter-spacing:.16em}svg{display:block;width:min(100vw,1000px);max-height:52vh;margin:auto}nav{display:flex;justify-content:center;gap:6px;margin:.8em}button{background:#edb477;color:#263439;border:0;padding:13px 20px;cursor:pointer;font:bold 15px monospace}#sound{border:1px solid #aebcbc;background:none;color:#c7d0cb;font:14px Georgia}.lit{animation:lit .8s cubic-bezier(.1,.65,.3,1) both}@keyframes lit{0%,100%{stroke:#627174}38%{stroke:#ffca87}}@media(prefers-reduced-motion:reduce){.lit{animation-duration:.1s!important;animation-delay:0s!important}}</style><header><small>THE MUNICIPAL ECHO SOCIETY</small><h1>UNDERPASS IN D</h1></header><svg viewBox="0 0 680 340" aria-label="Tiled tunnel converging around an illuminated opening"><path d="M328 210v-25q12-23 24 0v25" fill="#edb477"/><path d="M4 327 340 199 676 327M115 340 340 199 564 340M272 340 340 199 408 340" fill="none" stroke="#4a585d"/><g id="floor" stroke="#415054"></g><g id="arches" fill="none" stroke="#627174"></g></svg><nav aria-label="Choir keys"><button data-hz="146.83">D₃</button><button data-hz="220">A₃</button><button data-hz="293.66">D₄</button></nav><button id="sound">Enable choir sound</button><script>for(let i=0;i<23;i++){let k=Math.pow(.87,i),x=340-336*k,y=199+128*k;arches.innerHTML+='<path d="M'+x+' '+y+'v'+(-115*k)+'a'+336*k+' '+190*k+' 0 0 1 '+672*k+' 0v'+115*k+'" stroke-width="'+(1+3*k)+'"/>'}for(let j=0;j<13;j++){let y=201+Math.pow(j/12,2)*139;floor.innerHTML+='<path d="M0 '+y+'h680"/>'}for(let j=0;j<=12;j++){let a=j*Math.PI/12,x=340+336*Math.cos(a),y=212-190*Math.sin(a);floor.innerHTML+='<path d="M340 199L'+x+' '+y+'"/>'}let a,enabled=false;sound.onclick=()=>{a||=new AudioContext();a.resume();enabled=!enabled;sound.textContent=enabled?'Mute choir':'Enable choir sound';sound.setAttribute('aria-pressed',enabled)};document.querySelectorAll('[data-hz]').forEach(b=>b.onclick=()=>{let paths=[...arches.children];paths.forEach(p=>p.classList.remove('lit'));arches.getBoundingClientRect();paths.forEach((p,i)=>{p.style.animationDelay=i*22+'ms';p.classList.add('lit')});if(enabled)for(let [mult,vol] of [[1,.11],[2,.045],[3,.03],[5,.022]]){let o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.frequency.value=+b.dataset.hz*mult;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.16);g.gain.exponentialRampToValueAtTime(.001,t+1.65);o.connect(g).connect(a.destination);o.start();o.stop(t+1.7)}})</script></html>
