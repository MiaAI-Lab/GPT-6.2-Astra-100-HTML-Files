<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duplicate in Blue</title><style>*{box-sizing:border-box}body{margin:0;background:#cbd1eb;color:#36477a;font:14px monospace}main{margin:5vw}h1{font:900 clamp(43px,8vw,100px)/1 Arial;letter-spacing:-.07em;margin:.2em 0}section{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0}article{position:relative;background:repeating-linear-gradient(#f2f1e9 0 27px,#a2b1c2 28px);box-shadow:4px 5px #8b97ad;padding:15px}article+article{background:repeating-linear-gradient(#e0e5ed 0 27px,#9aa8c4 28px)}header{font:bold 13px Arial;letter-spacing:.12em;border-bottom:2px solid;padding-bottom:12px}canvas{display:block;width:100%;height:34vh;touch-action:none}button{font:inherit;background:#36477a;color:#fff;border:0;padding:12px 17px;cursor:pointer}@media(max-width:650px){section{grid-template-columns:1fr;margin:15px 0}canvas{height:20vh}}</style><main><small>FORM B–17　 /　 RECORDS DEPARTMENT</small><h1>Carbon copy.</h1><p>Write on the original. File the blue impression.</p><section><article><header>01　ORIGINAL</header><canvas id="orig"></canvas></article><article><header>02　OFFICE DUPLICATE</header><canvas id="copy"></canvas></article></section><button id="spec">Insert flourish</button> <button id="clearPad">Clear forms</button></main><script>let paths=[],line;function specimen(){let a=[];for(let j=0;j<220;j++){let f=j/219;a.push([.1+f*.8+.043*Math.sin(f*12*Math.PI),.55+.21*Math.sin(f*12*Math.PI)*Math.sin(Math.PI*f)-f*.16])}paths.push(a);draw()}function draw(){[orig,copy].forEach((el,i)=>{let w=el.clientWidth,h=el.clientHeight,d=Math.min(devicePixelRatio,2);el.width=w*d;el.height=h*d;let c=el.getContext('2d');c.scale(w*d,h*d);c.strokeStyle=i?'#6879a6':'#36477a';c.lineWidth=(i?2:2.7)/w;c.lineCap='round';for(let a of paths){c.beginPath();a.forEach(([x,y])=>c.lineTo(x+i*.004,y+i*.006));c.stroke()}})}function point(e){let r=orig.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}orig.onpointerdown=e=>{orig.setPointerCapture(e.pointerId);line=[point(e)];paths.push(line)};orig.onpointermove=e=>{if(orig.hasPointerCapture(e.pointerId)){line.push(point(e));draw()}};spec.onclick=specimen;clearPad.onclick=()=>{paths=[];draw()};onresize=draw;specimen()</script></html>
