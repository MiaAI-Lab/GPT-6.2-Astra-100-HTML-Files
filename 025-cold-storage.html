<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drawer of Winter</title><style>*{box-sizing:border-box}body{background:#cfddeb;color:#385075;margin:0;font:13px monospace}main{width:min(840px,92vw);margin:4vh auto}h1{font:normal clamp(35px,5vw,65px) Georgia;margin:.2em 0}nav{display:flex;gap:4px}button{background:transparent;color:inherit;border:1px solid;border-bottom:0;padding:9px 15px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#385075;color:white}button:focus-visible{outline:3px solid #914636}section{border:1px solid;padding:15px;background:repeating-linear-gradient(90deg,transparent 0 24px,#3850751a 25px),repeating-linear-gradient(transparent 0 24px,#3850751a 25px)}svg{width:100%;height:50vh}.crystal{transform-origin:150px 150px;animation:freeze .7s cubic-bezier(.18,.75,.2,1)}@keyframes freeze{from{transform:scale(.3) rotate(-22deg);opacity:0}}p{font:italic 19px Georgia}@media(prefers-reduced-motion:reduce){.crystal{animation:none}}</style><main><small>COLD STORAGE　/　ACCESSION DRAWER</small><h1>Drawer of Winter</h1><nav><button>W—01</button><button>W—02</button><button>W—03</button></nav><section><svg viewBox="0 0 300 300" aria-label="Sixfold branched snow crystal"></svg><b></b></section><p></p></main><script>let bs=[...document.querySelectorAll('button')];bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(v=>v.setAttribute('aria-pressed',v===b));let arm='M0 0V-125',step=[13,20,17][i];for(let j=23;j<119;j+=step){let l=(125-j)*[.35,.55,.23][i]+3;arm+='M0 '+(-j)+'l'+l+' '+(-l*.6)+'M0 '+(-j)+'l'+(-l)+' '+(-l*.6);if(i!==1)for(let s of [-1,1])arm+='M'+(s*l*.65)+' '+(-j-l*.39)+'v'+(-l*.34)}let star='';for(let k=0;k<6;k++)star+='<path transform="translate(150 150) rotate('+k*60+')" d="'+arm+'"/>';document.querySelector('svg').innerHTML='<g class="crystal" fill="none" stroke="#385075" stroke-linecap="square" stroke-width="'+[2.4,4,1.7][i]+'">'+star+'</g>';document.querySelector('b').textContent=['01　/　SPLINTER RIDGE','02　/　LANTERN FELL','03　/　EAST WINDOW'][i];document.querySelector('p').textContent=['Fine combs, collected on a black wool sleeve.','Wide forks from the lee side of the summit.','Needlework caught at the edge of the sill.'][i]});bs[0].click()</script></html>
