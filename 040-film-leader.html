<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academy of Waiting</title><style>*{box-sizing:border-box}body{margin:0;background:#343330;color:#e2dfca;font:14px monospace;display:grid;place-content:center;min-height:100svh}main{width:min(94vw,830px)}header,footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 0}figure{position:relative;background:#e2dfca;margin:0;border-inline:clamp(25px,5vw,60px) solid #242421}figure:before,figure:after{content:'';position:absolute;top:0;bottom:0;width:10px;background:repeating-linear-gradient(#e2dfca 0 12px,transparent 12px 32px)}figure:before{left:-20px}figure:after{right:-20px}svg{width:100%;height:min(58vh,470px);display:block}button{border:1px solid #e2dfca;color:inherit;background:transparent;padding:12px;font:inherit;cursor:pointer}text{font:190px Impact,'Arial Black',sans-serif;fill:#343330}.title{font:bold 28px Georgia}</style><main><header><b>INTERVAL PICTURES</b><span>35 MM　/　B-W</span></header><figure><svg viewBox="0 0 400 300"><g id="clock"><path id="sweep" d="M200 150V-200L380 -200Z" fill="#b8b7aa"/><path d="M0 150h400M200 0v300" stroke="#626258"/><g fill="none" stroke="#fffef1" stroke-width="2"><circle cx="200" cy="150" r="110"/><circle cx="200" cy="150" r="102"/></g><text id="num" x="200" y="219" text-anchor="middle">5</text></g><text id="film" x="200" y="160" text-anchor="middle" class="title" visibility="hidden">THE LONG INTERVAL</text></svg></figure><footer><span id="label">HEAD LEADER / 05</span><button id="crank">Advance reel ↻</button></footer></main><script>let count=5;crank.onclick=()=>{count=count===0?5:count-1;num.textContent=count;clock.style.visibility=count?'visible':'hidden';film.setAttribute('visibility',count?'hidden':'visible');label.textContent=count?'HEAD LEADER / 0'+count:'PICTURE START / REEL 1';crank.textContent=count?'Advance reel ↻':'Rewind ↶';if(count&&!matchMedia('(prefers-reduced-motion:reduce)').matches){sweep.style.transformOrigin='200px 150px';sweep.animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:520,easing:'cubic-bezier(.35,0,.6,1)'})}}</script></html>
