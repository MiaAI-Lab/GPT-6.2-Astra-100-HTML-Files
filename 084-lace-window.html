<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sixfold Scissors</title><style>body{margin:0;background:repeating-linear-gradient(90deg,#cddce1 0 24.8%,#bfd1d8 25%);color:#384e62;text-align:center;font-family:Georgia}main{padding:3vh 4vw}h1{font:italic clamp(38px,6vw,78px)/1 Georgia;margin:.25em}svg{display:block;width:min(82vw,58vh);margin:2vh auto;filter:drop-shadow(4px 8px 3px #586f8666);cursor:crosshair;touch-action:manipulation}button{font:italic 16px Georgia;background:#f5f4eb;color:#384e62;border:1px solid;padding:10px 20px}small{font:12px monospace;letter-spacing:.1em}</style><main><small>THE FOLDED PAPER WORKROOM</small><h1>Sixfold scissors</h1><svg id="sheet" viewBox="-130 -130 260 260" tabindex="0" role="button" aria-label="Punch twelve matching holes"><defs><mask id="lace"><path id="rim" fill="white"/><g id="motif"></g><g id="cuts"></g></mask></defs><rect x="-130" y="-130" width="260" height="260" fill="#fffdf3" mask="url(#lace)"/></svg><p>Touch the sheet. Every fold remembers the cut.</p><button id="fresh">Begin a fresh sheet</button></main><script>let points=[];for(let i=0;i<=720;i++){let a=i*Math.PI/360,r=112+5*Math.cos(a*24);points.push((i?'L':'M')+r*Math.cos(a)+' '+r*Math.sin(a))}rim.setAttribute('d',points.join(' ')+'Z');for(let i=0;i<12;i++)motif.innerHTML+='<g transform="rotate('+i*30+')"><path d="M0-25Q-13-41 0-60Q13-41 0-25ZM0-67Q-8-79 0-91Q8-79 0-67Z"/><path d="m13-83 5-10 2 12-5 7z"/><circle cy="-101" r="3"/><circle cx="8" cy="-104" r="2"/></g>';let count=0;function punch(x,y){if(Math.hypot(x,y)>110)return;for(let i=0;i<12;i++)cuts.innerHTML+='<ellipse transform="rotate('+i*30+')" cx="'+x+'" cy="'+y+'" rx="2.4" ry="4"/>';count++;if(count>24){for(let j=0;j<12;j++)cuts.firstChild.remove();count--}}sheet.onclick=e=>{let p=new DOMPoint(e.clientX,e.clientY).matrixTransform(sheet.getScreenCTM().inverse());punch(p.x,p.y)};sheet.onkeydown=e=>{if(e.key==='Enter')punch(7,22+count*11%79)};fresh.onclick=()=>{cuts.innerHTML='';count=0}</script></html>
